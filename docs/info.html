<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1668dc">
<title>信息查询</title>
<link rel="stylesheet" href="./app.css">
<style>
  .note{font-size:12px;color:var(--sub);line-height:1.65;background:#f7f8fa;border-radius:10px;padding:10px 12px;margin-bottom:12px}
  .note b{color:var(--text)}
  .note.ok{background:#e6f7f1;color:var(--ok)}
  .note.bad{background:#fff2ef;color:var(--warn)}
  .big{font:700 26px/1.25 ui-monospace,Menlo,Consolas,monospace;text-align:center;color:var(--primary);margin:2px 0 12px;font-variant-numeric:tabular-nums}
  .big small{font-size:14px;color:var(--sub);font-weight:400}
  .bjs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:12px}
  .bjs div{background:#f7f8fa;border-radius:8px;padding:7px 9px;font-size:13px}
  .bjs span{color:var(--sub);font-size:11px;margin-right:4px}
</style>
</head>
<body>
<header>
  <h1>信息查询</h1>
  <p>身份证解析 · 百家姓排名 · 尺码对照</p>
</header>

<main>
  <div class="tabs" id="tabs">
    <button data-tab="id" class="on">身份证解析</button>
    <button data-tab="bjs">百家姓</button>
    <button data-tab="size">尺码对照</button>
  </div>

  <!-- 身份证 -->
  <section id="panel-id">
    <section class="card">
      <h2>身份证号码</h2>
      <div class="row">
        <div class="input-wrap"><input type="text" id="id-in" value="11010119900307751X" maxlength="18" autocomplete="off"><span class="unit">18 位</span></div>
      </div>
      <p class="hint">按 GB 11643 的校验规则验证末位，解析出生日期、性别与籍贯。本页不联网，号码不会离开浏览器。</p>
    </section>
    <div class="btns">
      <button type="button" class="ghost" id="id-clear">清空</button>
      <button type="button" class="primary" id="id-run">解析</button>
    </div>
    <section class="card">
      <h2>结果</h2>
      <div class="big" id="id-big">—</div>
      <div class="grid" id="id-out"></div>
      <div class="note" id="id-note"></div>
    </section>
  </section>

  <!-- 百家姓 -->
  <section id="panel-bjs">
    <section class="card">
      <h2>查姓氏排名</h2>
      <div class="row">
        <input type="text" id="bj-q" placeholder="输入一个姓，如 张 / 王 / 欧阳">
      </div>
      <p class="hint">按常见百家姓的顺序收录，排名为大致顺序（来源于民间流传的排序，非官方人口普查排名）。</p>
    </section>
    <div class="btns">
      <button type="button" class="ghost" id="bj-clear">清空</button>
      <button type="button" class="primary" id="bj-run">查询</button>
    </div>
    <section class="card">
      <h2>结果</h2>
      <div class="grid" id="bj-out"></div>
      <p class="hint err" id="bj-err" hidden></p>
    </section>
    <section class="card">
      <h2>前 100 个常见姓氏</h2>
      <div class="bjs" id="bj-list"></div>
    </section>
  </section>

  <!-- 尺码 -->
  <section id="panel-size" hidden>
    <section class="card">
      <h2>衣服 / 鞋子尺码对照</h2>
      <div class="seg" id="sz-kind">
        <button data-kind="cloth-f" class="on">女装上衣</button>
        <button data-kind="cloth-m">男装上衣</button>
        <button data-kind="pants">裤子（腰围）</button>
        <button data-kind="shoes-f">女鞋</button>
        <button data-kind="shoes-m">男鞋</button>
      </div>
      <div class="row" id="sz-input-row">
        <label id="sz-label">身高 / 胸围</label>
        <div class="grid2">
          <input type="number" id="sz-a" value="160" step="1">
          <input type="number" id="sz-b" value="84" step="1">
        </div>
      </div>
      <p class="hint">对照表为常见国标尺码，不同品牌版型差异较大，最终以试穿为准。</p>
    </section>
    <div class="btns">
      <button type="button" class="ghost" id="sz-reset">重置</button>
      <button type="button" class="primary" id="sz-run">换算</button>
    </div>
    <section class="card">
      <h2>结果</h2>
      <div class="big" id="sz-big">—</div>
      <div class="grid" id="sz-out"></div>
      <div class="note" id="sz-note"></div>
    </section>
  </section>

  <footer>
    纯本地计算，不上传任何内容<br>
    <a href="./tools.html">← 工具目录</a>·<a href="./index.html">工具入口</a>
  </footer>
</main>

<script src="./app.js"></script>
<script src="./info.js"></script>
</body>
</html>
