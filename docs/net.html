<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1668dc">
<title>网络计算</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header>
  <h1>网络计算</h1>
  <p>IPv4 子网划分 / MAC 解析 / 进制与位运算</p>
</header>

<main>

  <div class="tabs" id="tabs">
    <button data-tab="subnet" class="on">IPv4 子网</button>
    <button data-tab="mac">MAC 解析</button>
  </div>

  <section class="card">
    <h2>输入</h2>
    <div id="fields"></div>
    <p class="hint" id="hint"></p>
  </section>

  <div class="btns"><button type="button" class="ghost" id="reset">重置</button><button type="button" class="primary" id="run">计算</button></div>

  <section class="card">
    <h2>结果</h2>
    <div id="out" style="margin-bottom:12px"></div>
    <table id="table"></table>
  </section>

  <footer>
    纯本地计算；子网计算按有类/无类统一的位运算实现<br>
    <a href="./index.html">返回首页</a>
  </footer>
</main>

<script src="./app.js"></script>
<script src="./net.js"></script>
</body>
</html>
