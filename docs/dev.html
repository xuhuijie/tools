<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1668dc">
<title>开发工具</title>
<style>
/* 工具页共用样式：与仓库既有单文件页保持同一套视觉，抽出来避免十个页面各写一遍 */
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1f2329;--sub:#8a9099;--line:#e8eaed;
  --primary:#1668dc;--primary-press:#0f52b3;--soft:#e8f1fd;--soft-line:#c3dbfb;
  --warn:#d4380d;--ok:#0f8f74;--radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
header{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(135deg,#1668dc,#3b8bf0);color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
header h1{margin:0;font-size:17px;font-weight:600}
header p{margin:4px 0 0;font-size:12px;opacity:.9}
main{max-width:1280px;margin:0 auto;padding:12px 16px 0}
.card{
  background:var(--card);border-radius:var(--radius);
  padding:14px 14px 2px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.card h2{margin:0 0 10px;font-size:14px;font-weight:600}
.row{margin-bottom:12px}
.row label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.row label b{color:var(--text);font-weight:500}
.input-wrap{position:relative;display:flex;align-items:center}
input[type="number"],input[type="text"],input[type="datetime-local"],select{
  width:100%;height:46px;padding:0 12px;
  font-size:16px;color:var(--text);
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  outline:none;font-family:inherit;
}
input[type="number"]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus,select:focus{border-color:var(--primary);background:#fff}
input.invalid{border-color:var(--warn);background:#fff2ef}
.input-wrap .unit{position:absolute;right:12px;font-size:12px;color:var(--sub);pointer-events:none}
.input-wrap input[type="number"]{padding-right:64px}
textarea{
  width:100%;min-height:130px;padding:10px 12px;
  font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--text);
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  outline:none;resize:vertical;
}
textarea:focus{border-color:var(--primary);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin:2px 0 14px}
.btns button{flex:1;height:48px;font-size:16px;font-weight:600;border-radius:12px;border:none}
.btns button.primary{background:var(--primary);color:#fff}
.btns button.primary:active{background:var(--primary-press)}
.btns button.ghost{flex:0 0 96px;background:#fff;color:var(--text);border:1px solid var(--line)}
.btns.three button.ghost{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{
  padding:0 12px;height:32px;font-size:13px;color:var(--primary);
  background:var(--soft);border:1px solid var(--soft-line);border-radius:9px;
}
.chips button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.hint{font-size:12px;color:var(--sub);margin:6px 0 0;line-height:1.5}
.hint.err{color:var(--warn)}
.out{
  font:13px/1.7 ui-monospace,Menlo,Consolas,monospace;
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:12px;word-break:break-all;white-space:pre-wrap;
}
.out:empty{display:none}
.out.mono-lg{font-size:15px}
.out.err{color:var(--warn);background:#fff2ef;border-color:#ffd6cf}
.out.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.grid div{background:#fff;padding:10px 12px}
.grid .k{font-size:12px;color:var(--sub)}
.grid .v{font-size:16px;font-weight:600;margin-top:2px;word-break:break-all}
.formula{
  font-size:12px;color:var(--sub);line-height:1.6;
  background:#f7f8fa;border-radius:10px;padding:10px 12px;margin-bottom:12px;
  word-break:break-all;
}
.formula .t{color:var(--text);font-weight:600}
.formula code{font-family:ui-monospace,Menlo,Consolas,monospace;color:#4b5563}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);word-break:break-all}
th{color:var(--sub);font-weight:500}
td.num{font-family:ui-monospace,Menlo,Consolas,monospace}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pick button{
  padding:0 12px;height:34px;font-size:13px;border-radius:9px;
  background:#fff;color:var(--text);border:1px solid var(--line);
}
.pick button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.list{margin:0 0 12px;padding:0;list-style:none}
.list li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:none}
.list a{color:var(--primary);text-decoration:none;font-weight:500}
.list .d{display:block;font-size:12px;color:var(--sub);margin-top:2px;line-height:1.45}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.tabs button{
  flex:0 0 auto;padding:0 14px;height:34px;font-size:13px;border-radius:9px;
  background:#fff;color:var(--sub);border:1px solid var(--line);
}
.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
footer{max-width:1280px;margin:0 auto;padding:0 16px;font-size:12px;color:var(--sub);text-align:center;line-height:1.7}
footer a{color:var(--primary);text-decoration:none;margin:0 6px}
@media(max-width:360px){.grid2{grid-template-columns:1fr}}
</style>
<style>
  .area{width:100%;min-height:190px;padding:10px 12px;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;
    color:var(--text);background:#f7f8fa;border:1px solid var(--line);border-radius:10px;outline:none;resize:vertical}
  .area:focus{border-color:var(--primary);background:#fff}
  .diff{font:12px/1.7 ui-monospace,Menlo,Consolas,monospace;background:#f7f8fa;border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:12px;max-height:340px;overflow:auto;white-space:pre}
  .diff .ln{display:flex;gap:8px}
  .diff .no{flex:0 0 34px;text-align:right;color:#b6bcc4;user-select:none}
  .diff .tx{flex:1;white-space:pre-wrap;word-break:break-all}
  .diff .add{background:#e7f8f1}
  .diff .add .tx{color:#0a7a5f}
  .diff .del{background:#fdeeea}
  .diff .del .tx{color:#b03010;text-decoration:line-through}
  .diff .same{color:#8a9099}
  .jwt{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .jwt div{background:#fff;padding:10px 12px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
  .jwt .k{color:var(--sub);font-size:11px;margin-bottom:3px;display:block}
  .jwt .p1{color:#c0392b}
  .jwt .p2{color:#8e44ad}
  .jwt .p3{color:#1e7fbf}
  .jwt .dot{color:#b6bcc4}
  .stat{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .stat div{background:#fff;padding:10px 12px;text-align:center}
  .stat b{display:block;font-size:20px;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace}
  .stat b.g{color:var(--ok)}.stat b.r{color:var(--warn)}
  .stat span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
</style>
</head>
<body>
<header>
  <h1>开发工具</h1>
  <p>JSON / SQL 格式化 · 文本对比 · JWT 解析</p>
</header>

<main>
  <div class="tabs" id="tabs">
    <button data-tab="json" class="on">JSON 格式化</button>
    <button data-tab="sql">SQL 格式化</button>
    <button data-tab="diff">文本对比</button>
    <button data-tab="jwt">JWT 解析</button>
  </div>

  <!-- JSON -->
  <section id="panel-json">
    <section class="card">
      <h2>输入 JSON</h2>
      <textarea class="area" id="json-in" placeholder='{"name":"计量","list":[1,2,3],"nest":{"a":true}}'></textarea>
      <p class="hint" id="json-hint">支持自动识别 JSON / JSON5 风格的尾逗号与注释（解析前会剔除）。</p>
    </section>
    <div class="row">
      <label>缩进</label>
      <div class="chips" id="json-indent">
        <button data-ind="2" class="on">2 空格</button>
        <button data-ind="4">4 空格</button>
        <button data-ind="0">压缩成一行</button>
        <button data-ind="tab">Tab</button>
      </div>
    </div>
    <div class="btns"><button type="button" class="ghost" id="json-min">压缩</button><button type="button" class="primary" id="json-run">格式化</button></div>
    <section class="card">
      <h2>结果<span class="stat" style="margin-top:10px">
        <div><b id="js-size-in">0</b><span>输入字节</span></div>
        <div><b id="js-size-out">0</b><span>输出字节</span></div>
        <div><b id="js-depth">0</b><span>嵌套层数</span></div>
      </span></h2>
      <textarea class="area" id="json-out" readonly></textarea>
      <div class="btns three" style="margin-top:12px"><button type="button" class="ghost" id="json-copy">复制结果</button><button type="button" class="ghost" id="json-to-js">转 JS 对象</button></div>
    </section>
    <p class="hint" id="json-err"></p>
  </section>

  <!-- SQL -->
  <section id="panel-sql" hidden>
    <section class="card">
      <h2>输入 SQL</h2>
      <textarea class="area" id="sql-in" placeholder="select id,name from users where age>18 and city='北京' order by id desc;"></textarea>
    </section>
    <div class="row">
      <label>关键字大小写</label>
      <div class="chips" id="sql-case">
        <button data-case="upper" class="on">大写</button>
        <button data-case="lower">小写</button>
        <button data-case="keep">保持原样</button>
      </div>
    </div>
    <div class="row">
      <label>每个字段/条件</label>
      <div class="chips" id="sql-break">
        <button data-break="0" class="on">不换行</button>
        <button data-break="1">换行</button>
      </div>
    </div>
    <div class="btns"><button type="button" class="ghost" id="sql-min">压缩</button><button type="button" class="primary" id="sql-run">格式化</button></div>
    <section class="card">
      <h2>结果</h2>
      <textarea class="area" id="sql-out" readonly></textarea>
      <div class="btns three" style="margin-top:12px"><button type="button" class="ghost" id="sql-copy">复制结果</button></div>
    </section>
    <p class="hint" id="sql-err"></p>
  </section>

  <!-- 文本对比 -->
  <section id="panel-diff" hidden>
    <section class="card">
      <h2>原文</h2>
      <textarea class="area" id="diff-a"></textarea>
    </section>
    <section class="card">
      <h2>新文</h2>
      <textarea class="area" id="diff-b"></textarea>
    </section>
    <div class="row">
      <label>对比方式</label>
      <div class="chips" id="diff-mode">
        <button data-mode="line" class="on">按行</button>
        <button data-mode="word">按词</button>
        <button data-mode="char">按字符</button>
      </div>
    </div>
    <div class="chips" id="diff-opt">
      <button data-opt="trim" class="on">忽略行首尾空格</button>
      <button data-opt="case">忽略大小写</button>
      <button data-opt="blank" class="on">忽略空行</button>
    </div>
    <div class="btns"><button type="button" class="ghost" id="diff-swap">左右互换</button><button type="button" class="primary" id="diff-run">对比</button></div>
    <section class="card">
      <h2>差异</h2>
      <div class="stat">
        <div><b class="g" id="d-add">0</b><span>新增</span></div>
        <div><b class="r" id="d-del">0</b><span>删除</span></div>
        <div><b id="d-same">0</b><span>相同</span></div>
      </div>
      <div class="diff" id="diff-out"></div>
      <p class="hint">对比基于最长公共子序列（LCS）。删除行标红并加删除线，新增行标绿。</p>
    </section>
  </section>

  <!-- JWT -->
  <section id="panel-jwt" hidden>
    <section class="card">
      <h2>输入 JWT</h2>
      <textarea class="area" id="jwt-in" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NSJ9.xxx"></textarea>
      <p class="hint">只在本地拆解 Base64URL 载荷，不做签名校验（验签需密钥，本页不联网）。</p>
    </section>
    <div class="btns"><button type="button" class="ghost" id="jwt-clear">清空</button><button type="button" class="primary" id="jwt-run">解析</button></div>
    <section class="card">
      <h2>结构</h2>
      <div class="jwt" id="jwt-parts"></div>
      <div class="grid" id="jwt-grid"></div>
      <div class="out" id="jwt-out"></div>
    </section>
  </section>

  <footer>
    全部在浏览器本地计算，不上传任何内容<br>
    <a href="./index.html">返回首页</a>
  </footer>
</main>

<script>
/* 工具页共用小工具：取元素、格式化、复制、页签切换 */
(function (global) {
  'use strict';

  // 复制到剪贴板：HTTPS/本地才用异步 API，其余回退到 execCommand
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacy(text); });
    }
    return Promise.resolve(legacy(text));
  }

  function legacy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  // 保留 digits 位小数并去掉长浮点尾巴
  function fmt(n, digits) {
    if (!isFinite(n)) return '—';
    var d = digits == null ? 4 : digits;
    return Number(n.toFixed(d)).toLocaleString('zh-CN', { maximumFractionDigits: d });
  }

  // 写回输入框的数值，避免 0.30000000000000004 这类尾巴
  function fmtInput(n, digits) {
    if (!isFinite(n)) return '';
    return String(Number(n.toFixed(digits == null ? 6 : digits)));
  }

  function $(id) { return document.getElementById(id); }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  // 在容器内渲染 label/value 网格
  function cells(container, pairs) {
    container.innerHTML = '';
    pairs.forEach(function (p) {
      var cell = el('div');
      cell.appendChild(el('div', 'k', p[0]));
      cell.appendChild(el('div', 'v', p[1]));
      container.appendChild(cell);
    });
  }

  // 复制按钮通用绑定：btn 复制 target 的文本，成功后短暂改文案
  function bindCopy(btn, getText, doneText) {
    if (!btn) return;
    var original = btn.textContent;
    btn.addEventListener('click', function () {
      var text = getText();
      if (!text) return;
      copy(text).then(function () {
        btn.textContent = doneText || '已复制';
        setTimeout(function () { btn.textContent = original; }, 1200);
      });
    });
  }

  // 页签：buttons 为一组按钮，onPick 收到 data-tab
  function tabs(container, onPick) {
    var btns = [].slice.call(container.querySelectorAll('button'));
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        btns.forEach(function (o) { o.classList.toggle('on', o === b); });
        syncHash(b.dataset.tab);
        onPick(b.dataset.tab, b);
      });
    });
    return btns;
  }

  // 把按钮高亮对齐到 name。点击时 tabs() 已经切过，但初始化是从 hash 进来的，
  // 未必等于 HTML 里写死 class="on" 的那个，所以各页的 setTab 里要再调一次。
  function markTab(name) {
    [].forEach.call(document.querySelectorAll('#tabs button'), function (b) {
      b.classList.toggle('on', b.dataset.tab === name);
    });
  }

  // 切页签时把页签名写回地址，刷新与分享都能停在同一个工具上
  function syncHash(name) {
    if (!global.history || !global.history.replaceState) return;
    global.history.replaceState(null, '', '#' + name);
  }

  // 地址 hash 指定页签：#<页签名>，如 number.html#divisor。
  // 首页每条工具都带着 href="./page.html#tab" 过来，没有它就永远落回默认页签。
  function hashTab() {
    var h = String(global.location && global.location.hash || '').replace(/^#/, '');
    return /^[a-z0-9]+$/i.test(h) ? h : null;
  }

  // 打开页面时该选哪个页签：优先地址 hash（且必须是本页真实存在的页签），否则 defaultTab。
  function firstTab(defaultTab) {
    var want = hashTab();
    if (!want) return defaultTab;
    var btns = [].slice.call(document.querySelectorAll('#tabs button'));
    var ok = btns.some(function (b) { return b.dataset.tab === want; });
    return ok ? want : defaultTab;
  }

  global.T = { $: $, el: el, fmt: fmt, fmtInput: fmtInput, cells: cells, copy: copy, bindCopy: bindCopy, tabs: tabs, hashTab: hashTab, firstTab: firstTab, syncHash: syncHash, markTab: markTab };
})(window);
</script>
<script>
/* 开发工具：JSON 格式化、SQL 格式化、文本对比、JWT 解析
   全部本地计算。纯函数集中在文件前部，便于测试脚本取向量。 */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 通用：去掉注释与尾逗号，让 JSON 更宽容 ----------
     JSON5 风格。逐字符扫描，字符串内的 // 和 , 不动。 */
  function stripJsonLoose(src) {
    var out = '';
    var i = 0;
    var inStr = false, quote = '', esc = false;
    while (i < src.length) {
      var c = src[i];
      if (inStr) {
        out += c;
        if (esc) esc = false;
        else if (c === '\\') esc = true;
        else if (c === quote) inStr = false;
        i++;
        continue;
      }
      if (c === '"' || c === "'") { inStr = true; quote = c; out += c; i++; continue; }
      if (c === '/' && src[i + 1] === '/') {
        while (i < src.length && src[i] !== '\n') i++;
        continue;
      }
      if (c === '/' && src[i + 1] === '*') {
        i += 2;
        while (i < src.length && !(src[i] === '*' && src[i + 1] === '/')) i++;
        i += 2;
        continue;
      }
      out += c; i++;
    }
    // 尾逗号：, 后面（含空白）紧跟 } 或 ]
    out = out.replace(/,(\s*[}\]])/g, '$1');
    return out;
  }

  /* 统计 JSON 嵌套层数（不含最外层） */
  function jsonDepth(v) {
    if (v === null || typeof v !== 'object') return 0;
    var child = 0;
    var arr = Array.isArray(v) ? v : Object.keys(v).map(function (k) { return v[k]; });
    arr.forEach(function (x) { child = Math.max(child, jsonDepth(x)); });
    return child + 1;
  }

  function byteLen(s) { return new TextEncoder().encode(s).length; }
  function utf8Len(s) { return byteLen(s); }

  var JSON_INDENT = 2;

  function fmtJson(src, indent) {
    var text = stripJsonLoose(String(src == null ? '' : src).trim());
    if (!text) return { err: '请先粘贴 JSON 内容。' };
    var data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      // 带出出错位置，便于定位
      var m = /position (\d+)/.exec(e.message);
      var at = m ? '（第 ' + (+m[1] + 1) + ' 个字符附近）' : '';
      return { err: '不是合法 JSON' + at + '：' + e.message };
    }
    var pad;
    if (indent === 0) pad = null;
    else if (indent === 'tab') pad = '\t';
    else pad = indent;
    var out = pad === null ? JSON.stringify(data) : JSON.stringify(data, null, pad);
    return { text: out, value: data, depth: jsonDepth(data) };
  }

  /* 转成 JS 对象字面量：给键加引号与否都行，这里保持 JSON 形式但对 Date 类字符串不动 */
  function jsonToJsObject(src) {
    var r = fmtJson(src, 2);
    if (r.err) return r;
    var t = r.text;
    // 已经是合法 JSON，JS 字面量可直接解析；仅把顶层无引号的键情形忽略
    return { text: 'const data = ' + t + ';', value: r.value };
  }

  /* ---------- SQL 格式化 ----------
     思路：先把字符串字面量与注释挖出来存成占位符，避免关键字替换误伤，
     替换完再还原。这是 SQL 美化能不能用的关键。 */
  var SQL_KEYWORDS = ['SELECT', 'FROM', 'WHERE', 'AND', 'OR', 'NOT', 'IN', 'LIKE', 'BETWEEN', 'IS', 'NULL',
    'INSERT', 'INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE', 'CREATE', 'TABLE', 'ALTER', 'DROP', 'INDEX',
    'VIEW', 'JOIN', 'INNER', 'LEFT', 'RIGHT', 'FULL', 'OUTER', 'CROSS', 'ON', 'AS', 'GROUP', 'BY',
    'ORDER', 'HAVING', 'LIMIT', 'OFFSET', 'UNION', 'ALL', 'DISTINCT', 'CASE', 'WHEN', 'THEN', 'ELSE', 'END',
    'ASC', 'DESC', 'EXISTS', 'COUNT', 'SUM', 'AVG', 'MAX', 'MIN', 'PRIMARY', 'KEY', 'FOREIGN', 'REFERENCES',
    'DEFAULT', 'UNIQUE', 'CHECK', 'WITH', 'TOP', 'OVER', 'PARTITION', 'ROW_NUMBER'];

  var SQL_NEWLINE_BEFORE = ['SELECT', 'FROM', 'WHERE', 'GROUP BY', 'ORDER BY', 'HAVING', 'LIMIT', 'OFFSET',
    'UNION', 'UNION ALL', 'INSERT INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE FROM', 'CREATE TABLE', 'AND', 'OR', 'JOIN'];

  function sqlTokens(src, breakFields) {
    var text = String(src == null ? '' : src);
    var holes = [];
    function stash(s) {
      holes.push(s);
      return '\u0001' + (holes.length - 1) + '\u0001';
    }
    // 挖字符串、反引号标识符、注释
    text = text.replace(/'(?:[^'\\]|\\.|'')*'/g, function (m) { return stash(m); });
    text = text.replace(/"(?:[^"\\]|\\.)*"/g, function (m) { return stash(m); });
    text = text.replace(/`[^`]*`/g, function (m) { return stash(m); });
    text = text.replace(/--[^\n]*/g, function (m) { return stash(m); });
    text = text.replace(/\/\*[\s\S]*?\*\//g, function (m) { return stash(m); });

    text = text.replace(/\s+/g, ' ').trim();
    // 把多字关键字先合成一个标记
    var MULTI = ['UNION ALL', 'GROUP BY', 'ORDER BY', 'INSERT INTO', 'DELETE FROM', 'CREATE TABLE',
      'LEFT JOIN', 'RIGHT JOIN', 'INNER JOIN', 'FULL JOIN', 'OUTER JOIN', 'IS NOT', 'NOT IN', 'NOT LIKE'];
    MULTI.forEach(function (m) {
      text = text.replace(new RegExp('\\b' + m.replace(/ /g, '\\s+') + '\\b', 'gi'), '\u0002' + m + '\u0002');
    });
    return { text: text, holes: holes };
  }

  function fmtSql(src, opts) {
    opts = opts || {};
    var cased = opts.caseMode || 'upper';
    var breakFields = !!opts.breakFields;
    var text = String(src == null ? '' : src).trim();
    if (!text) return { err: '请先粘贴 SQL 语句。' };

    var st = sqlTokens(text);
    var t = st.text;

    // 关键字大小写
    if (cased !== 'keep') {
      var kwRe = new RegExp('\\b(' + SQL_KEYWORDS.join('|') + ')\\b', 'gi');
      t = t.replace(kwRe, function (m) {
        return cased === 'upper' ? m.toUpperCase() : m.toLowerCase();
      });
      // 多字标记内的两段也一并处理
      t = t.replace(/\u0002([^\u0002]+)\u0002/g, function (_, m) {
        return m.split(/\s+/).map(function (w) {
          return SQL_KEYWORDS.indexOf(w.toUpperCase()) >= 0 ? (cased === 'upper' ? w.toUpperCase() : w.toLowerCase()) : w;
        }).join(' ');
      });
    } else {
      t = t.replace(/\u0002([^\u0002]+)\u0002/g, '$1');
    }

    // 主关键字前换行
    var NEWLINE_RE = /\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|HAVING|LIMIT|OFFSET|UNION ALL|UNION|INSERT INTO|VALUES|UPDATE|SET|DELETE FROM|CREATE TABLE|AND|OR|LEFT JOIN|RIGHT JOIN|INNER JOIN|FULL JOIN|JOIN)\b/g;
    t = t.replace(/\s+/g, ' ');
    // 统一在逗号后加空格
    t = t.replace(/\s*,\s*/g, ', ');
    // 括号内侧不留空格
    t = t.replace(/\(\s+/g, '(').replace(/\s+\)/g, ')');

    if (breakFields) {
      t = t.replace(/\s*,\s*/g, ',\n  ');
      var lines = t.split('\n');
      lines = lines.map(function (ln) { return ln.trim(); });
      t = lines.join('\n');
    }

    t = t.replace(NEWLINE_RE, function (m, kw) { return '\n' + kw; });
    // 缩进：主关键字顶格，其余缩进两格
    var out = t.split('\n').map(function (ln) {
      ln = ln.replace(/\s+/g, ' ').trim();
      if (!ln) return '';
      var isMain = /^(SELECT|FROM|WHERE|GROUP BY|ORDER BY|HAVING|LIMIT|OFFSET|UNION|UNION ALL|INSERT INTO|VALUES|UPDATE|SET|DELETE FROM|CREATE TABLE)\b/i.test(ln);
      return (isMain ? '' : '  ') + ln;
    }).filter(function (ln, i, a) { return !(ln === '' && a[i - 1] === ''); }).join('\n');

    // 还原占位符
    out = out.replace(/\u0001(\d+)\u0001/g, function (_, n) { return st.holes[+n]; });
    out = out.replace(/\u0002([^\u0002]+)\u0002/g, function (_, m) { return m; });
    return { text: out.trim() };
  }

  function minSql(src) {
    var text = String(src == null ? '' : src);
    var st = sqlTokens(text);
    var t = st.text.replace(/\s+/g, ' ').trim();
    t = t.replace(/\s*,\s*/g, ',').replace(/\(\s+/g, '(').replace(/\s+\)/g, ')');
    // 运算符两侧不留空格（字符串与注释已被占位符保护）
    t = t.replace(/\s*([=<>!+\-*\/%|&]+)\s*/g, '$1');
    t = t.replace(/\u0001(\d+)\u0001/g, function (_, n) { return st.holes[+n]; });
    t = t.replace(/\u0002([^\u0002]+)\u0002/g, '$1');
    return { text: t };
  }

  /* ---------- 文本对比：LCS + 回溯 ----------
     行级对比用 LCS 最直观；词/字符级复用同一套，只要换切分方式。 */
  function tokenize(s, mode) {
    if (mode === 'char') return s.split('');
    if (mode === 'word') return s.split(/(\s+)/).filter(function (x) { return x !== ''; });
    return s.split('\n');
  }

  function lcsDiff(a, b) {
    var n = a.length, m = b.length;
    // 超长输入建表会炸内存，先做个上限保护
    if (n * m > 4e6) return null;
    // 滚动数组存长度，另开一维用于回溯（Uint32 省内存）
    var dp = [];
    for (var i = 0; i <= n; i++) dp.push(new Uint32Array(m + 1));
    for (i = n - 1; i >= 0; i--) {
      for (var j = m - 1; j >= 0; j--) {
        dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    var res = [];
    i = 0; j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { res.push({ t: 'same', v: a[i] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { res.push({ t: 'del', v: a[i] }); i++; }
      else { res.push({ t: 'add', v: b[j] }); j++; }
    }
    while (i < n) { res.push({ t: 'del', v: a[i] }); i++; }
    while (j < m) { res.push({ t: 'add', v: b[j] }); j++; }
    return res;
  }

  /* 词/字符级时把连续同类合并成一段，避免输出碎片化 */
  function mergeRuns(ops) {
    var out = [];
    ops.forEach(function (op) {
      var last = out[out.length - 1];
      if (last && last.t === op.t) last.v += op.v;
      else out.push({ t: op.t, v: op.v });
    });
    return out;
  }

  function diffText(a, b, opts) {
    opts = opts || {};
    var A = tokenize(a, opts.mode);
    var B = tokenize(b, opts.mode);
    function norm(x) {
      var s = x;
      if (opts.trim) s = s.trim();
      if (opts.case) s = s.toLowerCase();
      return s;
    }
    if (opts.blank && opts.mode !== 'line') {
      A = A.filter(function (x) { return x.trim() !== ''; });
      B = B.filter(function (x) { return x.trim() !== ''; });
      opts = Object.assign({}, opts, { blank: false });
    }
    var na = A.map(norm), nb = B.map(norm);
    if (opts.blank) {
      /* 空行不参与匹配，但两侧的空行本质上是等价内容：
         先把空行剔出去做 LCS，再把空行当成 same 插回去，展示上就不丢行。 */
      var ia = [], ib = [];
      na.forEach(function (v, i) { if (v.trim() !== '') ia.push(i); });
      nb.forEach(function (v, i) { if (v.trim() !== '') ib.push(i); });
      var opsIn = lcsDiff(ia.map(function (i) { return na[i]; }), ib.map(function (i) { return nb[i]; }));
      if (!opsIn) return { err: '内容过长，按行对比的结果可能不准确，请缩小范围。' };
      // LCS 结果按顺序还原成「原行 + 中间空行」
      var res = [], ka = 0, kb = 0;
      function flushBlank(side, from, to) {
        for (var k = from; k < to; k++) {
          if ((side === 'a' ? na[k] : nb[k]).trim() === '') res.push({ t: 'same', v: side === 'a' ? A[k] : B[k] });
        }
      }
      var lastA = 0, lastB = 0;
      opsIn.forEach(function (op) {
        if (op.t === 'same') {
          flushBlank('a', lastA, ia[ka]); flushBlank('b', lastB, ib[kb]);
          res.push({ t: 'same', v: A[ia[ka]] });
          lastA = ia[ka] + 1; lastB = ib[kb] + 1; ka++; kb++;
        } else if (op.t === 'del') {
          flushBlank('a', lastA, ia[ka]);
          res.push({ t: 'del', v: A[ia[ka]] });
          lastA = ia[ka] + 1; ka++;
        } else {
          flushBlank('b', lastB, ib[kb]);
          res.push({ t: 'add', v: B[ib[kb]] });
          lastB = ib[kb] + 1; kb++;
        }
      });
      flushBlank('a', lastA, A.length); flushBlank('b', lastB, B.length);
      return { ops: res, a: A, b: B, mode: opts.mode };
    }
    var ops = lcsDiff(na, nb);
    if (!ops) return { err: '内容过长（超过 400 万格），请缩小对比范围或改用按行。' };
    // LCS 跑在归一化后的内容上，展示时换回原文
    var ai = 0, bi = 0;
    var disp = ops.map(function (op) {
      if (op.t === 'same') { var v = A[ai]; ai++; bi++; return { t: 'same', v: v }; }
      if (op.t === 'del') { var v2 = A[ai]; ai++; return { t: 'del', v: v2 }; }
      var v3 = B[bi]; bi++; return { t: 'add', v: v3 };
    });
    if (opts.mode !== 'line') disp = mergeRuns(disp);
    return { ops: disp, a: A, b: B, mode: opts.mode };
  }

  /* ---------- JWT ---------- */
  function b64urlDecode(s) {
    s = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s);
    // 处理 UTF-8 多字节
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
  }
  function b64urlEncode(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    bytes.forEach(function (b) { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64DecodeInput(s) {
    try { return b64urlDecode(s); } catch (e) { return null; }
  }
  /* 从 base64 原文读出头部 alg/kid，不解 JSON，用于字段缺失时的兜底 */
  function jwtParse(token) {
    var parts = String(token == null ? '' : token).trim().split('.');
    if (parts.length < 2) return { err: 'JWT 至少要有「头部.载荷」两段，当前 ' + parts.length + ' 段。' };
    if (parts.length > 3) return { err: 'JWT 最多三段（头部.载荷.签名），当前 ' + parts.length + ' 段。' };
    var headTxt = b64DecodeInput(parts[0]);
    var payTxt = b64DecodeInput(parts[1]);
    if (headTxt === null) return { err: '头部不是合法的 Base64URL。' };
    if (payTxt === null) return { err: '载荷不是合法的 Base64URL。' };
    var head, pay;
    try { head = JSON.parse(headTxt); } catch (e) { return { err: '头部不是合法 JSON：' + e.message }; }
    try { pay = JSON.parse(payTxt); } catch (e) { return { err: '载荷不是合法 JSON：' + e.message }; }
    var out = { header: head, payload: pay, sig: parts[2] || '', raw: parts };
    // 常用声明
    var claims = [];
    if (pay.iss) claims.push(['签发者 iss', pay.iss]);
    if (pay.sub) claims.push(['主体 sub', pay.sub]);
    if (pay.aud) claims.push(['接收方 aud', Array.isArray(pay.aud) ? pay.aud.join(', ') : pay.aud]);
    if (pay.exp != null) {
      var d = new Date(pay.exp * 1000);
      claims.push(['过期时间 exp', d.toLocaleString('zh-CN', { hour12: false }) + (Date.now() > pay.exp * 1000 ? '（已过期）' : '（有效）')]);
    }
    if (pay.nbf != null) claims.push(['生效时间 nbf', new Date(pay.nbf * 1000).toLocaleString('zh-CN', { hour12: false })]);
    if (pay.iat != null) claims.push(['签发时间 iat', new Date(pay.iat * 1000).toLocaleString('zh-CN', { hour12: false })]);
    if (pay.jti) claims.push(['编号 jti', pay.jti]);
    out.claims = claims;
    out.expired = pay.exp != null ? Date.now() > pay.exp * 1000 : null;
    // 生成新 token 用：把某段换成改写后的 JSON
    return out;
  }
  /* 便于自测：伪造一个未签名 token */
  function jwtBuild(header, payload, sig) {
    return b64urlEncode(JSON.stringify(header)) + '.' + b64urlEncode(JSON.stringify(payload)) + '.' + (sig || '');
  }

  /* JWT 面板 */
  function jwtRun() {
    var box = $('jwt-parts'), grid = $('jwt-grid'), out = $('jwt-out');
    var r = jwtParse($('jwt-in').value);
    box.innerHTML = ''; grid.innerHTML = ''; out.className = 'out';
    if (r.err) {
      out.className = 'out err';
      out.textContent = r.err;
      return;
    }
    function part(label, text, cls) {
      var d = document.createElement('div');
      var s = document.createElement('span');
      s.className = 'k'; s.textContent = label;
      d.appendChild(s);
      d.appendChild(document.createTextNode(text));
      if (cls) d.className = cls;
      box.appendChild(d);
    }
    part('头部 header（红）', r.raw[0], 'p1');
    part('载荷 payload（紫）', r.raw[1], 'p2');
    part('签名 signature（蓝）' + (r.sig ? '' : ' — 无'), r.sig || '(空，未签名的 JWT)', 'p3');

    T.cells(grid, [
      ['算法 alg', r.header.alg || '—'],
      ['类型 typ', r.header.typ || '—'],
      ['密钥 ID kid', r.header.kid || '—'],
      ['状态', r.expired === null ? '无 exp 声明' : r.expired ? '已过期' : '未过期']
    ]);
    var lines = [];
    r.claims.forEach(function (c) { lines.push(c[0] + '：' + c[1]); });
    lines.push('');
    lines.push('头部（展开）');
    lines.push(JSON.stringify(r.header, null, 2));
    lines.push('载荷（展开）');
    lines.push(JSON.stringify(r.payload, null, 2));
    out.textContent = lines.join('\n');
  }
  $('jwt-run').addEventListener('click', jwtRun);
  $('jwt-clear').addEventListener('click', function () { $('jwt-in').value = ''; jwtRun(); });
  $('jwt-in').addEventListener('input', jwtRun);

  /* 初始示例，打开即可看到效果 */

  $('diff-a').value = ['计量工具集合', '支持校准', '支持黄金换算', '结束'].join('\n');
  $('diff-b').value = ['计量工具集合', '支持流量点校准', '支持黄金换算', '新增在线时钟', '结束'].join('\n');
  $('jwt-in').value = jwtBuild({ alg: 'HS256', typ: 'JWT' },
    { sub: '1234567890', name: '徐惠杰', iss: 'cnb.cool', iat: 1735689600, exp: 4070908800 }, 'c2lnbmF0dXJl');
  jsonRun(); sqlRun(); diffRun(); jwtRun();

  window.__dev = {
    stripJsonLoose: stripJsonLoose, fmtJson: fmtJson, jsonDepth: jsonDepth, jsonToJsObject: jsonToJsObject,
    fmtSql: fmtSql, minSql: minSql, diffText: diffText, lcsDiff: lcsDiff, mergeRuns: mergeRuns,
    jwtParse: jwtParse, jwtBuild: jwtBuild, b64urlDecode: b64urlDecode, b64urlEncode: b64urlEncode, byteLen: byteLen
  };
})();
