<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1668dc">
<title>日期与时间</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header>
  <h1>日期与时间</h1>
  <p>年龄计算 / 日期间隔 / 第几周 / 时间戳互转</p>
</header>

<main>

  <div class="tabs" id="tabs">
    <button data-tab="age" class="on">年龄计算</button>
    <button data-tab="diff">日期间隔</button>
    <button data-tab="week">第几周</button>
    <button data-tab="ts">时间戳转换</button>
  </div>

  <section class="card">
    <h2>输入</h2>
    <div id="fields"></div>
    <p class="hint" id="hint"></p>
  </section>

  <div class="btns"><button type="button" class="ghost" id="reset">重置</button><button type="button" class="primary" id="run">计算</button></div>

  <section class="card">
    <h2>结果</h2>
    <div class="grid" id="grid"></div>
    <div class="out" id="output"></div>
  </section>

  <footer>
    时间戳转换按本地时区（东八区北京时间）显示，秒与毫秒自动识别<br>
    <a href="./tools.html">← 工具目录</a>·<a href="./index.html">工具入口</a>
  </footer>
</main>

<script src="./app.js"></script>
<script src="./date.js"></script>
</body>
</html>
