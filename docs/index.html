<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1668dc">
<title>计量计算工具</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#fff;
    --text:#1f2329;
    --sub:#8a9099;
    --line:#e8eaed;
    --primary:#1668dc;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky;top:0;z-index:10;
    background:var(--primary);color:#fff;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  header h1{margin:0;font-size:17px;font-weight:600}
  header p{margin:4px 0 0;font-size:12px;opacity:.85}
  main{max-width:640px;margin:0 auto;padding:12px 12px 0}
  .card{
    background:var(--card);border-radius:var(--radius);
    padding:14px 14px 6px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .card h2{margin:0 0 10px;font-size:14px;font-weight:600}
  .entry{
    display:flex;align-items:center;gap:12px;
    padding:13px 2px;margin-bottom:12px;
    text-decoration:none;color:inherit;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;margin-bottom:6px}
  .entry:active{background:#f7f8fa}
  .badge{
    flex:0 0 40px;width:40px;height:40px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,#1668dc,#3b8bf0);
  }
  .entry.gold .badge{background:linear-gradient(135deg,#c9922e,#e8b04b)}
  .entry.flow .badge{background:linear-gradient(135deg,#0f8f74,#28b492)}
  .entry.chk .badge{background:linear-gradient(135deg,#6d28d9,#8b5cf6)}
  .entry-body{flex:1;min-width:0}
  .entry-body .t{display:block;font-size:15px;font-weight:600}
  .entry-body .d{display:block;font-size:12px;color:var(--sub);margin-top:2px;line-height:1.45}
  .arrow{flex:0 0 auto;color:var(--sub);font-size:16px}
  .hint{font-size:12px;color:var(--sub);margin:0 0 12px;line-height:1.6}
  footer{max-width:640px;margin:0 auto;padding:0 14px;font-size:12px;color:var(--sub);text-align:center;line-height:1.7}
  footer a{color:var(--primary);text-decoration:none;margin:0 6px}
</style>
</head>
<body>
<header>
  <h1>计量计算工具</h1>
  <p>日常计量换算小工具</p>
</header>

<main>
  <section class="card">
    <h2>工具入口</h2>

    <a class="entry" href="./calibration.html">
      <span class="badge">校准</span>
      <span class="entry-body">
        <span class="t">电磁水表流量点校准</span>
        <span class="d">按零点与误差百分比换算各流量点校正值</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="entry gold" href="./gold.html">
      <span class="badge">黄金</span>
      <span class="entry-body">
        <span class="t">黄金价格换算</span>
        <span class="d">美元/盎司 ↔ 人民币/克 双向换算，汇率可自动获取</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="entry flow" href="./flow.html">
      <span class="badge">流量</span>
      <span class="entry-body">
        <span class="t">瞬时流量与流速换算</span>
        <span class="d">m³/h ↔ m/s 双向换算，按口径与缩进百分比折算</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="entry chk" href="./checksum.html">
      <span class="badge">校验</span>
      <span class="entry-body">
        <span class="t">校验和计算</span>
        <span class="d">CRC / 累加和 / 异或 / MD5，一次算全并给出校验字节</span>
      </span>
      <span class="arrow">›</span>
    </a>
  </section>

  <p class="hint">
    点击任一工具即可进入对应计算页，各页之间也可互相切换。
  </p>

  <footer>
    计量计算工具集合 · 零依赖单文件 H5
  </footer>
</main>
</body>
</html>
