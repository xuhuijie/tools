<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1668dc">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>个税与健康计算</title>
<style>
/* 工具页共用样式：与仓库既有单文件页保持同一套视觉，抽出来避免十个页面各写一遍 */
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1f2329;--sub:#8a9099;--line:#e8eaed;
  --primary:#1668dc;--primary-press:#0f52b3;--soft:#e8f1fd;--soft-line:#c3dbfb;
  --warn:#d4380d;--ok:#0f8f74;--radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
header{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(135deg,#1668dc,#3b8bf0);color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
header h1{margin:0;font-size:17px;font-weight:600}
header p{margin:4px 0 0;font-size:12px;opacity:.9}
main{max-width:1280px;margin:0 auto;padding:12px 16px 0}
.card{
  background:var(--card);border-radius:var(--radius);
  padding:14px 14px 2px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.card h2{margin:0 0 10px;font-size:14px;font-weight:600}
.row{margin-bottom:12px}
.row label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.row label b{color:var(--text);font-weight:500}
.input-wrap{position:relative;display:flex;align-items:center}
input[type="number"],input[type="text"],input[type="datetime-local"],select{
  width:100%;height:46px;padding:0 12px;
  font-size:16px;color:var(--text);
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  outline:none;font-family:inherit;
}
input[type="number"]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus,select:focus{border-color:var(--primary);background:#fff}
input.invalid{border-color:var(--warn);background:#fff2ef}
.input-wrap .unit{position:absolute;right:12px;font-size:12px;color:var(--sub);pointer-events:none}
.input-wrap input[type="number"]{padding-right:64px}
textarea{
  width:100%;min-height:130px;padding:10px 12px;
  font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--text);
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  outline:none;resize:vertical;
}
textarea:focus{border-color:var(--primary);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin:2px 0 14px}
.btns button{flex:1;height:48px;font-size:16px;font-weight:600;border-radius:12px;border:none}
.btns button.primary{background:var(--primary);color:#fff}
.btns button.primary:active{background:var(--primary-press)}
.btns button.ghost{flex:0 0 96px;background:#fff;color:var(--text);border:1px solid var(--line)}
.btns.three button.ghost{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{
  padding:0 12px;height:32px;font-size:13px;color:var(--primary);
  background:var(--soft);border:1px solid var(--soft-line);border-radius:9px;
}
.chips button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.hint{font-size:12px;color:var(--sub);margin:6px 0 0;line-height:1.5}
.hint.err{color:var(--warn)}
.out{
  font:13px/1.7 ui-monospace,Menlo,Consolas,monospace;
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:12px;word-break:break-all;white-space:pre-wrap;
}
.out:empty{display:none}
.out.mono-lg{font-size:15px}
.out.err{color:var(--warn);background:#fff2ef;border-color:#ffd6cf}
.out.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.grid div{background:#fff;padding:10px 12px}
.grid .k{font-size:12px;color:var(--sub)}
.grid .v{font-size:16px;font-weight:600;margin-top:2px;word-break:break-all}
.formula{
  font-size:12px;color:var(--sub);line-height:1.6;
  background:#f7f8fa;border-radius:10px;padding:10px 12px;margin-bottom:12px;
  word-break:break-all;
}
.formula .t{color:var(--text);font-weight:600}
.formula code{font-family:ui-monospace,Menlo,Consolas,monospace;color:#4b5563}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);word-break:break-all}
th{color:var(--sub);font-weight:500}
td.num{font-family:ui-monospace,Menlo,Consolas,monospace}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pick button{
  padding:0 12px;height:34px;font-size:13px;border-radius:9px;
  background:#fff;color:var(--text);border:1px solid var(--line);
}
.pick button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.list{margin:0 0 12px;padding:0;list-style:none}
.list li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:none}
.list a{color:var(--primary);text-decoration:none;font-weight:500}
.list .d{display:block;font-size:12px;color:var(--sub);margin-top:2px;line-height:1.45}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.tabs button{
  flex:0 0 auto;padding:0 14px;height:34px;font-size:13px;border-radius:9px;
  background:#fff;color:var(--sub);border:1px solid var(--line);
}
.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
footer{max-width:1280px;margin:0 auto;padding:0 16px;font-size:12px;color:var(--sub);text-align:center;line-height:1.7}
footer a{color:var(--primary);text-decoration:none;margin:0 6px}
@media(max-width:360px){.grid2{grid-template-columns:1fr}}
</style>
<style>
  .note{font-size:12px;color:var(--sub);line-height:1.65;background:#f7f8fa;border-radius:10px;padding:10px 12px;margin-bottom:12px}
  .note b{color:var(--text)}
  .big{font:700 30px/1.25 ui-monospace,Menlo,Consolas,monospace;text-align:center;color:var(--primary);margin:2px 0 12px;font-variant-numeric:tabular-nums}
  .big small{font-size:14px;color:var(--sub);font-weight:400}
  .seg{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .seg button{padding:0 12px;height:34px;font-size:13px;border-radius:9px;background:#fff;color:var(--sub);border:1px solid var(--line)}
  .seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .rate-tb{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}
  .rate-tb th,.rate-tb td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace}
  .rate-tb th:first-child,.rate-tb td:first-child{text-align:left;font-family:inherit}
  .rate-tb tr.on{background:#e8f1fd}
  .rate-tb tr.on td{font-weight:600;color:var(--primary)}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
  .chk:last-child{border-bottom:none}
  .chk input{width:18px;height:18px;flex:0 0 18px}
  .chk span{flex:1}
  .chk em{font-style:normal;font-size:12px;color:var(--sub);font-family:ui-monospace,Menlo,Consolas,monospace}
</style>
</head>
<body>
<header>
  <h1>个税与健康计算</h1>
  <p>工资个税 · 年终奖 · 专项扣除 · BMI 体脂</p>
</header>

<main>
  <div class="tabs" id="tabs">
    <button data-tab="salary" class="on">工资个税</button>
    <button data-tab="bonus">年终奖</button>
    <button data-tab="bmi">BMI / 体脂</button>
    <button data-tab="bmr">基础代谢</button>
  </div>

  <!-- 工资个税 -->
  <section id="panel-salary">
    <section class="card">
      <h2>收入与扣除</h2>
      <div class="row">
        <label>税前月薪（元）</label>
        <div class="input-wrap"><input type="number" id="sa-pay" value="20000" step="100" min="0"><span class="unit">元</span></div>
      </div>
      <div class="row">
        <label>三险一金个人部分（元/月，可留空按比例估算）</label>
        <div class="input-wrap"><input type="number" id="sa-ins" placeholder="留空自动估算" step="10" min="0"><span class="unit">元</span></div>
      </div>
      <div class="row">
        <label>专项附加扣除合计（元/月）</label>
        <div class="input-wrap"><input type="number" id="sa-extra" value="0" step="100" min="0"><span class="unit">元</span></div>
      </div>
      <div class="seg" id="sa-city">
        <button data-city="sh" class="on">上海/北京（五险 10.5%）</button>
        <button data-city="other">其他城市（10.2%）</button>
        <button data-city="none">不估算</button>
      </div>
      <div class="row">
        <label>预计专项附加扣除（点击累加，会写入上方输入框）</label>
        <div id="sa-items"></div>
      </div>
    </section>
    <div class="btns"><button type="button" class="ghost" id="sa-reset">重置</button><button type="button" class="primary" id="sa-run">计算</button></div>
    <section class="card">
      <h2>结果</h2>
      <div class="big" id="sa-net">—<small>元 / 月</small></div>
      <div class="grid" id="sa-grid"></div>
      <div class="rate-tb-wrap">
        <table class="rate-tb" id="sa-rate"></table>
      </div>
      <div class="out" id="sa-steps"></div>
      <p class="note" id="sa-note"></p>
    </section>
  </section>

  <!-- 年终奖 -->
  <section id="panel-bonus" hidden>
    <section class="card">
      <h2>年终奖</h2>
      <div class="row">
        <label>年终奖金额（元）</label>
        <div class="input-wrap"><input type="number" id="bn-amt" value="50000" step="1000" min="0"><span class="unit">元</span></div>
      </div>
      <div class="seg" id="bn-mode">
        <button data-mode="single" class="on">单独计税（换算成月）</button>
        <button data-mode="merge">并入综合所得</button>
      </div>
      <div class="row" id="bn-merge-wrap" hidden>
        <label>并入后全年应纳税所得额（元，已减 6 万与各项扣除）</label>
        <div class="input-wrap"><input type="number" id="bn-base" value="60000" step="1000"><span class="unit">元</span></div>
      </div>
    </section>
    <div class="btns"><button type="button" class="ghost" id="bn-reset">重置</button><button type="button" class="primary" id="bn-run">计算</button></div>
    <section class="card">
      <h2>结果</h2>
      <div class="big" id="bn-net">—<small>元</small></div>
      <div class="grid" id="bn-grid"></div>
      <div class="out" id="bn-steps"></div>
      <p class="note" id="bn-note"></p>
    </section>
  </section>

  <!-- BMI / 体脂 -->
  <section id="panel-bmi" hidden>
    <section class="card">
      <h2>身体数据</h2>
      <div class="row">
        <label>性别</label>
        <div class="seg" id="bm-sex">
          <button data-sex="m" class="on">男</button>
          <button data-sex="f">女</button>
        </div>
      </div>
      <div class="grid2">
        <div class="row"><label>身高</label><div class="input-wrap"><input type="number" id="bm-h" value="175" step="0.5" min="0"><span class="unit">cm</span></div></div>
        <div class="row"><label>体重</label><div class="input-wrap"><input type="number" id="bm-w" value="70" step="0.5" min="0"><span class="unit">kg</span></div></div>
      </div>
      <div class="row">
        <label>腰围（算体脂率用，可留空）</label>
        <div class="input-wrap"><input type="number" id="bm-waist" placeholder="cm" step="0.5" min="0"><span class="unit">cm</span></div>
      </div>
    </section>
    <div class="btns"><button type="button" class="ghost" id="bm-reset">重置</button><button type="button" class="primary" id="bm-run">计算</button></div>
    <section class="card">
      <h2>结果</h2>
      <div class="big" id="bm-bmi">—</div>
      <div class="grid" id="bm-grid"></div>
      <div class="out" id="bm-steps"></div>
      <p class="note" id="bm-note"></p>
    </section>
  </section>

  <!-- 基础代谢 -->
  <section id="panel-bmr" hidden>
    <section class="card">
      <h2>基础代谢率（BMR）</h2>
      <div class="row">
        <label>性别</label>
        <div class="seg" id="br-sex">
          <button data-sex="m" class="on">男</button>
          <button data-sex="f">女</button>
        </div>
      </div>
      <div class="grid2">
        <div class="row"><label>年龄</label><div class="input-wrap"><input type="number" id="br-age" value="30" step="1" min="0"><span class="unit">岁</span></div></div>
        <div class="row"><label>身高</label><div class="input-wrap"><input type="number" id="br-h" value="175" step="0.5"><span class="unit">cm</span></div></div>
      </div>
      <div class="row"><label>体重</label><div class="input-wrap"><input type="number" id="br-w" value="70" step="0.5"><span class="unit">kg</span></div></div>
      <div class="row">
        <label>活动水平（用于算每日总消耗）</label>
        <div class="seg" id="br-act">
          <button data-act="1.2" class="on">久坐</button>
          <button data-act="1.375">轻度</button>
          <button data-act="1.55">中度</button>
          <button data-act="1.725">高强度</button>
          <button data-act="1.9">极高</button>
        </div>
      </div>
    </section>
    <div class="btns"><button type="button" class="ghost" id="br-reset">重置</button><button type="button" class="primary" id="br-run">计算</button></div>
    <section class="card">
      <h2>结果</h2>
      <div class="big" id="br-tdee">—<small>kcal / 天</small></div>
      <div class="grid" id="br-grid"></div>
      <div class="out" id="br-steps"></div>
      <p class="note" id="br-note"></p>
    </section>
  </section>

  <footer>
    采用现行（2025 版）个税累进税率与常见经验公式，仅供估算参考<br>
    <a href="./index.html">返回首页</a>
  </footer>
</main>

<script>
/* 工具页共用小工具：取元素、格式化、复制、页签切换 */
(function (global) {
  'use strict';

  // 复制到剪贴板：HTTPS/本地才用异步 API，其余回退到 execCommand
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacy(text); });
    }
    return Promise.resolve(legacy(text));
  }

  function legacy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  // 保留 digits 位小数并去掉长浮点尾巴
  function fmt(n, digits) {
    if (!isFinite(n)) return '—';
    var d = digits == null ? 4 : digits;
    return Number(n.toFixed(d)).toLocaleString('zh-CN', { maximumFractionDigits: d });
  }

  // 写回输入框的数值，避免 0.30000000000000004 这类尾巴
  function fmtInput(n, digits) {
    if (!isFinite(n)) return '';
    return String(Number(n.toFixed(digits == null ? 6 : digits)));
  }

  // 页面 id 查找：散装单页就是全局 getElementById；多页合一（整站单文件）时先在本页
  // section 里找。各页原本共用同一套 id（tabs、input、output…），合到一份文档里会互相
  // 抢，所以查找必须限定在当前显示的那页——这样各页脚本一字不改也能各找各的。
  function $(id) {
    var scope = global.__PAGE__;
    if (scope) {
      var hit = scope.querySelector('[id="' + id + '"]');
      if (hit) return hit;
    }
    return document.getElementById(id);
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  // 在容器内渲染 label/value 网格
  function cells(container, pairs) {
    container.innerHTML = '';
    pairs.forEach(function (p) {
      var cell = el('div');
      cell.appendChild(el('div', 'k', p[0]));
      cell.appendChild(el('div', 'v', p[1]));
      container.appendChild(cell);
    });
  }

  // 复制按钮通用绑定：btn 复制 target 的文本，成功后短暂改文案
  function bindCopy(btn, getText, doneText) {
    if (!btn) return;
    var original = btn.textContent;
    btn.addEventListener('click', function () {
      var text = getText();
      if (!text) return;
      copy(text).then(function () {
        btn.textContent = doneText || '已复制';
        setTimeout(function () { btn.textContent = original; }, 1200);
      });
    });
  }

  // 页签：buttons 为一组按钮，onPick 收到 data-tab
  function tabs(container, onPick) {
    var btns = [].slice.call(container.querySelectorAll('button'));
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        btns.forEach(function (o) { o.classList.toggle('on', o === b); });
        syncHash(b.dataset.tab);
        onPick(b.dataset.tab, b);
      });
    });
    return btns;
  }

  // 把按钮高亮对齐到 name。点击时 tabs() 已经切过，但初始化是从 hash 进来的，
  // 未必等于 HTML 里写死 class="on" 的那个，所以各页的 setTab 里要再调一次。
  function markTab(name) {
    // 多页合一文档里 #tabs 会出现很多个，只能标当前页那个
    var scope = global.__PAGE__ || document;
    [].forEach.call(scope.querySelectorAll('#tabs button'), function (b) {
      b.classList.toggle('on', b.dataset.tab === name);
    });
  }

  // 切页签时把页签名写回地址，刷新与分享都能停在同一个工具上。
  // 整站单文件里 No-op：地址栏归页面导航用（见 applyPageHash），页签只活在内存里，
  // 免得「这一页的 #ssl」被带到下一页去抢页签。
  function syncHash(name) {
    if (isHost()) return;
    if (!global.history || !global.history.replaceState) return;
    global.history.replaceState(null, '', '#' + name);
  }

  // 地址 hash 指定页签：#<页签名>，如 number.html#divisor。
  // 首页每条工具都带着 href="./page.html#tab" 过来，没有它就永远落回默认页签。
  function hashTab() {
    var h = String(global.location && global.location.hash || '').replace(/^#/, '');
    return /^[a-z0-9]+$/i.test(h) ? h : null;
  }

  // 页面「认不认」这个页签：不带页签按钮的页面（首页、放假日历、专项页）一律不认，
  // 别让上一条留在地址里的 #source 之类被它们接了去。
  function hasTab(name) {
    var scope = global.__PAGE__ || document;
    return [].slice.call(scope.querySelectorAll('#tabs button'))
      .some(function (b) { return b.dataset.tab === name; });
  }

  // 打开页面时该选哪个页签：优先地址 hash（且必须是本页真实存在的页签），否则 defaultTab。
  // 只有「本页真的有这个页签」时才算数：#<页签名> 在整站单文件里是全局的，切页/返回首页
  // 都会把它带过去，本页没有同名页签就当成没写过——否则上一页的 #ssl 能把这一页顶到默认页签。
  function firstTab(defaultTab) {
    var want = hashTab();
    if (!want) return defaultTab;
    return hasTab(want) ? want : defaultTab;
  }

  // ---- 整站单文件（多页合一）支持 ----
  // 手机从「下载 / 文件管理器」打开时走 content:// URI：页面里 ./xxx.html 这类「跳到另一个
  // 文件」的链接会被拦下，报「文件找不到」。内联只解决了 css/js 子资源，解决不了跨页跳转。
  // 于是把全部页面装进同一个文档、每个页面一个 <section class="page" id="page-xxx.html">，
  // 点链接改成文档内切 section。散装单页里没有这些 section，一切维持原样。
  // 地址栏只记「在哪一页」（#page=web.html），页签状态不写地址：#<页签名> 这个通道被
  // 各页自己的页签逻辑占着（如 checksum.html 会把它改写成 #crc），争它只会互相踩。
  var PAGE_SEL = 'main > section.page';

  function isHost() { return !!document.querySelector(PAGE_SEL); }

  function pageEl(name) { return document.querySelector(PAGE_SEL + '[data-name="' + name + '"]'); }

  // 单文件里页签只放内存，地址栏改记「当前在哪一页」：#page=web.html。
  // 记它有两个用处：一是把上一页残留的 #ssl 这类页签顶掉，二是在手机上切后台被浏览器
  // 回收后重新加载，还能落回原来那一页，而不是一起回到首页。不写也不会坏，只是回到首页。
  function hashPage() {
    var h = String(global.location && global.location.hash || '').replace(/^#/, '');
    var m = /^(?:page=|\/)?([a-z0-9_-]+\.html)$/i.exec(h);
    return m ? m[1].toLowerCase() : null;
  }

  function applyPageHash(name) {
    if (!isHost() || !global.history || !global.history.replaceState) return;
    global.history.replaceState(null, '', '#page=' + name);
  }

  // 切到某页：只显示这一页、把它的脚本拉起来一次（首访），并同步 hash 与标题。
  function go(name) {
    if (!isHost()) return true;
    name = String(name || '').toLowerCase();
    var want = pageEl(name);
    if (!want) return true;                 // 不认识的页，交回浏览器
    [].slice.call(document.querySelectorAll(PAGE_SEL)).forEach(function (sec) {
      var on = sec === want;
      sec.hidden = !on;
      if ('inert' in sec) sec.inert = !on;
    });
    global.__PAGE__ = want;
    document.title = (want.dataset.title || name) + ' · 工具合集';
    applyPageHash(name);
    // 左上角的「首页」入口：首页自己在最上面，这一条只在别的页面上出现
    var homeNav = document.getElementById('site-nav');
    if (homeNav) homeNav.className = name === 'index.html' ? 'on-home' : '';
    global.scrollTo(0, 0);
    // 本页脚本在合成时收进了 type 非 JS 的 script 标签，首访才按顺序逐条执行：
    // 不执行的话，页里那些 document.getElementById 会先撞上别页的同名元素。
    // 注意是「逐条」：随页面内联进来的第三方库（DOMPurify、marked、bwip-js）在本页脚本
    // 之前各占一条，只跑第一条的话，本页脚本永远轮不到，按钮点了没反应、页签也切不动。
    var lazy = [].slice.call(want.querySelectorAll('script[type="text/x-page-init"]'));
    if (lazy.length && !want.dataset.ready) {
      want.dataset.ready = '1';
      lazy.forEach(function (src) {
        var run = document.createElement('script');
        run.textContent = src.textContent;
        document.body.appendChild(run);
        run.remove();
      });
    }
    return false;
  }

  // 文档内所有「去某页」的点击：带 data-page 的链接、./xxx.html 链接都接管
  function bindNav() {
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest && e.target.closest('a');
      if (!a) return;
      var name = a.dataset.page ||
        ((a.getAttribute('href') || '').match(/([a-z0-9_-]+\.html)(?:$|#)/i) || [])[1];
      if (name && go(name) === false) e.preventDefault();
    });
  }

  // 首屏落首页：单文件里没有「外部直接进来」的入口，一律从首页开始
  function boot() {
    if (!isHost()) return;
    // 整站导航的「首页」入口：没有 JS 也能回首页，这里只是把首页自己那一屏的它收起来
    var nav = document.getElementById('site-nav');
    if (nav && !document.querySelector(PAGE_SEL + ':not([hidden])')) nav.className = 'on-home';
    if (global.__PAGE__) return;            // 已有活动页，别覆盖
    var want = hashPage();
    if (!want || !pageEl(want)) want = pageEl('index.html') ? 'index.html'
      : document.querySelector(PAGE_SEL).dataset.name;
    go(want);
    bindNav();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  global.T = { $: $, el: el, fmt: fmt, fmtInput: fmtInput, cells: cells, copy: copy, bindCopy: bindCopy, tabs: tabs, hashTab: hashTab, firstTab: firstTab, syncHash: syncHash, markTab: markTab, hasTab: hasTab, go: go };
})(window);

<script>
/* 个税与健康计算：工资个税、年终奖、BMI/体脂、基础代谢

   税率表与扣除口径按现行（2025 版）执行：
   - 工资薪金走累计预扣预缴，本页按月折算的等效年度税率表估算
   - 年终奖单独计税用「金额 ÷ 12 定税率、再乘回金额」的老办法
   - 健康类用 WHO 标准与 Mifflin-St Jeor / 美国海军法

   所有纯函数集中在前面，便于测试脚本直接取向量。 */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  function num(v, def) {
    if (v === '' || v == null) return def == null ? NaN : def;
    var n = Number(v);
    return isFinite(n) ? n : (def == null ? NaN : def);
  }
  function r2(n) { return isFinite(n) ? Number(n.toFixed(2)) : NaN; }
  function money(n) { return isFinite(n) ? Number(n.toFixed(2)).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '—'; }

  /* ---------- 个税税率表 ----------
     按月应纳税所得额（累计口径下每档除以 12 的等效值） */
  var MONTH_BRACKETS = [
    { up: 3000, rate: 0.03, ded: 0 },
    { up: 12000, rate: 0.10, ded: 210 },
    { up: 25000, rate: 0.20, ded: 1410 },
    { up: 35000, rate: 0.25, ded: 2660 },
    { up: 55000, rate: 0.30, ded: 4410 },
    { up: 80000, rate: 0.35, ded: 7160 },
    { up: Infinity, rate: 0.45, ded: 15160 }
  ];
  // 按年（综合所得）税率表，年终奖并入时用
  var YEAR_BRACKETS = MONTH_BRACKETS.map(function (b) {
    return { up: b.up === Infinity ? Infinity : b.up * 12, rate: b.rate, ded: b.ded * 12 };
  });

  function bracketOf(table, taxable) {
    for (var i = 0; i < table.length; i++) {
      if (taxable <= table[i].up) return { idx: i, rate: table[i].rate, ded: table[i].ded, up: table[i].up };
    }
    return { idx: table.length - 1, rate: 0.45, ded: 15160, up: Infinity };
  }

  /* 工资个税：月薪 - 三险一金 - 5000 起征 - 专项附加 = 应纳税所得额 */
  var PIT_BASE = 5000;
  // 社保个人比例：养老 8% + 医疗 2% + 失业 0.5%（上海口径）
  var INS_RATE = { sh: 0.105, other: 0.102, none: 0 };

  function salaryTax(opts) {
    var pay = num(opts.pay);
    if (!(pay >= 0)) return { err: '请输入税后月薪（不小于 0）。' };
    var rate = INS_RATE[opts.city] == null ? 0.105 : INS_RATE[opts.city];
    var ins = opts.ins === '' || opts.ins == null ? pay * rate : num(opts.ins, 0);
    if (!(ins >= 0)) ins = 0;
    var extra = num(opts.extra, 0);
    if (!(extra >= 0)) extra = 0;

    var taxable = pay - ins - PIT_BASE - extra;
    var tax = 0;
    var br = null;
    if (taxable > 0) {
      br = bracketOf(MONTH_BRACKETS, taxable);
      tax = taxable * br.rate - br.ded;
      if (tax < 0) tax = 0;
    }
    var net = pay - ins - tax;
    return {
      pay: pay, ins: ins, extra: extra, taxable: Math.max(0, taxable),
      tax: tax, net: net, bracket: br, rate: br ? br.rate : 0,
      insEstimated: !(opts.ins !== '' && opts.ins != null)
    };
  }

  /* 年终奖单独计税：金额 ÷ 12 落到哪档，就用该档税率乘全额 */
  function bonusTax(amt) {
    var a = num(amt);
    if (!(a >= 0)) return { err: '请输入年终奖金额（不小于 0）。' };
    if (a === 0) return { amt: 0, tax: 0, net: 0, rate: 0, month: 0, ded: 0, bracketIdx: 0 };
    var month = a / 12;
    var br = bracketOf(MONTH_BRACKETS, month);
    var tax = a * br.rate - br.ded;
    if (tax < 0) tax = 0;
    return { amt: a, tax: tax, net: a - tax, rate: br.rate, month: month, ded: br.ded, bracketIdx: br.idx, upper: br.up };
  }

  /* 年终奖并入综合所得：把奖金加进全年应纳税所得额，按年度税率表算 */
  function bonusMerged(amt, base) {
    var a = num(amt);
    var b = num(base, 0);
    if (!(a >= 0)) return { err: '请输入年终奖金额。' };
    if (!(b >= 0)) b = 0;
    function yearTax(x) {
      if (x <= 0) return 0;
      var br = bracketOf(YEAR_BRACKETS, x);
      return Math.max(0, x * br.rate - br.ded);
    }
    var tWith = yearTax(b + a);
    var tWithout = yearTax(b);
    var marginal = tWith - tWithout;
    return {
      amt: a, base: b, taxWith: tWith, taxWithout: tWithout, marginal: marginal,
      net: a - marginal, rate: a > 0 ? marginal / a : 0
    };
  }

  /* 年终奖临界点：奖金稍增而税后反降的区间（俗称「多发一元多缴几千」） */
  function bonusCliff(amt) {
    var a = num(amt);
    if (!(a > 0)) return null;
    // 每个档位上限 ×12 就是跳挡点，跨过它边际税率跳一级
    var cliffs = MONTH_BRACKETS.map(function (b) { return b.up === Infinity ? null : b.up * 12; })
      .filter(function (x) { return x != null; });
    for (var i = 0; i < cliffs.length; i++) {
      if (a > cliffs[i] && a <= cliffs[i] + 60000) return cliffs[i];
    }
    return null;
  }

  /* ---------- BMI ---------- */
  function bmiCalc(h, w) {
    var H = num(h) / 100, W = num(w);
    if (!(H > 0) || !(W > 0)) return { err: '请输入有效的身高与体重。' };
    var bmi = W / (H * H);
    var cat;
    // WHO 成人标准；中国标准把超重线下调到 24，此处用中国标准并标注
    if (bmi < 18.5) cat = ['偏瘦', '低于 18.5'];
    else if (bmi < 24) cat = ['正常', '18.5 ~ 23.9'];
    else if (bmi < 28) cat = ['超重', '24 ~ 27.9'];
    else cat = ['肥胖', '≥ 28'];
    // 对应身高的健康体重区间
    var lo = 18.5 * H * H, hi = 23.9 * H * H;
    return { bmi: bmi, cat: cat[0], range: cat[1], lo: lo, hi: hi, height: H, weight: W };
  }

  /* 体脂率：美国海军法（围度法），需要腰围 */
  function bodyFat(sex, h, w, waist) {
    var H = num(h), W = num(w), C = num(waist);
    if (!(H > 0) || !(W > 0) || !(C > 0)) return null;
    /* 美国海军围度法（公制版）。完整式需要腰围与颈围两项，
       这里用只含腰围与身高的近似式（男性少一项颈围，误差约 ±3%）。 */
    var v;
    if (sex === 'm') {
      v = 86.010 * Math.log10(C) - 70.041 * Math.log10(H) + 36.76;
    } else {
      v = 163.205 * Math.log10(C) - 97.684 * Math.log10(H) - 78.387;
    }
    if (!isFinite(v)) return null;
    return Math.max(0, Math.min(70, v));
  }

  function bodyFatCategory(sex, bf) {
    if (bf == null) return '—';
    if (sex === 'm') {
      if (bf < 6) return '必需脂肪';
      if (bf < 14) return '运动员';
      if (bf < 18) return '健康';
      if (bf < 25) return '偏高';
      return '肥胖';
    }
    if (bf < 14) return '必需脂肪';
    if (bf < 21) return '运动员';
    if (bf < 25) return '健康';
    if (bf < 32) return '偏高';
    return '肥胖';
  }

  /* ---------- 基础代谢：Mifflin-St Jeor ---------- */
  function bmrCalc(sex, age, h, w) {
    var A = num(age, 0), H = num(h), W = num(w);
    if (!(H > 0) || !(W > 0)) return { err: '请输入有效的身高与体重。' };
    if (!(A >= 0)) A = 0;
    // 男：10W + 6.25H − 5A + 5；女：同式 − 161
    var base = 10 * W + 6.25 * H - 5 * A;
    var bmr = sex === 'f' ? base - 161 : base + 5;
    return { bmr: bmr, base: base, sex: sex, age: A, height: H, weight: W };
  }

  function tdeeCalc(bmr, factor) {
    var f = num(factor, 1.2);
    return bmr * f;
  }

  /* ---------- 界面 ---------- */
  var UI = {
    salary: { city: 'sh' },
    bonus: { mode: 'single' },
    bmi: { sex: 'm' },
    bmr: { sex: 'm', act: 1.2 }
  };

  // 专项附加扣除标准（元/月）
  var EXTRA_ITEMS = [
    ['子女教育', 2000, '每个子女，父母可各扣一半'],
    ['婴幼儿照护', 2000, '3 岁以下每个婴幼儿'],
    ['继续教育', 400, '学历教育期间每月 400'],
    ['住房贷款利息', 1000, '首套房贷，最长 240 个月'],
    ['住房租金', 1500, '直辖市/省会等按档次'],
    ['赡养老人', 3000, '独生子女全额，非独生分摊'],
    ['大病医疗', 0, '年度据实扣除，按年汇算']
  ];

  function buildExtraItems() {
    var box = $('sa-items');
    box.innerHTML = '';
    EXTRA_ITEMS.forEach(function (it) {
      var lab = document.createElement('label');
      lab.className = 'chk';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.dataset.amount = String(it[1]);
      cb.dataset.title = it[0];
      var sp = document.createElement('span');
      sp.textContent = it[0] + '　';
      var em = document.createElement('em');
      em.textContent = it[1] ? it[1] + ' 元/月' : '据实扣除';
      sp.appendChild(em);
      lab.appendChild(cb); lab.appendChild(sp);
      lab.title = it[2];
      box.appendChild(lab);
    });
    box.addEventListener('change', function () {
      var sum = 0;
      [].forEach.call(box.querySelectorAll('input'), function (c) { if (c.checked) sum += Number(c.dataset.amount) || 0; });
      $('sa-extra').value = String(sum);
      salaryRun();
    });
  }

  function tblRows(table, activeIdx) {
    table.innerHTML = '';
    var head = document.createElement('tr');
    ['级数', '月应纳税所得额', '税率', '速算扣除数'].forEach(function (h) {
      var th = document.createElement('th');
      th.textContent = h;
      head.appendChild(th);
    });
    table.appendChild(head);
    MONTH_BRACKETS.forEach(function (b, i) {
      var tr = document.createElement('tr');
      if (i === activeIdx) tr.className = 'on';
      var lo = i === 0 ? 0 : MONTH_BRACKETS[i - 1].up;
      var range = b.up === Infinity ? '超过 ' + lo.toLocaleString() : (i === 0 ? '不超过 ' + b.up.toLocaleString() : lo.toLocaleString() + ' ~ ' + b.up.toLocaleString());
      var cells = [String(i + 1), range, (b.rate * 100) + '%', b.ded ? b.ded.toLocaleString() : '0'];
      cells.forEach(function (v, ci) {
        var td = document.createElement('td');
        td.textContent = v;
        if (ci > 0) td.style.fontFamily = 'ui-monospace,Menlo,Consolas,monospace';
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
  }

  function salaryRun() {
    var r = salaryTax({
      pay: $('sa-pay').value, ins: $('sa-ins').value,
      extra: $('sa-extra').value, city: UI.salary.city
    });
    var err = $('sa-note');
    if (r.err) {
      $('sa-net').textContent = '—';
      $('sa-grid').innerHTML = '';
      $('sa-steps').textContent = '';
      tblRows($('sa-rate'), -1);
      err.className = 'note err';
      err.textContent = r.err;
      return;
    }
    $('sa-net').innerHTML = money(r.net) + '<small> 元 / 月</small>';
    T.cells($('sa-grid'), [
      ['税前月薪', money(r.pay) + ' 元'],
      ['三险一金' + (r.insEstimated ? '（估算）' : ''), money(r.ins) + ' 元'],
      ['专项附加扣除', money(r.extra) + ' 元'],
      ['应纳税所得额', money(r.taxable) + ' 元'],
      ['适用税率', (r.rate * 100) + '%'],
      ['本月个税', money(r.tax) + ' 元'],
      ['全年个税（估）', money(r.tax * 12) + ' 元'],
      ['全年到手（估）', money(r.net * 12) + ' 元']
    ]);
    tblRows($('sa-rate'), r.bracket ? r.bracket.idx : -1);
    var lines = [];
    lines.push('① 应纳税所得额 = 月薪 ' + money(r.pay) + ' − 三险一金 ' + money(r.ins) + ' − 起征点 5,000' + (r.extra ? ' − 专项附加 ' + money(r.extra) : '') + ' = ' + money(r.taxable) + ' 元');
    if (r.taxable > 0) {
      lines.push('② 查表落在 ' + ((r.bracket.idx + 1)) + ' 级，税率 ' + (r.rate * 100) + '%，速算扣除数 ' + r.bracket.ded.toLocaleString());
      lines.push('③ 本月个税 = ' + money(r.taxable) + ' × ' + (r.rate * 100) + '% − ' + r.bracket.ded.toLocaleString() + ' = ' + money(r.tax) + ' 元');
    } else {
      lines.push('② 未超过起征点，本月不用缴税');
    }
    lines.push('④ 到手 = ' + money(r.pay) + ' − ' + money(r.ins) + ' − ' + money(r.tax) + ' = ' + money(r.net) + ' 元');
    $('sa-steps').textContent = lines.join('\n');
    err.className = 'note';
    err.innerHTML = '<b>说明</b>　三险一金按社保个人比例估算（' + (UI.salary.city === 'sh' ? '养老 8% + 医疗 2% + 失业 0.5%' : UI.salary.city === 'other' ? '养老 8% + 医疗 2% + 失业 0.2%' : '未估算') + '），未计入公积金与年终奖。' +
      '实际工资走累计预扣预缴，月度税额会随累计所得变化，本页按月等效税率表估算，年终汇算以「多退少补」为准。';
  }

  function bonusRun() {
    var amt = $('bn-amt').value;
    var note = $('bn-note');
    if (UI.bonus.mode === 'single') {
      var r = bonusTax(amt);
      if (r.err) { note.className = 'note err'; note.textContent = r.err; return; }
      $('bn-net').innerHTML = money(r.net) + '<small> 元</small>';
      T.cells($('bn-grid'), [
        ['年终奖金额', money(r.amt) + ' 元'],
        ['折合每月', money(r.month) + ' 元'],
        ['适用税率', (r.rate * 100) + '%'],
        ['速算扣除数', r.ded.toLocaleString() + ' 元'],
        ['应纳税额', money(r.tax) + ' 元'],
        ['实际到手', money(r.net) + ' 元']
      ]);
      $('bn-steps').textContent = [
        '① 折合每月 = ' + money(r.amt) + ' ÷ 12 = ' + money(r.month) + ' 元',
        '② 查月税率表落在 ' + (r.bracketIdx + 1) + ' 级，税率 ' + (r.rate * 100) + '%，速算扣除数 ' + r.ded.toLocaleString(),
        '③ 应纳税额 = 全额 ' + money(r.amt) + ' × ' + (r.rate * 100) + '% − ' + r.ded.toLocaleString() + ' = ' + money(r.tax) + ' 元',
        '④ 到手 = ' + money(r.amt) + ' − ' + money(r.tax) + ' = ' + money(r.net) + ' 元'
      ].join('\n');
      var cliff = bonusCliff(r.amt);
      var warn = '';
      if (r.amt > 36000 && r.amt <= 36000 + 2310) warn = '当前金额正处在 36,000 元跳档区（36,001 ~ 38,566 元），多发反而少拿，建议把奖金调到 36,000 元或以下。';
      note.className = 'note';
      note.innerHTML = warn ? '<b style="color:var(--warn)">避坑提醒</b>　' + warn : '<b>说明</b>　年终奖单独计税一年只能用一次，当年已用过则在汇算时必须并入综合所得。' +
        (cliff ? '' : '');
    } else {
      var m = bonusMerged(amt, $('bn-base').value);
      if (m.err) { note.className = 'note err'; note.textContent = m.err; return; }
      $('bn-net').innerHTML = money(m.net) + '<small> 元</small>';
      T.cells($('bn-grid'), [
        ['年终奖金额', money(m.amt) + ' 元'],
        ['并入前全年应纳税所得额', money(m.base) + ' 元'],
        ['并入前全年个税', money(m.taxWithout) + ' 元'],
        ['并入后全年个税', money(m.taxWith) + ' 元'],
        ['奖金实际税负', money(m.marginal) + ' 元'],
        ['实际边际税率', (m.rate * 100).toFixed(2) + '%']
      ]);
      $('bn-steps').textContent = [
        '① 并入后应纳税所得额 = ' + money(m.base) + ' + ' + money(m.amt) + ' = ' + money(m.base + m.amt) + ' 元',
        '② 并入后全年个税 = ' + money(m.taxWith) + ' 元',
        '③ 不并入时全年个税 = ' + money(m.taxWithout) + ' 元',
        '④ 奖金实际承担 = ' + money(m.taxWith) + ' − ' + money(m.taxWithout) + ' = ' + money(m.marginal) + ' 元',
        '⑤ 到手 = ' + money(m.amt) + ' − ' + money(m.marginal) + ' = ' + money(m.net) + ' 元'
      ].join('\n');
      note.className = 'note';
      note.innerHTML = '<b>说明</b>　并入综合所得后，奖金按年度累进税率表计税。一般来说奖金高、且原本适用税率已较高时，单独计税更划算；' +
        '奖金低且原本未用满免征额时，并入可能更省。可切回「单独计税」比较两种口径的到手金额。';
    }
  }

  function bmiRun() {
    var r = bmiCalc($('bm-h').value, $('bm-w').value);
    var note = $('bm-note');
    if (r.err) {
      $('bm-bmi').textContent = '—';
      $('bm-grid').innerHTML = '';
      $('bm-steps').textContent = '';
      note.className = 'note err';
      note.textContent = r.err;
      return;
    }
    $('bm-bmi').textContent = r.bmi.toFixed(2);
    var rows = [
      ['体质指数 BMI', r.bmi.toFixed(2)],
      ['体型评价', r.cat],
      ['正常范围', r.range],
      ['对应健康体重', r.lo.toFixed(1) + ' ~ ' + r.hi.toFixed(1) + ' kg']
    ];
    var waist = num($('bm-waist').value, NaN);
    var bf = bodyFat(UI.bmi.sex, r.height * 100, r.weight, waist);
    if (bf != null) {
      rows.push(['体脂率（海军法）', bf.toFixed(1) + '%']);
      rows.push(['体脂评价', bodyFatCategory(UI.bmi.sex, bf)]);
    }
    T.cells($('bm-grid'), rows);
    var steps = [
      '① BMI = 体重 ÷ 身高² = ' + r.weight + ' ÷ ' + r.height.toFixed(2) + '² = ' + r.bmi.toFixed(2),
      '② 按中国成人标准：< 18.5 偏瘦，18.5 ~ 23.9 正常，24 ~ 27.9 超重，≥ 28 肥胖'
    ];
    if (bf != null) {
      steps.push('③ 体脂率（美国海军围度法，需腰围）：' + bf.toFixed(1) + '%，' + bodyFatCategory(UI.bmi.sex, bf));
    }
    $('bm-steps').textContent = steps.join('\n');
    note.className = 'note';
    note.innerHTML = '<b>说明</b>　BMI 只看身高体重，肌肉量大的人会被判「超重」，建议结合体脂率一起看。' +
      '体脂率用海军围度法（需要腰围），误差通常 ±3%，只做趋势参考。' +
      (bf == null && waist !== waist ? '　填上腰围可一并算出体脂率。' : '');
  }

  function bmrRun() {
    var r = bmrCalc(UI.bmr.sex, $('br-age').value, $('br-h').value, $('br-w').value);
    var note = $('br-note');
    if (r.err) {
      $('br-tdee').textContent = '—';
      $('br-grid').innerHTML = '';
      $('br-steps').textContent = '';
      note.className = 'note err';
      note.textContent = r.err;
      return;
    }
    var f = Number(UI.bmr.act);
    var tdee = tdeeCalc(r.bmr, f);
    $('br-tdee').innerHTML = Math.round(tdee).toLocaleString() + '<small> kcal / 天</small>';
    T.cells($('br-grid'), [
      ['基础代谢率 BMR', Math.round(r.bmr).toLocaleString() + ' kcal/天'],
      ['活动系数', '× ' + f],
      ['每日总消耗 TDEE', Math.round(tdee).toLocaleString() + ' kcal/天'],
      ['轻度减脂（−15%）', Math.round(tdee * 0.85).toLocaleString() + ' kcal/天'],
      ['明显减脂（−25%）', Math.round(tdee * 0.75).toLocaleString() + ' kcal/天'],
      ['增肌（+10%）', Math.round(tdee * 1.1).toLocaleString() + ' kcal/天']
    ]);
    $('br-steps').textContent = [
      '① ' + (r.sex === 'f' ? '女性' : '男性') + ' BMR = 10 × 体重 ' + r.weight + ' + 6.25 × 身高 ' + r.height + ' − 5 × 年龄 ' + r.age + (r.sex === 'f' ? ' − 161' : ' + 5'),
      '　 = ' + Math.round(r.bmr).toLocaleString() + ' kcal/天（Mifflin-St Jeor 公式）',
      '② TDEE = BMR × 活动系数 = ' + Math.round(r.bmr).toLocaleString() + ' × ' + f + ' = ' + Math.round(tdee).toLocaleString() + ' kcal/天'
    ].join('\n');
    note.className = 'note';
    note.innerHTML = '<b>说明</b>　BMR 是躺着不动也需要消耗的热量，TDEE 才是日常总消耗。' +
      '减脂建议每天缺口 300 ~ 500 kcal，别低于 BMR，否则易掉肌肉与代谢下降。' +
      '公式为估算值，个体差异可达 ±10%。';
  }

  /* 页签绑定 */
  function showTab(name) {
    T.markTab(name);
    [].forEach.call($('tabs').querySelectorAll('button'), function (b) { b.classList.toggle('on', b.dataset.tab === name); });
    ['salary', 'bonus', 'bmi', 'bmr'].forEach(function (k) { $('panel-' + k).hidden = k !== name; });
    if (name === 'salary') salaryRun();
    if (name === 'bonus') bonusRun();
    if (name === 'bmi') bmiRun();
    if (name === 'bmr') bmrRun();
  }
  T.tabs($('tabs'), showTab);
  showTab(T.firstTab('salary'));

  /* 分段选择器通用绑定 */
  function bindSeg(id, key, cb) {
    var box = $(id);
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      [].forEach.call(box.querySelectorAll('button'), function (o) { o.classList.toggle('on', o === b); });
      cb(b.dataset);
    });
  }

  bindSeg('sa-city', 'city', function (d) { UI.salary.city = d.city; salaryRun(); });
  bindSeg('bn-mode', 'mode', function (d) {
    UI.bonus.mode = d.mode;
    $('bn-merge-wrap').hidden = d.mode !== 'merge';
    bonusRun();
  });
  bindSeg('bm-sex', 'sex', function (d) { UI.bmi.sex = d.sex; bmiRun(); });
  bindSeg('br-sex', 'sex', function (d) { UI.bmr.sex = d.sex; bmrRun(); });
  bindSeg('br-act', 'act', function (d) { UI.bmr.act = d.act; bmrRun(); });

  $('sa-run').addEventListener('click', salaryRun);
  $('sa-reset').addEventListener('click', function () {
    $('sa-pay').value = '20000'; $('sa-ins').value = ''; $('sa-extra').value = '0';
    [].forEach.call($('sa-items').querySelectorAll('input'), function (c) { c.checked = false; });
    salaryRun();
  });
  $('bn-run').addEventListener('click', bonusRun);
  $('bn-reset').addEventListener('click', function () {
    $('bn-amt').value = '50000'; $('bn-base').value = '60000'; bonusRun();
  });
  $('bm-run').addEventListener('click', bmiRun);
  $('bm-reset').addEventListener('click', function () {
    $('bm-h').value = '175'; $('bm-w').value = '70'; $('bm-waist').value = ''; bmiRun();
  });
  $('br-run').addEventListener('click', bmrRun);
  $('br-reset').addEventListener('click', function () {
    $('br-age').value = '30'; $('br-h').value = '175'; $('br-w').value = '70'; bmrRun();
  });
  ['sa-pay', 'sa-ins', 'sa-extra'].forEach(function (id) { $(id).addEventListener('input', salaryRun); });
  ['bn-amt', 'bn-base'].forEach(function (id) { $(id).addEventListener('input', bonusRun); });
  ['bm-h', 'bm-w', 'bm-waist'].forEach(function (id) { $(id).addEventListener('input', bmiRun); });
  ['br-age', 'br-h', 'br-w'].forEach(function (id) { $(id).addEventListener('input', bmrRun); });

  buildExtraItems();
  salaryRun(); bonusRun(); bmiRun(); bmrRun();

  window.__finance = {
    MONTH_BRACKETS: MONTH_BRACKETS, YEAR_BRACKETS: YEAR_BRACKETS, INS_RATE: INS_RATE,
    PIT_BASE: PIT_BASE, salaryTax: salaryTax, bonusTax: bonusTax, bonusMerged: bonusMerged,
    bonusCliff: bonusCliff, bmiCalc: bmiCalc, bodyFat: bodyFat, bodyFatCategory: bodyFatCategory,
    bmrCalc: bmrCalc, tdeeCalc: tdeeCalc, bracketOf: bracketOf, money: money
  };
})();
</script>
