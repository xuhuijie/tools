<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1668dc">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>古典密码</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header>
  <h1>古典密码</h1>
  <p>摩尔斯 / 凯撒 / ROT13 / 维吉尼亚 / 栅栏 / 培根</p>
</header>

<main>

  <div class="tabs" id="tabs">
    <button data-tab="morse" class="on">摩尔斯电码</button>
    <button data-tab="caesar">凯撒密码</button>
    <button data-tab="rot13">ROT13</button>
    <button data-tab="vigenere">维吉尼亚密码</button>
    <button data-tab="fence">栅栏密码</button>
    <button data-tab="bacon">培根密码</button>
  </div>

  <section class="card">
    <h2>参数</h2>
    <div class="row" id="shift-row" style="display:none">
      <label for="shift"><b>偏移位数</b>（凯撒/ROT）</label>
      <div class="input-wrap">
        <input id="shift" type="number" inputmode="numeric" step="1" value="3">
        <span class="unit">位</span>
      </div>
    </div>
    <div class="row" id="key-row" style="display:none">
      <label for="key"><b>密钥</b>（维吉尼亚，仅字母参与）</label>
      <input id="key" type="text" placeholder="例如 KEY" value="KEY">
    </div>
    <div class="row" id="rails-row" style="display:none">
      <label for="rails"><b>栏数</b>（栅栏密码）</label>
      <div class="input-wrap">
        <input id="rails" type="number" inputmode="numeric" step="1" value="2">
        <span class="unit">栏</span>
      </div>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="card">
    <h2>输入</h2>
    <textarea id="input" placeholder="在此粘贴明文或密文"></textarea>
  </section>

  <div class="btns three">
    <button type="button" class="ghost" id="swap">交换</button>
    <button type="button" class="primary" id="encode">加密</button>
    <button type="button" class="primary" id="decode">解密</button>
  </div>

  <section class="card">
    <h2>输出</h2>
    <div class="out mono-lg" id="output"></div>
    <button type="button" id="copy" style="width:100%;height:44px;font-size:15px;font-weight:600;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:12px">复制结果</button>
  </section>

  <footer>
    纯本地计算；古典密码仅作学习与算法验证，不用于真实加密<br>
    <a href="./index.html">返回首页</a>
  </footer>
</main>

<script src="./app.js"></script>
<script src="./cipher.js"></script>
</body>
</html>
