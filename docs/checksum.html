<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>校验和计算</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#fff;
    --text:#1f2329;
    --sub:#8a9099;
    --line:#e8eaed;
    --primary:#6d28d9;
    --primary-press:#5b21b6;
    --warn:#d4380d;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky;top:0;z-index:10;
    background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  header h1{margin:0;font-size:17px;font-weight:600}
  header p{margin:4px 0 0;font-size:12px;opacity:.9}
  main{max-width:640px;margin:0 auto;padding:12px 12px 0}
  .card{
    background:var(--card);border-radius:var(--radius);
    padding:14px 14px 6px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .card h2{
    margin:0 0 10px;font-size:14px;font-weight:600;
    display:flex;align-items:center;justify-content:space-between;
  }
  .row{margin-bottom:12px}
  .row label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
  .row label b{color:var(--text);font-weight:500}
  textarea{
    width:100%;min-height:104px;padding:10px 12px;
    font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--text);
    background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
    outline:none;resize:vertical;
  }
  textarea:focus{border-color:var(--primary);background:#fff}
  textarea.invalid{border-color:var(--warn);background:#fff2ef}
  .seg{display:flex;background:#f2f3f5;border-radius:10px;padding:3px;margin-bottom:12px}
  .seg button{
    flex:1;height:34px;font-size:13px;font-weight:500;color:var(--sub);
    background:none;border:none;border-radius:8px;
  }
  .seg button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.45}
  .hint.err{color:var(--warn)}
  .inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
  .inline input[type=search]{
    flex:1;min-width:0;height:34px;padding:0 10px;font-size:13px;color:var(--text);
    background:#f7f8fa;border:1px solid var(--line);border-radius:9px;outline:none;
  }
  .inline input[type=search]:focus{border-color:var(--primary);background:#fff}
  .inline select{
    height:34px;padding:0 26px 0 10px;font-size:13px;color:var(--text);
    background:#f7f8fa;border:1px solid var(--line);border-radius:9px;outline:none;
    -webkit-appearance:none;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,#8a9099 50%),linear-gradient(135deg,#8a9099 50%,transparent 50%);
    background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  }
  .checks{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:2px}
  .checks label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text)}
  .checks input{width:16px;height:16px;accent-color:var(--primary)}
  .quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .quick button{
    flex:1 1 auto;min-width:64px;height:34px;padding:0 10px;
    font-size:13px;color:var(--primary);background:#f3eefe;
    border:1px solid #ddd0fb;border-radius:9px;
  }
  .quick button:active{background:#e9dfff}
  .btns{display:flex;gap:10px;margin:2px 0 14px}
  .btns button{
    flex:1;height:48px;font-size:16px;font-weight:600;border-radius:12px;border:none;
  }
  #calc{background:var(--primary);color:#fff}
  #calc:active{background:var(--primary-press)}
  #reset{flex:0 0 96px;background:#fff;color:var(--text);border:1px solid var(--line)}
  #result{display:none}
  #result.show{display:block}
  .result-main{
    background:linear-gradient(135deg,#6d28d9,#9a6cf3);color:#fff;
    border-radius:var(--radius);padding:16px;margin-bottom:12px;
    box-shadow:0 4px 14px rgba(109,40,217,.25);
  }
  .result-main .k{font-size:12px;opacity:.9}
  .result-main .v{font-size:30px;font-weight:700;letter-spacing:.5px;word-break:break-all;margin:2px 0 0;font-family:ui-monospace,Menlo,Consolas,monospace}
  .group{margin-bottom:12px}
  .group>h3{
    margin:0 0 6px;font-size:12px;font-weight:600;color:var(--sub);
    display:flex;align-items:center;justify-content:space-between;
  }
  .group>h3 span{font-weight:400;color:#a9aeb6}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden}
  .grid div{background:#fff;padding:10px 12px}
  .grid .k{font-size:12px;color:var(--sub)}
  .grid .k em{font-style:normal;color:#b9bec6}
  .grid .v{font-size:15px;font-weight:600;margin-top:2px;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}
  .grid .v small{font-size:11px;font-weight:400;color:var(--sub);margin-left:4px;font-family:inherit}
  .copy{
    margin-top:6px;height:26px;padding:0 8px;font-size:12px;color:var(--primary);
    background:#f3eefe;border:1px solid #ddd0fb;border-radius:7px;
  }
  .copy:active{background:#e9dfff}
  footer{max-width:640px;margin:0 auto;padding:0 14px;font-size:12px;color:var(--sub);text-align:center;line-height:1.7}
  footer a{color:var(--primary);text-decoration:none;margin:0 6px}
</style>
</head>
<body>
<header>
  <h1>校验和计算</h1>
  <p>CRC / 累加和 / 异或 一次算全 · CRC 共 60 种预设</p>
</header>

<main>
  <form id="form" novalidate>
    <section class="card">
      <h2>输入数据</h2>
      <div class="seg" id="mode">
        <button type="button" data-mode="hex" class="on">十六进制 HEX</button>
        <button type="button" data-mode="text">字符串 UTF-8</button>
      </div>

      <div class="row">
        <label for="data" id="data-label"><b>十六进制字节</b>（空格、逗号、换行、0x 均可分隔）</label>
        <textarea id="data" name="data" spellcheck="false" placeholder="例如 01 03 00 00 00 0A"></textarea>
        <div class="hint" id="data-hint">按字节解析：忽略空格、逗号、换行与 0x 前缀；逐字节需为 00～FF。</div>
      </div>

      <div class="row" id="crc-row" hidden>
        <label for="preset"><b>CRC 预设</b>（按协议/别名选择，共 <span id="preset-count"></span> 种）</label>
        <div class="inline">
          <input type="search" id="preset-search" placeholder="搜索算法名 / 别名，如 ARC、CCITT、Modbus、64" autocomplete="off">
        </div>
        <div class="inline" style="margin-top:8px">
          <select id="preset"></select>
          <span id="preset-note"></span>
        </div>
        <div class="hint" id="preset-params"></div>
      </div>

      <div class="row" id="sum-row" hidden>
        <label><b>累加和校验</b>（宽度与大小端）</label>
        <div class="inline">
          <select id="sumWidth">
            <option value="8">8 位（取低 8 位）</option>
            <option value="16">16 位</option>
            <option value="32">32 位</option>
          </select>
          <select id="sumEndian">
            <option value="be">大端（高位在前）</option>
            <option value="le">小端（低位在前）</option>
          </select>
        </div>
      </div>

      <div class="row" id="xor-row" hidden>
        <label><b>异或校验</b>（宽度与大小端）</label>
        <div class="inline">
          <select id="xorWidth">
            <option value="8">8 位（单字节 XOR）</option>
            <option value="16">16 位</option>
            <option value="32">32 位</option>
          </select>
          <select id="xorEndian">
            <option value="be">大端（高位在前）</option>
            <option value="le">小端（低位在前）</option>
          </select>
        </div>
      </div>

      <div class="row">
        <label><b>计算项</b>（可多选）</label>
        <div class="checks">
          <label><input type="checkbox" id="chk-crc" checked>CRC 校验</label>
          <label><input type="checkbox" id="chk-sum" checked>累加和</label>
          <label><input type="checkbox" id="chk-xor" checked>异或校验</label>
        </div>
      </div>
    </section>

    <div class="btns">
      <button type="button" id="reset">重置</button>
      <button type="submit" id="calc">计算校验和</button>
    </div>
  </form>

  <section id="result" aria-live="polite">
    <div id="result-main"></div>
    <div id="groups"></div>
  </section>

  <footer>
    CRC 共 60 种预设，反射走右移、正序走逐位左移，结果与常见工具一致<br>
    累加和 = 各字节无符号求和后取低位；异或 = 各字节逐位异或<br>
    <a href="./index.html">← 返回工具入口</a>·<a href="./calibration.html">流量点校准</a>·<a href="./gold.html">黄金换算</a>·<a href="./flow.html">流量换算</a>·<a href="./md5.html">MD5 校验</a>
  </footer>
</main>

<script>
(function(){
  'use strict';

  var $ = function(id){ return document.getElementById(id); };
  var formEl = $('form');
  var resultEl = $('result');
  var dataEl = $('data');

  function el(tag, cls, text){
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function hex(n, width){
    var s = n.toString(16).toUpperCase();
    while (s.length < width * 2) s = '0' + s;
    return s;
  }

  // 按宽度输出「高位在前/低位在前」的字节串（Number 与 BigInt 通用）
  function beBytes(n, width){
    var bits = BigInt(width) * 8n, out = [];
    for (var i = bits - 8n; i >= 0n; i -= 8n){
      out.push(((n >> i) & 0xFFn).toString(16).toUpperCase().padStart(2, '0'));
    }
    return out.join(' ');
  }
  function leBytes(n, width){
    return beBytes(n, width).split(' ').reverse().join(' ');
  }
  function bytesOf(n, width, endian){
    return bytesOfBig(BigInt(n), width, endian);
  }
  function bytesOfBig(n, width, endian){
    return endian === 'le' ? leBytes(n, width) : beBytes(n, width);
  }

  // ---------- 输入解析：HEX 与 UTF-8 文本二选一 ----------

  function parseHex(str){
    var bad = { ok: false, msg: 'HEX 里含有非十六进制字符，只允许 0-9 A-F 与空格、逗号、换行、0x 前缀。' };
    var s = str.replace(/0[xX]/g, '').replace(/[\s,;:]+/g, '');
    if (s === '') return { ok: true, bytes: [] };
    if (/[^0-9a-fA-F]/.test(s)) return bad;
    if (s.length % 2 !== 0) return { ok: false, msg: '十六进制位数需为偶数（每两个字符一个字节），当前为 ' + s.length + ' 位。' };
    var bytes = [];
    for (var i = 0; i < s.length; i += 2) bytes.push(parseInt(s.substr(i, 2), 16));
    return { ok: true, bytes: bytes };
  }

  function parseText(str){
    if (typeof TextEncoder === 'undefined') return { ok: false, msg: '当前浏览器不支持 UTF-8 编码，请改用 HEX 模式。' };
    return { ok: true, bytes: Array.prototype.slice.call(new TextEncoder().encode(str)) };
  }

  var mode = 'hex';

  function readBytes(){
    return mode === 'hex' ? parseHex(dataEl.value) : parseText(dataEl.value);
  }

  // ---------- 全量 CRC 表（width/poly/init/refin/refout/xorout）----------
  // poly 一律写成正常（非反转）形式，反射方向由算法按 refin 自动反转

  var CRC_TABLE = [
    ['CRC-8', 8, '0x7', '0x0', false, false, '0x0', 'CRC-8/SMBUS', '0xF4'],
    ['CRC-8/MAXIM', 8, '0x31', '0x0', true, true, '0x0', 'CRC-8/MAXIM-DOW、CRC-8/1-Wire', '0xA1'],
    ['CRC-8/SAE-J1850', 8, '0x1D', '0xFF', false, false, '0xFF', 'SAE J1850', '0x4B'],
    ['CRC-8/ROHC', 8, '0x7', '0xFF', true, true, '0x0', 'ROHC', '0xD0'],
    ['CRC-16/IBM', 16, '0x8005', '0x0', true, true, '0x0', 'CRC-16/ARC、CRC-16/LHA、CRC-16/IBM-3740 的姊妹', '0xBB3D'],
    ['CRC-16/MODBUS', 16, '0x8005', '0xFFFF', true, true, '0x0', 'Modbus RTU/TCP，最常用', '0x4B37'],
    ['CRC-16/USB', 16, '0x8005', '0xFFFF', true, true, '0xFFFF', 'CRC-16/USB', '0xB4C8'],
    ['CRC-16/MAXIM', 16, '0x8005', '0x0', true, true, '0xFFFF', 'CRC-16/MAXIM-DOW', '0x44C2'],
    ['CRC-16/CCITT-FALSE', 16, '0x1021', '0xFFFF', false, false, '0x0', 'CRC-16/CCITT、SPI-FPGA 常见', '0x29B1'],
    ['CRC-16/XMODEM', 16, '0x1021', '0x0', false, false, '0x0', 'ZMODEM、ACORN', '0x31C3'],
    ['CRC-16/X25', 16, '0x1021', '0xFFFF', true, true, '0xFFFF', 'HDLC、X.25、ISO-IEC-14443-3-A', '0x906E'],
    ['CRC-16/KERMIT', 16, '0x1021', '0x0', true, true, '0x0', 'CRC-16/BLUETOOTH、V-41-LSB', '0x2189'],
    ['CRC-16/DNP', 16, '0x3D65', '0x0', true, true, '0xFFFF', 'DNP3、IEC 870', '0xEA82'],
    ['CRC-16/DECT', 16, '0x589', '0x0', false, false, '0x1', 'DECT R-CRC', '0x7E'],
    ['CRC-16/T10-DIF', 16, '0x8BB7', '0x0', false, false, '0x0', 'SCSI DIF', '0xD0DB'],
    ['CRC-16/EN-13757', 16, '0x3D65', '0x0', false, false, '0xFFFF', 'EN 13757、M-Bus', '0xC2B7'],
    ['CRC-32', 32, '0x4C11DB7', '0xFFFFFFFF', true, true, '0xFFFFFFFF', 'CRC-32/ISO-HDLC、ZIP、Gzip、PNG、以太网', '0xCBF43926'],
    ['CRC-32/BZIP2', 32, '0x4C11DB7', '0xFFFFFFFF', false, false, '0xFFFFFFFF', 'bzip2', '0xFC891918'],
    ['CRC-32/MPEG-2', 32, '0x4C11DB7', '0xFFFFFFFF', false, false, '0x0', 'MPEG-2 传输流', '0x376E6E7'],
    ['CRC-32/POSIX', 32, '0x4C11DB7', '0x0', false, false, '0xFFFFFFFF', 'CRC-32/CKSUM、cksum', '0x765E7680'],
    ['CRC-32/JAMCRC', 32, '0x4C11DB7', '0xFFFFFFFF', true, true, '0x0', 'CRC-32/JAMCRC（CRC-32 按位取反）', '0x340BC6D9'],
    ['CRC-32/XFER', 32, '0xAF', '0x0', false, false, '0x0', 'XFER', '0xBD0BE338'],
    ['CRC-5/USB', 5, '0x5', '0x1F', true, true, '0x1F', 'USB 令牌', '0x19'],
    ['CRC-6/DARC', 6, '0x19', '0x0', true, true, '0x0', 'DARC', '0x26'],
    ['CRC-7/ROHC', 7, '0x4F', '0x7F', true, true, '0x0', 'ROHC 7 位', '0x53'],
    ['CRC-10', 10, '0x233', '0x0', false, false, '0x0', 'ATM、CRC-10/ATM', '0x199'],
    ['CRC-10/CDMA2000', 10, '0x3D9', '0x3FF', false, false, '0x0', 'CDMA2000', '0x233'],
    ['CRC-11', 11, '0x385', '0x1A', false, false, '0x0', 'FlexRay 11 位', '0x5A3'],
    ['CRC-12/UMTS', 12, '0x80F', '0x0', false, true, '0x0', 'UMTS、CRC-12/3GPP', '0xDAF'],
    ['CRC-12/CDMA2000', 12, '0xF13', '0xFFF', false, false, '0x0', 'CDMA2000', '0xD4D'],
    ['CRC-12/DECT', 12, '0x80F', '0x0', false, false, '0x0', 'DECT 12 位', '0xF5B'],
    ['CRC-13/BBC', 13, '0x1CF5', '0x0', false, false, '0x0', 'BBC', '0x4FA'],
    ['CRC-14/DARC', 14, '0x805', '0x0', true, true, '0x0', 'DARC', '0x82D'],
    ['CRC-15', 15, '0x4599', '0x0', false, false, '0x0', 'CRC-15/CAN、CAN 总线', '0x59E'],
    ['CRC-15/MPT1327', 15, '0x6815', '0x0', false, false, '0x1', 'MPT1327', '0x2566'],
    ['CRC-16/RIELLO', 16, '0x1021', '0xB2AA', true, true, '0x0', 'Riello 设备', '0x63D0'],
    ['CRC-16/TELEDISK', 16, '0xA097', '0x0', false, false, '0x0', 'Teledisk', '0xFB3'],
    ['CRC-16/IBM-SDLC', 16, '0x1021', '0xFFFF', true, true, '0xFFFF', 'CRC-16/ISO-HDLC、CRC-16/V-41-MSB', '0x906E'],
    ['CRC-24/OPENPGP', 24, '0x864CFB', '0xB704CE', false, false, '0x0', 'OPENPGP、Radix-64', '0x21CF02'],
    ['CRC-24/BLE', 24, '0x65B', '0x555555', true, true, '0x0', 'BLE', '0xC25A56'],
    ['CRC-24/FLEXRAY-A', 24, '0x5D6DCB', '0xFEDCBA', false, false, '0x0', 'FlexRay A', '0x7979BD'],
    ['CRC-24/FLEXRAY-B', 24, '0x5D6DCB', '0xABCDEF', false, false, '0x0', 'FlexRay B', '0x1F23B8'],
    ['CRC-24/LTE-A', 24, '0x864CFB', '0x0', false, false, '0x0', 'LTE-A', '0xCDE703'],
    ['CRC-24/LTE-B', 24, '0x800063', '0x0', false, false, '0x0', 'LTE-B', '0x23EF52'],
    ['CRC-24/OS-9', 24, '0x800063', '0xFFFFFF', false, false, '0xFFFFFF', 'OS-9', '0x200FA5'],
    ['CRC-30/CDMA', 30, '0x2030B9C7', '0x3FFFFFFF', false, false, '0x3FFFFFFF', 'CDMA', '0x4C34ABF'],
    ['CRC-31/PHILIPS', 31, '0x4C11DB7', '0x7FFFFFFF', false, false, '0x7FFFFFFF', 'Philips', '0xCE9E46C'],
    ['CRC-32/AUTOSAR', 32, '0xF4ACFB13', '0xFFFFFFFF', true, true, '0xFFFFFFFF', 'AUTOSAR', '0x1697D06A'],
    ['CRC-32/CD-ROM-EDC', 32, '0x8001801B', '0x0', true, true, '0x0', 'CD-ROM EDC', '0x6EC2EDC4'],
    ['CRC-32/MEF', 32, '0x741B8CD7', '0xFFFFFFFF', true, true, '0x0', 'MEF', '0xD2C22F51'],
    ['CRC-32/AIXM', 32, '0x814141AB', '0x0', false, false, '0x0', 'AIXM', '0x3010BF7F'],
    ['CRC-32/BASE91-D', 32, '0xA833982B', '0xFFFFFFFF', true, true, '0xFFFFFFFF', 'BASE91-D', '0x87315576'],
    ['CRC-32/ISCSI', 32, '0x1EDC6F41', '0xFFFFFFFF', true, true, '0xFFFFFFFF', 'ISCSI、CRC-32C(Castagnoli)', '0xE3069283'],
    ['CRC-64/ECMA-182', 64, '0x42F0E1EBA9EA3693', '0x0', false, false, '0x0', 'ECMA-182', '0x6C40DF5F0B497347'],
    ['CRC-64/WE', 64, '0x42F0E1EBA9EA3693', '0xFFFFFFFFFFFFFFFF', false, false, '0xFFFFFFFFFFFFFFFF', 'CRC-64/WE', '0x62EC59E3F1A4F00A'],
    ['CRC-64/XZ', 64, '0x42F0E1EBA9EA3693', '0xFFFFFFFFFFFFFFFF', true, true, '0xFFFFFFFFFFFFFFFF', 'XZ、.xz 容器', '0x995DC9BBDF1939FA'],
    ['CRC-64/GO-ISO', 64, '0x1B', '0xFFFFFFFFFFFFFFFF', true, true, '0xFFFFFFFFFFFFFFFF', 'GO-ISO', '0xB90956C775A41001'],
    ['CRC-64/MS', 64, '0x259C84CBA6426349', '0xFFFFFFFFFFFFFFFF', true, true, '0x0', 'CRC-64/MS', '0x75D4B74F024ECEEA'],
    ['CRC-64/REDIS', 64, '0xAD93D23594C935A9', '0x0', true, true, '0x0', 'Redis（CRC-64/Jones 族）', '0xE9C6D914C4B8D9CA'],
    ['CRC-40/GSM', 40, '0x4820009', '0x0', false, false, '0xFFFFFFFFFF', 'GSM', '0xD4164FC646']
  ];

  // 40/64 位的参数超过 Number 精度，统一用 BigInt 解析，避免高位被截断
  function parsePoly(str){
    return str.indexOf('0x') === 0 ? BigInt(str) : BigInt(str);
  }

  var presets = CRC_TABLE.map(function(p){
    return {
      name: p[0], width: p[1], poly: parsePoly(p[2]), init: parsePoly(p[3]),
      refin: p[4], refout: p[5], xorout: parsePoly(p[6]), desc: p[7], check: p[8]
    };
  });

  // ---------- CRC 核心 ----------
  // 宽度超过 32 位（CRC-40/64）用 BigInt 保证精度，其余走 Number 快路径；
  // 两条路径算法完全一致：反射走右移、非反射逐 bit 左移，都能分块续算。

  function crcMask(width){
    return width === 64 ? 0xFFFFFFFFFFFFFFFFn : ((1n << BigInt(width)) - 1n);
  }

  function reflectBig(v, width){
    var w = BigInt(width), r = 0n, i;
    for (i = 0n; i < w; i++) if ((v >> i) & 1n) r |= 1n << (w - 1n - i);
    return r;
  }

  // 预先把初值与反转多项式算好，避免每个字节重复取反
  function crcInitState(p){
    var w = BigInt(p.width);
    return p.refin ? reflectBig(p.init & crcMask(p.width), w) : p.init & crcMask(p.width);
  }

  function crcUpdate(state, bytes, p){
    var mask = crcMask(p.width), top = 1n << (BigInt(p.width) - 1n);
    var poly = p.poly, c = state, i, k;
    if (p.refin){
      var rpoly = reflectBig(poly, BigInt(p.width));
      for (i = 0; i < bytes.length; i++){
        c ^= BigInt(bytes[i]);
        for (k = 0; k < 8; k++) c = (c & 1n) ? ((c >> 1n) ^ rpoly) & mask : (c >> 1n);
      }
    } else {
      for (i = 0; i < bytes.length; i++){
        for (k = 7; k >= 0; k--){
          var hi = (c & top) ? 1n : 0n;
          c = (c << 1n) & mask;
          if (hi ^ BigInt((bytes[i] >> k) & 1)) c ^= poly;
        }
      }
    }
    return c;
  }

  function crcFinish(state, p){
    var w = BigInt(p.width), mask = crcMask(p.width), c = state;
    if (p.refout !== p.refin) c = reflectBig(c, w);
    return (c ^ (p.xorout & mask)) & mask;
  }

  function crcCompute(bytes, p){
    return crcFinish(crcUpdate(crcInitState(p), bytes, p), p);
  }

  function crcHex(n, width){
    return n.toString(16).toUpperCase();
  }

  // 宽度不是 4 的倍数时（5/6/7/10/…/31 位），补零到整字节
  function padHex(s, width){
    var nibbles = Math.ceil(width / 4);
    while (s.length < nibbles) s = '0' + s;
    return s;
  }

  function hexOf(v, width){
    return padHex(v.toString(16).toUpperCase(), width);
  }

  // ---------- 页面交互 ----------

  var DATA_HINT = '按字节解析：忽略空格、逗号、换行与 0x 前缀；逐字节需为 00～FF。';
  var TEXT_HINT = '按 UTF-8 编码取字节，中文一个字通常 3 字节，与设备侧编码保持一致。';

  // 注意：optgroup 下 selectedIndex 是「全部 option 的顺序」，与 presets 下标不同，
  // 一律以 option 的 value 为准。
  function selectedPreset(){
    var sel = $('preset');
    var idx = sel.selectedIndex >= 0 ? Number(sel.options[sel.selectedIndex].value) : 0;
    return presets[idx] || presets[0];
  }

  function clearErrors(){
    dataEl.classList.remove('invalid');
    var h = $('data-hint');
    h.className = 'hint';
    h.textContent = mode === 'hex' ? DATA_HINT : TEXT_HINT;
  }

  function showError(msg){
    resultEl.classList.remove('show');
    dataEl.classList.add('invalid');
    var h = $('data-hint');
    h.className = 'hint err';
    h.textContent = msg;
    dataEl.scrollIntoView({behavior:'smooth', block:'center'});
  }

  function fillPreset(){
    var sel = $('preset');
    sel.innerHTML = '';
    // 按宽度分组，避免几十项平铺下来找不到
    var groups = [];
    presets.forEach(function(p){
      var g = groups.filter(function(x){ return x.width === p.width; })[0];
      if (!g){ g = { width: p.width, items: [] }; groups.push(g); }
      g.items.push(p);
    });
    groups.sort(function(a, b){ return a.width - b.width; });
    groups.forEach(function(g){
      var og = document.createElement('optgroup');
      og.label = g.width + ' 位（' + g.items.length + ' 种）';
      g.items.forEach(function(p){
        var o = document.createElement('option');
        o.value = String(presets.indexOf(p));
        o.textContent = p.desc ? p.name + '　·　' + p.desc.split('、')[0] : p.name;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
    // 默认给工控现场最常用的 Modbus（optgroup 下按 option 顺序定位）
    var defIdx = 0;
    presets.forEach(function(p, i){ if (p.name === 'CRC-16/MODBUS') defIdx = i; });
    Array.prototype.forEach.call(sel.options, function(o){
      if (Number(o.value) === defIdx) sel.selectedIndex = o.index;
    });
    syncPresetNote();
  }

  function syncPresetNote(){
    var p = selectedPreset();
    var q = $('preset-search');
    if (q) q.placeholder = '搜索算法名 / 别名，如 ARC、CCITT、Modbus';
    $('preset-note').textContent = p.desc || p.name;
    $('preset-params').textContent =
      '宽度 ' + p.width + ' 位 · 多项式 0x' + padHex(p.poly.toString(16).toUpperCase(), p.width) +
      ' · 初值 0x' + padHex(p.init.toString(16).toUpperCase(), p.width) +
      ' · 输入' + (p.refin ? '反转' : '正序') +
      ' · 输出' + (p.refout ? '反转' : '正序') +
      ' · 结果异或 0x' + padHex(p.xorout.toString(16).toUpperCase(), p.width) +
      '　·　标准校验值（"123456789"）0x' + padHex(p.check.replace(/^0x/, '').toUpperCase(), p.width);
  }

  function cell(k, v, extra, copyText){
    var node = el('div');
    var kk = el('div', 'k');
    kk.appendChild(document.createTextNode(k));
    if (extra){
      var em = el('em', null, ' ' + extra);
      kk.appendChild(em);
    }
    node.appendChild(kk);
    var vv = el('div', 'v');
    vv.appendChild(document.createTextNode(v));
    node.appendChild(vv);
    if (copyText != null){
      var btn = el('button', 'copy', '复制');
      btn.type = 'button';
      btn.addEventListener('click', function(){ copy(copyText, btn); });
      node.appendChild(btn);
    }
    return node;
  }

  function copy(text, btn){
    var done = function(){ var old = btn.textContent; btn.textContent = '已复制'; setTimeout(function(){ btn.textContent = old; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e){ /* 剪贴板不可用时静默跳过 */ }
    document.body.removeChild(ta);
  }

  function group(title, note, cells){
    var box = el('div', 'group');
    var h = el('h3');
    h.appendChild(document.createTextNode(title));
    var span = el('span', null, note);
    h.appendChild(span);
    box.appendChild(h);
    var grid = el('div', 'grid');
    cells.forEach(function(c){ grid.appendChild(c); });
    box.appendChild(grid);
    return box;
  }

  function render(bytes){
    var wantCrc = $('chk-crc').checked;
    var wantSum = $('chk-sum').checked;
    var wantXor = $('chk-xor').checked;

    if (!wantCrc && !wantSum && !wantXor){
      showError('请至少勾选一项计算项。');
      return;
    }

    var groups = [];
    var firstValue = '—';
    var firstLabel = '';

    if (wantCrc){
      var p = selectedPreset();
      var v = crcCompute(bytes, p);
      var hexStr = padHex(v.toString(16).toUpperCase(), p.width);
      var byteCount = Math.ceil(p.width / 8);
      var byteOrder = p.refin || p.refout ? 'le' : 'be';
      var b = bytesOfBig(v, byteCount, byteOrder);
      firstValue = b; firstLabel = p.name + '（字节序）';
      groups.push(group('CRC 校验', p.name + (p.desc ? ' · ' + p.desc : ''), [
        cell('结果（HEX）', '0x' + hexStr, null, '0x' + hexStr),
        cell('结果（DEC）', v.toString(), null, v.toString()),
        cell('校验字节', b, byteOrder === 'le' ? '低位在前' : '高位在前', b.replace(/ /g, '')),
        cell('参数', 'poly 0x' + padHex(p.poly.toString(16).toUpperCase(), p.width) +
          ' / init 0x' + padHex(p.init.toString(16).toUpperCase(), p.width) +
          ' / xorout 0x' + padHex(p.xorout.toString(16).toUpperCase(), p.width)),
        cell('标准校验值', '0x' + padHex(p.check.replace(/^0x/, '').toUpperCase(), p.width), '对 "123456789"')
      ]));
    }

    if (wantSum){
      var sw = Number($('sumWidth').value);
      var sEnd = $('sumEndian').value;
      var sum = 0;
      bytes.forEach(function(x){ sum = (sum + x) >>> 0; });
      var smask = sw === 32 ? 0xFFFFFFFF : Math.pow(2, sw) - 1;
      var sv = (sum % (smask + 1)) >>> 0;
      var sb = bytesOf(sv, sw / 8, sEnd);
      if (!wantCrc && groups.length === 0){ firstValue = sb; firstLabel = sw + ' 位累加和（字节序）'; }
      groups.push(group('累加和校验', sw + ' 位 · ' + (sEnd === 'le' ? '小端' : '大端'), [
        cell('结果（HEX）', '0x' + hex(sv, sw / 8)),
        cell('结果（DEC）', String(sv)),
        cell('校验字节', sb, sEnd === 'le' ? '低位在前' : '高位在前', sb.replace(/ /g, '')),
        cell('原始和', String(sum) + ' → 取低 ' + sw + ' 位')
      ]));
    }

    if (wantXor){
      var xw = Number($('xorWidth').value);
      var xEnd = $('xorEndian').value;
      var x = 0;
      bytes.forEach(function(y){ x = (x ^ y) >>> 0; });
      var xmask = xw === 32 ? 0xFFFFFFFF : Math.pow(2, xw) - 1;
      var xv = (x & xmask) >>> 0;
      var xb = bytesOf(xv, xw / 8, xEnd);
      if (!wantCrc && !wantSum){ firstValue = xb; firstLabel = xw + ' 位异或（字节序）'; }
      groups.push(group('异或校验', xw + ' 位 · ' + (xEnd === 'le' ? '小端' : '大端'), [
        cell('结果（HEX）', '0x' + hex(xv, xw / 8)),
        cell('结果（DEC）', String(xv)),
        cell('校验字节', xb, xEnd === 'le' ? '低位在前' : '高位在前', xb.replace(/ /g, '')),
        cell('参与字节数', String(bytes.length))
      ]));
    }

    var main = el('div', 'result-main');
    main.appendChild(el('div', 'k', firstLabel));
    main.appendChild(el('div', 'v', firstValue));
    $('result-main').innerHTML = '';
    $('result-main').appendChild(main);

    var host = $('groups');
    host.innerHTML = '';
    // 字节数作为上下文放在最上面，方便核对输入长度
    host.appendChild(group('输入统计', mode === 'hex' ? 'HEX 模式' : 'UTF-8 文本模式', [
      cell('字节数', String(bytes.length) + ' 字节'),
      cell('数据（HEX）', bytes.map(function(b){ return hex(b, 1); }).join(' ') || '—')
    ]));
    groups.forEach(function(g){ host.appendChild(g); });

    resultEl.classList.add('show');
    resultEl.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function switchMode(next){
    mode = next;
    Array.prototype.forEach.call($('mode').querySelectorAll('button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-mode') === next);
    });
    $('data-label').innerHTML = next === 'hex'
      ? '<b>十六进制字节</b>（空格、逗号、换行、0x 均可分隔）'
      : '<b>字符串</b>（按 UTF-8 编码取字节）';
    dataEl.placeholder = next === 'hex' ? '例如 01 03 00 00 00 0A' : '例如 hello 中国';
    clearErrors();
    resultEl.classList.remove('show');
  }

  $('mode').addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('button') : null;
    if (btn && btn.getAttribute('data-mode')) switchMode(btn.getAttribute('data-mode'));
  });

  $('preset').addEventListener('change', syncPresetNote);

  // 关键字过滤：命中算法名、别名说明或宽度数字
  $('preset-search').addEventListener('input', function(){
    var kw = this.value.trim().toLowerCase();
    var sel = $('preset');
    Array.prototype.forEach.call(sel.querySelectorAll('option'), function(o){
      var p = presets[Number(o.value)];
      var hay = (p.name + ' ' + (p.desc || '') + ' ' + p.width + '位').toLowerCase();
      var hit = kw === '' || hay.indexOf(kw) >= 0;
      o.hidden = !hit;
      o.disabled = !hit;
    });
    // 当前选中项被过滤掉时，跳到第一个仍可见的项（不是最后一个）
    if (sel.selectedIndex < 0 || sel.options[sel.selectedIndex].hidden){
      for (var i = 0; i < sel.options.length; i++){
        if (!sel.options[i].hidden){ sel.selectedIndex = i; break; }
      }
    }
    // optgroup 被清空时不隐藏标签，避免出现空分组标题
    Array.prototype.forEach.call(sel.querySelectorAll('optgroup'), function(g){
      var any = Array.prototype.some.call(g.querySelectorAll('option'), function(o){ return !o.hidden; });
      g.hidden = !any;
    });
    syncPresetNote();
  });
  dataEl.addEventListener('input', function(){ clearErrors(); resultEl.classList.remove('show'); });

  formEl.addEventListener('submit', function(e){
    e.preventDefault();
    clearErrors();
    var parsed = readBytes();
    if (!parsed.ok){ showError(parsed.msg); return; }
    if (parsed.bytes.length === 0){ showError('请先填写要计算的数据。'); return; }
    render(parsed.bytes);
  });

  $('reset').addEventListener('click', function(){
    dataEl.value = '';
    $('chk-crc').checked = true;
    $('chk-sum').checked = true;
    $('chk-xor').checked = true;
    $('sumWidth').value = '8';
    $('sumEndian').value = 'be';
    $('xorWidth').value = '8';
    $('xorEndian').value = 'be';
    switchMode('hex');
    fillPreset();
    dataEl.focus();
  });

  fillPreset();
  $('preset-count').textContent = String(presets.length);
  switchMode('hex');
})();
</script>
</body>
</html>
