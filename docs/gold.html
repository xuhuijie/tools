<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b8860b">
<title>黄金价格换算计算</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#fff;
    --text:#1f2329;
    --sub:#8a9099;
    --line:#e8eaed;
    --primary:#b8860b;
    --primary-press:#96690a;
    --warn:#d4380d;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky;top:0;z-index:10;
    background:linear-gradient(135deg,#b8860b,#d8a72a);color:#fff;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  header h1{margin:0;font-size:17px;font-weight:600}
  header p{margin:4px 0 0;font-size:12px;opacity:.9}
  main{max-width:640px;margin:0 auto;padding:12px 12px 0}
  .card{
    background:var(--card);border-radius:var(--radius);
    padding:14px 14px 6px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .card h2{
    margin:0 0 10px;font-size:14px;font-weight:600;
    display:flex;align-items:center;justify-content:space-between;
  }
  .row{margin-bottom:12px}
  .row label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
  .row label b{color:var(--text);font-weight:500}
  .input-wrap{position:relative;display:flex;align-items:center}
  input[type="number"]{
    width:100%;height:46px;padding:0 76px 0 12px;
    font-size:17px;font-weight:600;color:var(--text);
    background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
    outline:none;-moz-appearance:textfield;
  }
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input:focus{border-color:var(--primary);background:#fff}
  input.invalid{border-color:var(--warn);background:#fff2ef}
  .unit{
    position:absolute;right:12px;font-size:12px;color:var(--sub);pointer-events:none;
  }
  .swap{
    display:flex;align-items:center;justify-content:center;
    margin:-4px 0 8px;gap:8px;color:var(--sub);font-size:12px;
  }
  .swap::before,.swap::after{content:"";flex:1;height:1px;background:var(--line)}
  .swap span{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:50%;
    background:#fdf6e3;border:1px solid #f0e0b8;color:var(--primary);
  }
  .swap svg{display:block}
  .hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.45}
  .hint.err{color:var(--warn)}
  .fx-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .fx-head label{margin:0}
  #fx-fetch{
    height:30px;padding:0 12px;font-size:13px;font-weight:500;
    color:var(--primary);background:#fdf6e3;border:1px solid #f0e0b8;border-radius:9px;
    white-space:nowrap;flex:0 0 auto;
  }
  #fx-fetch:active{background:#f7ecd0}
  #fx-fetch[disabled]{opacity:.6}
  .fx-status{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.45}
  .fx-status.loading{color:var(--sub)}
  .fx-status.ok{color:#1a7f37}
  .fx-status.err{color:var(--warn)}
  .fx-status a{color:inherit;text-decoration:underline}
  .quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .quick button{
    flex:1 1 auto;min-width:64px;height:34px;padding:0 10px;
    font-size:13px;color:var(--primary);background:#fdf6e3;
    border:1px solid #f0e0b8;border-radius:9px;
  }
  .quick button:active{background:#f7ecd0}
  .btns{display:flex;gap:10px;margin:2px 0 14px}
  .btns button{
    flex:1;height:48px;font-size:16px;font-weight:600;border-radius:12px;border:none;
  }
  #calc{background:var(--primary);color:#fff}
  #calc:active{background:var(--primary-press)}
  #reset{flex:0 0 96px;background:#fff;color:var(--text);border:1px solid var(--line)}
  #result{display:none}
  #result.show{display:block}
  .result-main{
    background:linear-gradient(135deg,#b8860b,#e0b23c);color:#fff;
    border-radius:var(--radius);padding:16px;margin-bottom:12px;
    box-shadow:0 4px 14px rgba(184,134,11,.25);
  }
  .result-main .k{font-size:12px;opacity:.9}
  .result-main .v{font-size:32px;font-weight:700;letter-spacing:.5px;word-break:break-all;margin:2px 0 0}
  .result-main .v small{font-size:14px;font-weight:500;margin-left:6px;opacity:.9}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden}
  .grid div{background:#fff;padding:10px 12px}
  .grid .k{font-size:12px;color:var(--sub)}
  .grid .v{font-size:16px;font-weight:600;margin-top:2px;word-break:break-all}
  .formula{
    font-size:12px;color:var(--sub);line-height:1.6;
    background:#f7f8fa;border-radius:10px;padding:10px 12px;margin-top:12px;
    word-break:break-all;
  }
  .formula code{font-family:ui-monospace,Menlo,Consolas,monospace;color:#4b5563}
  .formula .t{color:var(--text);font-weight:600}
  footer{max-width:640px;margin:0 auto;padding:0 14px;font-size:12px;color:var(--sub);text-align:center;line-height:1.7}
  footer a{color:var(--primary);text-decoration:none;margin:0 6px}
</style>
</head>
<body>
<header>
  <h1>黄金价格换算计算</h1>
  <p>美元/盎司 ↔ 人民币/克 双向换算</p>
</header>

<main>
  <form id="form" novalidate>
    <section class="card">
      <h2>行情参数</h2>
      <div class="row">
        <label for="usd"><b>黄金价格</b>（改任一侧，另一侧自动换算）</label>
        <div class="input-wrap">
          <input id="usd" name="usd" type="number" inputmode="decimal" step="any" placeholder="例如 2650" value="2650">
          <span class="unit">美元/盎司</span>
        </div>
      </div>
      <div class="swap"><span aria-hidden="true"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5v11M5 2.5 2.5 5M5 2.5 7.5 5"/><path d="M11 13.5v-11M11 13.5 8.5 11M11 13.5 13.5 11"/></svg></span></div>
      <div class="row">
        <label for="cny"><b>人民币金价</b>（国内金价）</label>
        <div class="input-wrap">
          <input id="cny" name="cny" type="number" inputmode="decimal" step="any" placeholder="例如 617.70" value="">
          <span class="unit">元/克</span>
        </div>
      </div>
      <div class="row">
        <div class="fx-head">
          <label for="fx"><b>美元兑人民币汇率</b></label>
          <button type="button" id="fx-fetch">自动获取当前汇率</button>
        </div>
        <div class="input-wrap">
          <input id="fx" name="fx" type="number" inputmode="decimal" step="any" placeholder="例如 7.25" value="7.25">
          <span class="unit">CNY/USD</span>
        </div>
        <div class="fx-status" id="fx-status">点「自动获取当前汇率」从网络拉取实时中间价，也可手动填写</div>
        <div class="hint" id="fx-hint">盎司与克的换算按 1 金衡盎司 = 31.1034768 克</div>
      </div>
    </section>

    <div class="btns">
      <button type="button" id="reset">重置</button>
      <button type="submit" id="calc">换算</button>
    </div>
  </form>

  <section id="result" aria-live="polite">
    <div id="result-main"></div>
    <div class="grid" id="grid"></div>
    <div class="formula" id="formula"></div>
  </section>

  <footer>
    两侧互为输入，改任意一侧即自动换算另一侧<br>
    人民币/克 = 美元/盎司 × 汇率 ÷ 31.1034768<br>
    美元/盎司 = 人民币/克 × 31.1034768 ÷ 汇率<br>
    <a href="./index.html">流量点校准</a>·<a href="./gold.html">黄金换算</a>
  </footer>
</main>

<script>
(function(){
  'use strict';

  // 1 金衡盎司 = 31.1034768 克，央行与上海黄金交易所均采用该值
  var GRAMS_PER_OUNCE = 31.1034768;

  var $ = function(id){ return document.getElementById(id); };
  var formEl = $('form');
  var resultEl = $('result');

  function el(tag, cls, text){
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function readNumber(id){
    var raw = String($(id).value).trim();
    if (raw === '') return null;
    var n = Number(raw);
    return isFinite(n) ? n : NaN;
  }

  function clearErrors(){
    ['usd', 'cny', 'fx'].forEach(function(id){ $(id).classList.remove('invalid'); });
    var h = $('fx-hint');
    h.className = 'hint';
    h.textContent = '盎司与克的换算按 1 金衡盎司 = 31.1034768 克';
  }

  // scroll=false 用于输入过程中的实时提示：反复滚动会把视口拽得乱跳
  function showError(msg, id, scroll){
    resultEl.classList.remove('show');
    if (id) $(id).classList.add('invalid');
    setStatus(msg, 'err');
    if (id && scroll !== false) $(id).scrollIntoView({behavior:'smooth', block:'center'});
  }

  // 状态提示：加载中 / 成功 / 失败，互斥切换，避免提示叠加
  var STATUS_DEFAULT = '点「自动获取当前汇率」从网络拉取实时中间价，也可手动填写';
  function setStatus(msg, kind){
    var n = $('fx-status');
    n.className = 'fx-status' + (kind ? ' ' + kind : '');
    n.textContent = msg;
  }

  // 保留 4 位有效数字，避开浮点长尾（如 616.0000000000001）
  function fmt(n, digits){
    if (!isFinite(n)) return '—';
    var d = digits == null ? 4 : digits;
    var v = Number(n.toFixed(d));
    return v.toLocaleString('zh-CN', {maximumFractionDigits:d});
  }

  // 美元/盎司 → 人民币/克
  function usdToCny(usd, fx){
    return usd * fx / GRAMS_PER_OUNCE;
  }

  // 人民币/克 → 美元/盎司
  function cnyToUsd(cny, fx){
    return cny * GRAMS_PER_OUNCE / fx;
  }

  function render(cny, usd, fx){
    var main = el('div', 'result-main');
    main.appendChild(el('div', 'k', '人民币金价'));
    var v = el('div', 'v', fmt(cny, 2));
    v.appendChild(el('small', null, '元/克'));
    main.appendChild(v);
    $('result-main').innerHTML = '';
    $('result-main').appendChild(main);

    var grid = $('grid');
    grid.innerHTML = '';
    var cells = [
      ['美元/盎司', fmt(usd, 2) + ' 美元'],
      ['汇率', fmt(fx, 4) + ' CNY/USD'],
      ['人民币/克', fmt(cny, 2) + ' 元'],
      ['人民币/千克', fmt(cny * 1000, 2) + ' 元']
    ];
    cells.forEach(function(c){
      var cell = el('div');
      cell.appendChild(el('div', 'k', c[0]));
      cell.appendChild(el('div', 'v', c[1]));
      grid.appendChild(cell);
    });

    $('formula').innerHTML =
      '<div class="t">换算过程</div>' +
      '<div><code>' + fmt(cny, 2) + ' 元/克 = ' + fmt(usd, 2) + ' 美元/盎司 × ' + fmt(fx, 4) + ' ÷ ' + GRAMS_PER_OUNCE + '</code></div>' +
      '<div style="margin-top:6px">反向核对：<code>' + fmt(cnyToUsd(cny, fx), 2) + ' 美元/盎司 = ' + fmt(cny, 2) + ' 元/克 × ' + GRAMS_PER_OUNCE + ' ÷ ' + fmt(fx, 4) + '</code></div>';

    resultEl.classList.add('show');
    resultEl.scrollIntoView({behavior:'smooth', block:'start'});
  }

  // 读一个输入框并要求为正数，非法时高亮该框并给出中文提示
  function readPositive(id, label){
    var v = readNumber(id);
    if (v === null){ showError('请填写' + label, id); return null; }
    if (isNaN(v) || v <= 0){ showError(label + '需为大于 0 的数字', id); return null; }
    return v;
  }

  // 双向输入的核心：source 标记用户最后编辑的一侧，另一侧据此算出，
  // 保证两个框永远自洽。source='usd' 以美元/盎司为准，'cny' 以人民币/克为准。
  function collect(source){
    var usd = readPositive('usd', '黄金价格（美元/盎司）');
    if (usd === null) return null;
    var cny = readPositive('cny', '人民币金价（元/克）');
    if (cny === null) return null;
    var fx = readPositive('fx', '美元兑人民币汇率');
    if (fx === null) return null;

    if (source === 'cny') usd = cnyToUsd(cny, fx);
    else cny = usdToCny(usd, fx);

    return { usd: usd, cny: cny, fx: fx };
  }

  // 把结果写回「对面」输入框；用户正在编辑的框不动，避免打断输入
  function syncPair(source, usd, cny){
    if (source === 'usd') $('cny').value = fmtInput(cny);
    else $('usd').value = fmtInput(usd);
  }

  // 写回输入框的数值：保留 4 位小数后去掉尾随零，避免长浮点尾巴
  function fmtInput(n){
    if (!isFinite(n)) return '';
    return String(Number(n.toFixed(4)));
  }

  /* ===== 汇率自动获取 ===== */
  // 按顺序尝试多个公开接口，任一成功即用；均为免密钥、支持浏览器跨域(CORS)的服务
  var FX_SOURCES = [
    {
      name: 'exchangerate-api.com',
      url: 'https://open.er-api.com/v6/latest/USD',
      parse: function(j){
        if (!j || j.result !== 'success' || !j.rates || !j.rates.CNY) return null;
        return { rate: Number(j.rates.CNY), date: j.time_last_update_utc || '' };
      }
    },
    {
      name: 'frankfurter.dev',
      url: 'https://api.frankfurter.dev/v1/latest?base=USD&symbols=CNY',
      parse: function(j){
        if (!j || !j.rates || !j.rates.CNY) return null;
        return { rate: Number(j.rates.CNY), date: j.date || '' };
      }
    }
  ];

  var FX_TIMEOUT = 10000;

  // 老浏览器 / 内嵌 webview 可能没有 fetch，直接判定不可用，走手动填写
  var HAS_FETCH = (typeof fetch === 'function');

  // 带超时的 fetch：外部接口卡住时不能拖死页面
  function fetchJSON(url){
    return new Promise(function(resolve, reject){
      if (!HAS_FETCH) { reject(new Error('fetch-unsupported')); return; }
      var ctrl = ('AbortController' in window) ? new AbortController() : null;
      var timer = setTimeout(function(){
        if (ctrl) ctrl.abort();
        reject(new Error('timeout'));
      }, FX_TIMEOUT);
      fetch(url, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
        .then(function(res){
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(j){ clearTimeout(timer); resolve(j); })
        .catch(function(e){ clearTimeout(timer); reject(e); });
    });
  }

  function fetchRate(idx){
    idx = idx || 0;
    if (idx >= FX_SOURCES.length) return Promise.reject(new Error('all-failed'));
    var src = FX_SOURCES[idx];
    return fetchJSON(src.url).then(function(j){
      var r = src.parse(j);
      if (!r || !isFinite(r.rate) || r.rate <= 0) throw new Error('bad-payload');
      r.source = src.name;
      return r;
    }).catch(function(){ return fetchRate(idx + 1); });
  }

  // 把接口返回的 UTC 时间串转成本地「MM-DD HH:mm」
  function fmtTime(str){
    var d = new Date(str);
    if (!str || isNaN(d.getTime())) return '';
    var p2 = function(n){ return (n < 10 ? '0' : '') + n; };
    return p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }

  var fxBtn = $('fx-fetch');
  var fxBusy = false;

  // 记录用户最后编辑的是哪一侧，汇率变更时据此决定谁是真值
  var lastSource = 'usd';

  // 按当前源侧重算，同步对面输入框；有结果时一并刷新结果区
  function recalc(){
    var fx = readNumber('fx');
    var src = readNumber(lastSource);
    if (fx === null || isNaN(fx) || fx <= 0) return;
    if (src === null || isNaN(src) || src <= 0) return;

    if (lastSource === 'usd') syncPair('usd', src, usdToCny(src, fx));
    else syncPair('cny', cnyToUsd(src, fx), src);

    if (resultEl.classList.contains('show')) {
      var data = collect(lastSource);
      if (data) render(data.cny, data.usd, data.fx);
    }
  }

  function applyRate(r){
    var v = String(Number(r.rate.toFixed(4)));
    $('fx').value = v;
    $('fx').classList.remove('invalid');
    clearErrors();
    var when = fmtTime(r.date);
    setStatus('已获取 ' + v + ' CNY/USD' + (when ? '（更新于 ' + when + '）' : '') + ' · 来源 ' + r.source, 'ok');
    // 汇率变了，以当前最后编辑的一侧为准重算，两个框同步刷新
    recalc();
  }

  function autoFetchRate(){
    if (fxBusy) return;
    if (!HAS_FETCH) { setStatus('当前环境不支持自动获取，请手动填写汇率', 'err'); return; }
    fxBusy = true;
    fxBtn.disabled = true;
    fxBtn.textContent = '获取中…';
    setStatus('正在获取当前汇率…', 'loading');

    fetchRate(0).then(function(r){
      applyRate(r);
    }).catch(function(){
      setStatus('自动获取失败，可能是网络受限或接口不可用，请手动填写汇率', 'err');
    }).then(function(){
      fxBusy = false;
      fxBtn.disabled = false;
      fxBtn.textContent = '自动获取当前汇率';
    });
  }

  fxBtn.addEventListener('click', autoFetchRate);

  // 打开页面即自动拉取一次，用户无需操作；失败则保留默认值并提示
  function boot(){
    // 按默认值先把两个框对齐，用户一眼就能看出「两侧互为输入」
    recalc();

    if (!HAS_FETCH) {
      setStatus('当前环境不支持自动获取，请手动填写汇率', 'err');
      fxBtn.disabled = true;
      return;
    }
    var connected = (typeof navigator !== 'undefined' && 'onLine' in navigator) ? navigator.onLine : true;
    if (!connected) {
      setStatus('当前网络离线，请手动填写汇率', 'err');
      return;
    }
    autoFetchRate();
  }

  formEl.addEventListener('submit', function(e){
    e.preventDefault();
    clearErrors();
    var data = collect(lastSource);
    if (data) { syncPair(lastSource, data.usd, data.cny); render(data.cny, data.usd, data.fx); }
  });

  function resetForm(){
    lastSource = 'usd';
    $('usd').value = '2650';
    $('fx').value = '7.25';
    $('cny').value = fmtInput(usdToCny(2650, 7.25));
    resultEl.classList.remove('show');
    clearErrors();
    setStatus(STATUS_DEFAULT);
  }

  $('reset').addEventListener('click', resetForm);

  // 双向联动：改哪一侧，哪一侧就成为真值，另一侧实时换算出来。
  // 两个框都只监听自己的 input，不需要「循环同步」的守卫——
  // 代码里给对面赋值不会触发对面的 input 事件，天然不会来回弹。
  var SIDE_LABEL = { usd: '黄金价格（美元/盎司）', cny: '人民币金价（元/克）' };

  ['usd', 'cny'].forEach(function(side){
    $(side).addEventListener('input', function(){
      clearErrors();
      lastSource = side;

      // 编辑中的框非法（空/≤0）就地提示，别让用户点了「换算」才知道填错
      var cur = readNumber(side);
      if (cur === null || isNaN(cur) || cur <= 0) {
        showError('请输入大于 0 的' + SIDE_LABEL[side], side, false);
        return;
      }
      recalc();
    });
  });

  // 汇率：只影响换算系数，不改变「谁是源」，因此单独处理
  $('fx').addEventListener('input', function(){
    clearErrors();
    setStatus(STATUS_DEFAULT);

    var fx = readNumber('fx');
    if (fx === null || isNaN(fx) || fx <= 0) { showError('请输入大于 0 的美元兑人民币汇率', 'fx', false); return; }
    recalc();
  });

  boot();
})();
</script>
</body>
</html>
