<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1668dc">
<title>随机生成</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header>
  <h1>随机生成</h1>
  <p>密码生成 / 随机数 / 随机点名 / MAC 地址</p>
</header>

<main>

  <div class="tabs" id="tabs">
    <button data-tab="pass" class="on">密码生成</button>
    <button data-tab="num">随机数</button>
    <button data-tab="roll">随机点名</button>
    <button data-tab="mac">MAC 地址</button>
  </div>

  <section class="card">
    <h2>参数</h2>
    <div id="fields"></div>
    <p class="hint" id="hint"></p>
  </section>

  <div class="btns"><button type="button" class="ghost" id="reset">重置</button><button type="button" class="primary" id="run">生成</button></div>

  <section class="card">
    <h2>结果</h2>
    <div class="out mono-lg" id="output"></div>
    <button type="button" id="copy" style="width:100%;height:44px;font-size:15px;font-weight:600;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:12px">复制结果</button>
  </section>

  <footer>
    随机源为浏览器 crypto.getRandomValues，非 Math.random<br>
    <a href="./tools.html">← 工具目录</a>·<a href="./index.html">工具入口</a>
  </footer>
</main>

<script src="./app.js"></script>
<script src="./random.js"></script>
</body>
</html>
