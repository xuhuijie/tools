<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1668dc">
<title>数字与单位</title>
<style>
/* 工具页共用样式：与仓库既有单文件页保持同一套视觉，抽出来避免十个页面各写一遍 */
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1f2329;--sub:#8a9099;--line:#e8eaed;
  --primary:#1668dc;--primary-press:#0f52b3;--soft:#e8f1fd;--soft-line:#c3dbfb;
  --warn:#d4380d;--ok:#0f8f74;--radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
header{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(135deg,#1668dc,#3b8bf0);color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
header h1{margin:0;font-size:17px;font-weight:600}
header p{margin:4px 0 0;font-size:12px;opacity:.9}
main{max-width:1280px;margin:0 auto;padding:12px 16px 0}
.card{
  background:var(--card);border-radius:var(--radius);
  padding:14px 14px 2px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.card h2{margin:0 0 10px;font-size:14px;font-weight:600}
.row{margin-bottom:12px}
.row label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.row label b{color:var(--text);font-weight:500}
.input-wrap{position:relative;display:flex;align-items:center}
input[type="number"],input[type="text"],input[type="datetime-local"],select{
  width:100%;height:46px;padding:0 12px;
  font-size:16px;color:var(--text);
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  outline:none;font-family:inherit;
}
input[type="number"]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus,select:focus{border-color:var(--primary);background:#fff}
input.invalid{border-color:var(--warn);background:#fff2ef}
.input-wrap .unit{position:absolute;right:12px;font-size:12px;color:var(--sub);pointer-events:none}
.input-wrap input[type="number"]{padding-right:64px}
textarea{
  width:100%;min-height:130px;padding:10px 12px;
  font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--text);
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  outline:none;resize:vertical;
}
textarea:focus{border-color:var(--primary);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin:2px 0 14px}
.btns button{flex:1;height:48px;font-size:16px;font-weight:600;border-radius:12px;border:none}
.btns button.primary{background:var(--primary);color:#fff}
.btns button.primary:active{background:var(--primary-press)}
.btns button.ghost{flex:0 0 96px;background:#fff;color:var(--text);border:1px solid var(--line)}
.btns.three button.ghost{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{
  padding:0 12px;height:32px;font-size:13px;color:var(--primary);
  background:var(--soft);border:1px solid var(--soft-line);border-radius:9px;
}
.chips button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.hint{font-size:12px;color:var(--sub);margin:6px 0 0;line-height:1.5}
.hint.err{color:var(--warn)}
.out{
  font:13px/1.7 ui-monospace,Menlo,Consolas,monospace;
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:12px;word-break:break-all;white-space:pre-wrap;
}
.out:empty{display:none}
.out.mono-lg{font-size:15px}
.out.err{color:var(--warn);background:#fff2ef;border-color:#ffd6cf}
.out.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.grid div{background:#fff;padding:10px 12px}
.grid .k{font-size:12px;color:var(--sub)}
.grid .v{font-size:16px;font-weight:600;margin-top:2px;word-break:break-all}
.formula{
  font-size:12px;color:var(--sub);line-height:1.6;
  background:#f7f8fa;border-radius:10px;padding:10px 12px;margin-bottom:12px;
  word-break:break-all;
}
.formula .t{color:var(--text);font-weight:600}
.formula code{font-family:ui-monospace,Menlo,Consolas,monospace;color:#4b5563}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);word-break:break-all}
th{color:var(--sub);font-weight:500}
td.num{font-family:ui-monospace,Menlo,Consolas,monospace}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pick button{
  padding:0 12px;height:34px;font-size:13px;border-radius:9px;
  background:#fff;color:var(--text);border:1px solid var(--line);
}
.pick button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.list{margin:0 0 12px;padding:0;list-style:none}
.list li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:none}
.list a{color:var(--primary);text-decoration:none;font-weight:500}
.list .d{display:block;font-size:12px;color:var(--sub);margin-top:2px;line-height:1.45}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.tabs button{
  flex:0 0 auto;padding:0 14px;height:34px;font-size:13px;border-radius:9px;
  background:#fff;color:var(--sub);border:1px solid var(--line);
}
.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
footer{max-width:1280px;margin:0 auto;padding:0 16px;font-size:12px;color:var(--sub);text-align:center;line-height:1.7}
footer a{color:var(--primary);text-decoration:none;margin:0 6px}
@media(max-width:360px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>数字与单位</h1>
  <p>金额大写 / 存储单位 / 幂与开方 / 对数 / 整除 / 因数 / 数列 / 字节统计 / 钢管重量</p>
</header>

<main>

  <div class="tabs" id="tabs">
    <button data-tab="daxie" class="on">金额大写</button>
    <button data-tab="storage">存储单位</button>
    <button data-tab="power">幂与开方</button>
    <button data-tab="log">对数</button>
    <button data-tab="divide">整除判断</button>
    <button data-tab="divisor">整除数（因数）</button>
    <button data-tab="series">等差等比数列</button>
    <button data-tab="bytes">字节数统计</button>
    <button data-tab="steel">钢管重量</button>
  </div>

  <section class="card">
    <h2 id="in-title">输入</h2>
    <div id="fields"></div>
    <p class="hint" id="hint"></p>
  </section>

  <div class="btns">
    <button type="button" class="ghost" id="reset">重置</button>
    <button type="button" class="primary" id="run">计算</button>
  </div>

  <section class="card">
    <h2>结果</h2>
    <div class="out mono-lg" id="output" style="display:none"></div>
    <div id="result-body"></div>
  </section>

  <footer>
    纯本地计算，结果附代入过程便于复核<br>
    <a href="./index.html">返回首页</a>
  </footer>
</main>

<script>
/* 工具页共用小工具：取元素、格式化、复制、页签切换 */
(function (global) {
  'use strict';

  // 复制到剪贴板：HTTPS/本地才用异步 API，其余回退到 execCommand
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacy(text); });
    }
    return Promise.resolve(legacy(text));
  }

  function legacy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  // 保留 digits 位小数并去掉长浮点尾巴
  function fmt(n, digits) {
    if (!isFinite(n)) return '—';
    var d = digits == null ? 4 : digits;
    return Number(n.toFixed(d)).toLocaleString('zh-CN', { maximumFractionDigits: d });
  }

  // 写回输入框的数值，避免 0.30000000000000004 这类尾巴
  function fmtInput(n, digits) {
    if (!isFinite(n)) return '';
    return String(Number(n.toFixed(digits == null ? 6 : digits)));
  }

  // 页面 id 查找：散装单页就是全局 getElementById；多页合一（整站单文件）时先在本页
  // section 里找。各页原本共用同一套 id（tabs、input、output…），合到一份文档里会互相
  // 抢，所以查找必须限定在当前显示的那页——这样各页脚本一字不改也能各找各的。
  function $(id) {
    var scope = global.__PAGE__;
    if (scope) {
      var hit = scope.querySelector('[id="' + id + '"]');
      if (hit) return hit;
    }
    return document.getElementById(id);
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  // 在容器内渲染 label/value 网格
  function cells(container, pairs) {
    container.innerHTML = '';
    pairs.forEach(function (p) {
      var cell = el('div');
      cell.appendChild(el('div', 'k', p[0]));
      cell.appendChild(el('div', 'v', p[1]));
      container.appendChild(cell);
    });
  }

  // 复制按钮通用绑定：btn 复制 target 的文本，成功后短暂改文案
  function bindCopy(btn, getText, doneText) {
    if (!btn) return;
    var original = btn.textContent;
    btn.addEventListener('click', function () {
      var text = getText();
      if (!text) return;
      copy(text).then(function () {
        btn.textContent = doneText || '已复制';
        setTimeout(function () { btn.textContent = original; }, 1200);
      });
    });
  }

  // 页签：buttons 为一组按钮，onPick 收到 data-tab
  function tabs(container, onPick) {
    var btns = [].slice.call(container.querySelectorAll('button'));
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        btns.forEach(function (o) { o.classList.toggle('on', o === b); });
        syncHash(b.dataset.tab);
        onPick(b.dataset.tab, b);
      });
    });
    return btns;
  }

  // 把按钮高亮对齐到 name。点击时 tabs() 已经切过，但初始化是从 hash 进来的，
  // 未必等于 HTML 里写死 class="on" 的那个，所以各页的 setTab 里要再调一次。
  function markTab(name) {
    // 多页合一文档里 #tabs 会出现很多个，只能标当前页那个
    var scope = global.__PAGE__ || document;
    [].forEach.call(scope.querySelectorAll('#tabs button'), function (b) {
      b.classList.toggle('on', b.dataset.tab === name);
    });
  }

  // 切页签时把页签名写回地址，刷新与分享都能停在同一个工具上
  function syncHash(name) {
    if (!global.history || !global.history.replaceState) return;
    global.history.replaceState(null, '', '#' + name);
  }

  // 地址 hash 指定页签：#<页签名>，如 number.html#divisor。
  // 首页每条工具都带着 href="./page.html#tab" 过来，没有它就永远落回默认页签。
  function hashTab() {
    var h = String(global.location && global.location.hash || '').replace(/^#/, '');
    return /^[a-z0-9]+$/i.test(h) ? h : null;
  }

  // 打开页面时该选哪个页签：优先地址 hash（且必须是本页真实存在的页签），否则 defaultTab。
  function firstTab(defaultTab) {
    var want = hashTab();
    if (!want) return defaultTab;
    var btns = [].slice.call((global.__PAGE__ || document).querySelectorAll('#tabs button'));
    var ok = btns.some(function (b) { return b.dataset.tab === want; });
    return ok ? want : defaultTab;
  }

  // ---- 整站单文件（多页合一）支持 ----
  // 手机从「下载 / 文件管理器」打开时走 content:// URI：页面里 ./xxx.html 这类「跳到另一个
  // 文件」的链接会被拦下，报「文件找不到」。内联只解决了 css/js 子资源，解决不了跨页跳转。
  // 于是把全部页面装进同一个文档、每个页面一个 <section class="page" id="page-xxx.html">，
  // 点链接改成文档内切 section。散装单页里没有这些 section，一切维持原样。
  // 页面状态只放内存，不写地址栏：#<页签名> 这个通道被页面自己的页签逻辑占着
  //（如 checksum.html 会把它改写成 #crc），占用它会让页签与切页互相踩。
  var PAGE_SEL = 'main > section.page';

  function isHost() { return !!document.querySelector(PAGE_SEL); }

  function pageEl(name) { return document.querySelector(PAGE_SEL + '[data-name="' + name + '"]'); }

  // 切到某页：只显示这一页、把它的脚本拉起来一次（首访），并同步 hash 与标题。
  function go(name) {
    if (!isHost()) return true;
    name = String(name || '').toLowerCase();
    var want = pageEl(name);
    if (!want) return true;                 // 不认识的页，交回浏览器
    [].slice.call(document.querySelectorAll(PAGE_SEL)).forEach(function (sec) {
      var on = sec === want;
      sec.hidden = !on;
      if ('inert' in sec) sec.inert = !on;
    });
    global.__PAGE__ = want;
    document.title = (want.dataset.title || name) + ' · 工具合集';
    global.scrollTo(0, 0);
    // 本页脚本在合成时收进了 <script type="text/plain" data-for="page">，首访才执行：
    // 不执行的话，页里那些 document.getElementById 会先撞上别页的同名元素。
    var lazy = want.querySelector('script[type="text/x-page-init"]');
    if (lazy && !want.dataset.ready) {
      want.dataset.ready = '1';
      var run = document.createElement('script');
      run.textContent = lazy.textContent;
      document.body.appendChild(run);
      run.remove();
    }
    return false;
  }

  // 文档内所有「去某页」的点击：带 data-page 的链接、./xxx.html 链接都接管
  function bindNav() {
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest && e.target.closest('a');
      if (!a) return;
      var name = a.dataset.page ||
        ((a.getAttribute('href') || '').match(/([a-z0-9_-]+\.html)(?:$|#)/i) || [])[1];
      if (name && go(name) === false) e.preventDefault();
    });
  }

  // 首屏落首页：单文件里没有「外部直接进来」的入口，一律从首页开始
  function boot() {
    if (!isHost()) return;
    if (global.__PAGE__) return;            // 已有活动页，别覆盖
    go(pageEl('index.html') ? 'index.html' : document.querySelector(PAGE_SEL).dataset.name);
    bindNav();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  global.T = { $: $, el: el, fmt: fmt, fmtInput: fmtInput, cells: cells, copy: copy, bindCopy: bindCopy, tabs: tabs, hashTab: hashTab, firstTab: firstTab, syncHash: syncHash, markTab: markTab, go: go };
})(window);
</script>
<script>
/* 数字与单位：金额大写 / 存储单位 / 幂与开方 / 对数 / 因数 / 数列 / 字节统计 / 钢管重量 */
(function () {
  'use strict';
  var $ = T.$, fields = $('fields'), out = $('result-body'), input = null, current = 'daxie';

  // ---------- 字段定义 ----------
  var FORMS = {
    daxie: {
      hint: '金额小写转中文大写，按财务规范处理零、整、角、分。支持到万亿位，负数加「负」。',
      fields: [{ id: 'amount', label: '金额（元）', value: '1234567.89', type: 'number', step: 'any' }]
    },
    storage: {
      hint: '二进制与十进制两套单位分开换算：1 KiB = 1024 B、1 KB = 1000 B。磁盘厂商标称容量多用十进制。',
      fields: [
        { id: 'size', label: '数值', value: '1', type: 'number', step: 'any' },
        { id: 'from', label: '原单位', type: 'select', options: ['bit', 'Byte', 'KiB', 'MiB', 'GiB', 'TiB', 'PiB', 'EiB', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB'], value: 'GiB' }
      ]
    },
    power: {
      hint: '幂运算与开方：整数指数走 Number，大整数指数自动切 BigInt 保证精度；开 n 次方按实数主根计算。',
      fields: [
        { id: 'base', label: '底数 x', value: '2', type: 'number', step: 'any' },
        { id: 'exp', label: '指数 n', value: '10', type: 'number', step: 'any' }
      ]
    },
    log: {
      hint: '对数：底数留空按自然对数 ln 计算。底数需大于 0 且不等于 1，真数需大于 0。',
      fields: [
        { id: 'x', label: '真数 N', value: '1000', type: 'number', step: 'any' },
        { id: 'b', label: '底数（留空为 ln）', value: '10', type: 'number', step: 'any' }
      ]
    },
    divide: {
      hint: '整除判断：给被除数与除数，算商与余数，说清能不能整除；除不尽时顺带给出最大整除数与最接近的整除结果。',
      fields: [
        { id: 'a', label: '被除数', value: '500', type: 'number', step: 'any' },
        { id: 'b', label: '除数', value: '5', type: 'number', step: 'any' }
      ]
    },
    divisor: {
      hint: '列出所有能整除该数的数：包含 1 与它本身，附质因数分解、因数个数与因数和。',
      fields: [
        { id: 'n', label: '待分解整数 N', value: '360', type: 'number', step: '1' }
      ]
    },
    series: {
      hint: '等差数列与等比数列求和，同时给出第 n 项。等比时公比可为小数。',
      fields: [
        { id: 'first', label: '首项 a₁', value: '1', type: 'number', step: 'any' },
        { id: 'ratio', label: '公差 d / 公比 q', value: '2', type: 'number', step: 'any' },
        { id: 'count', label: '项数 n', value: '10', type: 'number', step: '1' },
        { id: 'kind', label: '数列类型', type: 'select', options: [['ap', '等差数列（等差 d）'], ['gp', '等比数列（公比 q）']], value: 'ap' }
      ]
    },
    bytes: {
      hint: '字节统计：按 UTF-8 规则分别统计中文、英文、数字、空格、其他字符的字节数，并给出总字符数与总字节数。',
      fields: [{ id: 'text', label: '文本内容', type: 'textarea', value: '计量工具 tools 2024' }]
    },
    steel: {
      hint: '钢管（圆管）理论重量：W = π × (D − S) × S × ρ ÷ 1000，D 外径、S 壁厚单位为 mm，结果按 kg/m。',
      fields: [
        { id: 'od', label: '外径 D', value: '108', type: 'number', step: 'any' },
        { id: 'wall', label: '壁厚 S', value: '4', type: 'number', step: 'any' },
        { id: 'rho', label: '密度 ρ', value: '7.85', type: 'number', step: 'any' }
      ]
    }
  };

  // ---------- 金额大写 ----------
  var DIGITS = '零壹贰叁肆伍陆柒捌玖';
  var UNITS = ['', '拾', '佰', '仟'];
  var SECTIONS = ['', '万', '亿', '万亿'];

  function sectionToChinese(section) {
    // section 为 0~9999 的整数，返回中文读法（不含「万/亿」级）
    var s = '', zero = false;
    for (var i = 0; i < 4; i++) {
      var d = section % 10;
      if (d === 0) {
        // 末位为零不读，中间连续的零只读一个
        if (s !== '') zero = true;
      } else {
        s = DIGITS[d] + UNITS[i] + (zero ? '零' : '') + s;
        zero = false;
      }
      section = Math.floor(section / 10);
      if (section === 0) break;
    }
    return s;
  }

  function amountToChinese(value) {
    var neg = value < 0;
    var abs = Math.abs(value);
    if (abs >= 1e16) throw new Error('金额超出支持范围（须小于 1 万亿）');
    // 用字符串乘法避免浮点误差：先把元角分拆成整数分
    var cents = Math.round(abs * 100);
    var yuan = Math.floor(cents / 100);
    var jiao = Math.floor(cents % 100 / 10);
    var fen = cents % 10;

    var result = '';
    if (yuan === 0) {
      result = '';
    } else {
      var secIdx = 0, num = yuan;
      var secs = [];
      while (num > 0) { secs.push(num % 10000); num = Math.floor(num / 10000); }
      for (var i = secs.length - 1; i >= 0; i--) {
        var part = sectionToChinese(secs[i]);
        if (part === '') {
          // 整节为零：仅在后面还有非零节时补一个「零」
          var rest = secs.slice(0, i).some(function (v) { return v > 0; });
          if (rest && result !== '' && result.slice(-1) !== '零') result += '零';
        } else {
          // 本级不足四位数时，前导零要读出来（如 1 0001 → 壹万零壹）
          var needZero = result !== '' && secs[i] < 1000 && result.slice(-1) !== '零';
          result += (needZero ? '零' : '') + part + SECTIONS[i];
        }
        secIdx++;
      }
      result += '元';
    }

    if (jiao === 0 && fen === 0) {
      result = result === '' ? '零元整' : result + '整';
    } else {
      if (jiao > 0) result += DIGITS[jiao] + '角';
      else if (result !== '' && fen > 0) result += '零';
      if (fen > 0) result += DIGITS[fen] + '分';
    }
    return (neg ? '负' : '') + result;
  }

  // ---------- 存储单位 ----------
  // 每单位换算到 bit 的系数：bit 是共同基准
  var BITS = {
    bit: 1, Byte: 8,
    KiB: 8 * 1024, MiB: 8 * 1024 ** 2, GiB: 8 * 1024 ** 3, TiB: 8 * 1024 ** 4,
    PiB: 8 * 1024 ** 5, EiB: 8 * 1024 ** 6,
    KB: 8e3, MB: 8e6, GB: 8e9, TB: 8e12, PB: 8e15, EB: 8e18
  };

  function storage(value, from) {
    var bits = value * BITS[from];
    var order = ['bit', 'Byte', 'KiB', 'MiB', 'GiB', 'TiB', 'PiB', 'EiB', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB'];
    return order.map(function (u) {
      return [u, T.fmt(bits / BITS[u], 8)];
    });
  }

  // ---------- 幂与开方 ----------
  function powerResult(x, n) {
    var rows = [];
    if (Number.isInteger(n) && Math.abs(n) <= 100000) {
      // 整数指数：底数也是整数且结果会溢出 double 精度时走 BigInt
      if (Number.isInteger(x) && Math.abs(x) < 1e6 && n > 0) {
        var big = BigInt(x) ** BigInt(n);
        var bigStr = big.toString();
        rows.push(['x^n（精确）', bigStr.length > 60 ? bigStr.slice(0, 30) + '…（共 ' + bigStr.length + ' 位）' : bigStr]);
      }
      rows.push(['x^n', T.fmt(Math.pow(x, n), 10)]);
    } else {
      rows.push(['x^n', T.fmt(Math.pow(x, n), 10)]);
    }
    if (x >= 0) rows.push(['x^(1/n)（n 次根）', T.fmt(Math.pow(x, 1 / n), 10)]);
    else if (Number.isInteger(n) && n % 2 !== 0) rows.push(['x^(1/n)（奇次根，负）', T.fmt(-Math.pow(-x, 1 / n), 10)]);
    else rows.push(['x^(1/n)', '负数在实数范围无偶次根']);
    rows.push(['√x（平方根）', x >= 0 ? T.fmt(Math.sqrt(x), 10) : '负数无实数平方根']);
    return rows;
  }

  // ---------- 对数 ----------
  function logResult(x, b) {
    if (x <= 0) throw new Error('真数需大于 0');
    var rows = [['ln N', T.fmt(Math.log(x), 10)], ['log₁₀ N', T.fmt(Math.log10(x), 10)], ['log₂ N', T.fmt(Math.log2(x), 10)]];
    if (b != null) {
      if (b <= 0 || b === 1) throw new Error('底数需大于 0 且不等于 1');
      rows.unshift(['log_b N', T.fmt(Math.log(x) / Math.log(b), 10)]);
    }
    return rows;
  }

  // ---------- 因数与整除 ----------
  function factorize(n) {
    var factors = [], m = n;
    for (var p = 2; p * p <= m; p++) {
      if (m % p === 0) {
        var e = 0;
        while (m % p === 0) { m /= p; e++; }
        factors.push([p, e]);
      }
    }
    if (m > 1) factors.push([m, 1]);
    return factors;
  }

  function divisors(n) {
    var list = [1];
    factorize(n).forEach(function (f) {
      var p = f[0], e = f[1], next = [];
      var pw = 1;
      for (var i = 0; i <= e; i++) {
        list.forEach(function (d) { next.push(d * pw); });
        pw *= p;
      }
      list = next;
    });
    return list.sort(function (a, b) { return a - b; });
  }

  // 整除判断：能不能被整除、商与余数各是多少
  function divideResult(a, b) {
    if (b === 0) throw new Error('除数不能为 0');
    var rows = [];
    var q = a / b;
    if (Number.isInteger(a) && Number.isInteger(b)) {
      // 整数之间才谈得上余数；用截断取商，负数的余数与被除数同号
      var quo = Math.trunc(q);
      var rem = a - b * quo;
      rows.push(['商', String(quo)]);
      rows.push(['余数', String(rem)]);
      rows.push(['整除判断', rem === 0
        ? a + ' ÷ ' + b + ' = ' + quo + '，能整除'
        : a + ' ÷ ' + b + ' = ' + quo + ' 余 ' + rem + '，不能整除']);
      if (rem !== 0) {
        rows.push(['向下取整的商', String(Math.floor(q))]);
        rows.push(['最近的整除结果', String(Math.round(q)) + ' × ' + b + ' = ' + T.fmt(Math.round(q) * b, 10)]);
      }
    } else {
      rows.push(['商', T.fmt(q, 10)]);
      rows.push(['整除判断', '两数含小数，直接给出商；能整除时商为整数']);
    }
    rows.push(['原始式子', a + ' ÷ ' + b]);
    return rows;
  }

  // 所有能整除 N 的数（正因数）
  function divisorResult(n) {
    if (!Number.isInteger(n) || n < 1) throw new Error('待分解的 N 需为不小于 1 的整数');
    if (n > 1e12) throw new Error('N 过大，试除法难以在瞬间完成，请换更小的数');
    var fs = factorize(n);
    var ds = divisors(n);
    var expr = fs.map(function (f) { return f[1] === 1 ? String(f[0]) : f[0] + '^' + f[1]; }).join(' × ');
    var count = ds.length;
    var sum = ds.reduce(function (a, b) { return a + b; }, 0);
    return [
      ['所有整除数', ds.length > 60 ? ds.slice(0, 60).join(', ') + ' …（共 ' + count + ' 个）' : ds.join(', ')],
      ['个数', String(count)],
      ['质因数分解', n === 1 ? '1（无质因数）' : (n + ' = ' + expr)],
      ['因数和', String(sum)]
    ];
  }

  // ---------- 数列 ----------
  function seriesResult(a1, r, n, kind) {
    if (!Number.isInteger(n) || n < 1) throw new Error('项数需为不小于 1 的整数');
    if (n > 1e6) throw new Error('项数过大（上限 100 万）');
    var last, sum;
    if (kind === 'gp') {
      last = a1 * Math.pow(r, n - 1);
      sum = r === 1 ? a1 * n : a1 * (1 - Math.pow(r, n)) / (1 - r);
      return [
        ['类型', '等比数列'],
        ['第 n 项 aₙ', T.fmt(last, 10)],
        ['前 n 项和 Sₙ', T.fmt(sum, 10)],
        ['代入', 'aₙ = ' + a1 + ' × ' + r + '^' + (n - 1) + '；Sₙ = a₁(1−qⁿ)/(1−q)']
      ];
    }
    last = a1 + (n - 1) * r;
    sum = n * (a1 + last) / 2;
    return [
      ['类型', '等差数列'],
      ['第 n 项 aₙ', T.fmt(last, 10)],
      ['前 n 项和 Sₙ', T.fmt(sum, 10)],
      ['代入', 'aₙ = ' + a1 + ' + (' + n + ' − 1) × ' + r + '；Sₙ = ' + n + ' × (' + a1 + ' + ' + T.fmt(last, 10) + ') ÷ 2']
    ];
  }

  // ---------- 字节统计 ----------
  function byteStats(text) {
    var counts = { 中文: 0, 英文: 0, 数字: 0, 空格: 0, 其他: 0 };
    var chars = { 中文: 0, 英文: 0, 数字: 0, 空格: 0, 其他: 0 };
    Array.from(text).forEach(function (ch) {
      var cp = ch.codePointAt(0);
      var key;
      if (/[\u4e00-\u9fff\u3400-\u4dbf]/.test(ch)) key = '中文';
      else if (/[a-zA-Z]/.test(ch)) key = '英文';
      else if (/[0-9]/.test(ch)) key = '数字';
      else if (/\s/.test(ch)) key = '空格';
      else key = '其他';
      chars[key]++;
      // UTF-8 字节数按码位判定：ASCII 1 字节，≤0x7FF 2 字节，≤0xFFFF 3 字节，其余 4 字节
      counts[key] += cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
    });
    var rows = [['总字符数', String(Array.from(text).length)], ['总字节数（UTF-8）', String(new TextEncoder().encode(text).length)]];
    Object.keys(counts).forEach(function (k) {
      rows.push([k, chars[k] + ' 个字符 / ' + counts[k] + ' 字节']);
    });
    return rows;
  }

  // ---------- 钢管重量 ----------
  function steelResult(od, wall, rho) {
    if (od <= 0 || wall <= 0) throw new Error('外径与壁厚需大于 0');
    if (wall * 2 >= od) throw new Error('壁厚过大：2 × 壁厚需小于外径');
    // W(kg/m) = π × (D − S) × S × ρ / 1000，D、S 单位 mm，ρ 单位 g/cm³
    var w = Math.PI * (od - wall) * wall * rho / 1000;
    return [
      ['理论重量', T.fmt(w, 4) + ' kg/m'],
      ['每米截面积', T.fmt(Math.PI * (od - wall) * wall, 4) + ' mm²'],
      ['内径', T.fmt(od - wall * 2, 3) + ' mm'],
      ['代入', 'W = π × (' + od + ' − ' + wall + ') × ' + wall + ' × ' + rho + ' ÷ 1000']
    ];
  }

  // ---------- 渲染 ----------
  function buildFields(form) {
    fields.innerHTML = '';
    form.fields.forEach(function (f) {
      var row = T.el('div', 'row');
      var label = T.el('label', null, f.label);
      label.setAttribute('for', f.id);
      row.appendChild(label);
      var node;
      if (f.type === 'select') {
        node = document.createElement('select');
        (f.options || []).forEach(function (o) {
          var opt = document.createElement('option');
          var val = Array.isArray(o) ? o[0] : o;
          opt.value = val;
          opt.textContent = Array.isArray(o) ? o[1] : o;
          if (val === f.value) opt.selected = true;
          node.appendChild(opt);
        });
      } else if (f.type === 'textarea') {
        node = document.createElement('textarea');
        node.value = f.value || '';
      } else {
        node = document.createElement('input');
        node.type = f.type || 'text';
        if (f.type === 'number') { node.inputMode = 'decimal'; }
        node.step = f.step || 'any';
        node.value = f.value == null ? '' : f.value;
      }
      node.id = f.id;
      row.appendChild(node);
      fields.appendChild(row);
    });
  }

  function val(id) {
    var node = $(id);
    if (!node) return null;
    if (node.tagName === 'SELECT') return node.value;
    var raw = String(node.value).trim();
    if (raw === '') return null;
    var n = Number(raw);
    return isNaN(n) ? NaN : n;
  }

  function num(id, label, opts) {
    opts = opts || {};
    var v = val(id);
    if (v === null) {
      if (opts.optional) return null;
      throw new Error('请填写' + label);
    }
    if (isNaN(v)) throw new Error(label + '需为数字');
    return v;
  }

  function run() {
    try {
      var rows;
      if (current === 'daxie') {
        var amt = num('amount', '金额');
        rows = [['小写', amt.toFixed(2)], ['大写', amountToChinese(amt)]];
      } else if (current === 'storage') {
        rows = [['换算基准', num('size', '数值') + ' ' + val('from')]].concat(storage(num('size', '数值'), val('from')));
      } else if (current === 'power') {
        rows = powerResult(num('base', '底数'), num('exp', '指数'));
      } else if (current === 'log') {
        rows = logResult(num('x', '真数 N'), num('b', '底数', { optional: true }));
      } else if (current === 'divide') {
        rows = divideResult(num('a', '被除数'), num('b', '除数'));
      } else if (current === 'divisor') {
        rows = divisorResult(num('n', '待分解整数 N'));
      } else if (current === 'series') {
        rows = seriesResult(num('first', '首项'), num('ratio', '公差/公比'), num('count', '项数'), val('kind'));
      } else if (current === 'bytes') {
        rows = byteStats($('text').value);
      } else if (current === 'steel') {
        rows = steelResult(num('od', '外径'), num('wall', '壁厚'), num('rho', '密度'));
      }
      out.innerHTML = '';
      var grid = T.el('div', 'grid');
      rows.forEach(function (r) {
        var cell = T.el('div');
        cell.appendChild(T.el('div', 'k', r[0]));
        cell.appendChild(T.el('div', 'v', r[1]));
        grid.appendChild(cell);
      });
      out.appendChild(grid);
      $('hint').className = 'hint';
      $('hint').textContent = FORMS[current].hint;
    } catch (e) {
      out.innerHTML = '';
      $('hint').className = 'hint err';
      $('hint').textContent = '计算失败：' + e.message;
    }
  }

  function setTab(name) {
    current = name;
    T.markTab(name);
    var form = FORMS[name];
    buildFields(form);
    $('hint').className = 'hint';
    $('hint').textContent = form.hint;
    out.innerHTML = '';
  }

  T.tabs($('tabs'), setTab);
  $('run').addEventListener('click', run);
  $('reset').addEventListener('click', function () { setTab(current); });

  // 输入框回车即算，省一次点击
  fields.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') run(); });

  setTab(T.firstTab('daxie'));
})();
</script>
</body>
</html>
