<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1668dc">
<title>几何与电子计算</title>
<link rel="stylesheet" href="./app.css">
<style>
  .shape{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .shape svg{flex:0 0 96px;width:96px;height:96px}
  .shape svg .o{fill:none;stroke:var(--primary);stroke-width:2.4;stroke-linejoin:round}
  .shape svg .f{fill:#e8f1fd}
  .shape svg .l{stroke:var(--sub);stroke-width:1;stroke-dasharray:4 3}
  .shape svg text{font:11px ui-monospace,Menlo,Consolas,monospace;fill:var(--sub)}
  .shape .cap{font-size:12px;color:var(--sub);line-height:1.65}
  .shape .cap b{color:var(--text);font-weight:600}
  .fx{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--sub);margin:0 0 12px}
  .fx b{color:var(--primary);font-weight:600}
  .rlc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .rlc .cell-r{background:#f7f8fa;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .rlc .cell-r .k{font-size:12px;color:var(--sub)}
  .rlc .cell-r .v{font-size:17px;font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:3px;word-break:break-all}
  .res-mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
</style>
</head>
<body>
<header>
  <h1>几何与电子计算</h1>
  <p>面积体积 · 三角函数 · 电阻网络</p>
</header>

<main>
  <div class="tabs" id="tabs">
    <button data-tab="plane" class="on">平面图形</button>
    <button data-tab="solid">立体图形</button>
    <button data-tab="trig">三角函数</button>
    <button data-tab="res">电阻计算</button>
  </div>

  <section class="card">
    <h2 id="panel-title">平面图形面积与周长</h2>
    <div class="shape" id="shape"></div>
    <div id="fields"></div>
    <p class="hint" id="hint"></p>
  </section>

  <div class="btns"><button type="button" class="ghost" id="reset">重置</button><button type="button" class="primary" id="run">计算</button></div>

  <section class="card">
    <h2>结果</h2>
    <div class="fx" id="formula"></div>
    <div class="grid" id="grid"></div>
    <div class="out mono-lg" id="output"></div>
  </section>

  <footer>
    结果保留 6 位有效小数，公式与代入过程一并给出便于复核<br>
    <a href="./tools.html">← 工具目录</a>·<a href="./index.html">工具入口</a>
  </footer>
</main>

<script src="./app.js"></script>
<script src="./geometry.js"></script>
</body>
</html>
