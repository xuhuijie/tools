<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1668dc">
<title>几何与电子计算</title>
<style>
/* 工具页共用样式：与仓库既有单文件页保持同一套视觉，抽出来避免十个页面各写一遍 */
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1f2329;--sub:#8a9099;--line:#e8eaed;
  --primary:#1668dc;--primary-press:#0f52b3;--soft:#e8f1fd;--soft-line:#c3dbfb;
  --warn:#d4380d;--ok:#0f8f74;--radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
header{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(135deg,#1668dc,#3b8bf0);color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
header h1{margin:0;font-size:17px;font-weight:600}
header p{margin:4px 0 0;font-size:12px;opacity:.9}
main{max-width:1280px;margin:0 auto;padding:12px 16px 0}
.card{
  background:var(--card);border-radius:var(--radius);
  padding:14px 14px 2px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.card h2{margin:0 0 10px;font-size:14px;font-weight:600}
.row{margin-bottom:12px}
.row label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.row label b{color:var(--text);font-weight:500}
.input-wrap{position:relative;display:flex;align-items:center}
input[type="number"],input[type="text"],input[type="datetime-local"],select{
  width:100%;height:46px;padding:0 12px;
  font-size:16px;color:var(--text);
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  outline:none;font-family:inherit;
}
input[type="number"]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus,select:focus{border-color:var(--primary);background:#fff}
input.invalid{border-color:var(--warn);background:#fff2ef}
.input-wrap .unit{position:absolute;right:12px;font-size:12px;color:var(--sub);pointer-events:none}
.input-wrap input[type="number"]{padding-right:64px}
textarea{
  width:100%;min-height:130px;padding:10px 12px;
  font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--text);
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  outline:none;resize:vertical;
}
textarea:focus{border-color:var(--primary);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin:2px 0 14px}
.btns button{flex:1;height:48px;font-size:16px;font-weight:600;border-radius:12px;border:none}
.btns button.primary{background:var(--primary);color:#fff}
.btns button.primary:active{background:var(--primary-press)}
.btns button.ghost{flex:0 0 96px;background:#fff;color:var(--text);border:1px solid var(--line)}
.btns.three button.ghost{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{
  padding:0 12px;height:32px;font-size:13px;color:var(--primary);
  background:var(--soft);border:1px solid var(--soft-line);border-radius:9px;
}
.chips button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.hint{font-size:12px;color:var(--sub);margin:6px 0 0;line-height:1.5}
.hint.err{color:var(--warn)}
.out{
  font:13px/1.7 ui-monospace,Menlo,Consolas,monospace;
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:12px;word-break:break-all;white-space:pre-wrap;
}
.out:empty{display:none}
.out.mono-lg{font-size:15px}
.out.err{color:var(--warn);background:#fff2ef;border-color:#ffd6cf}
.out.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.grid div{background:#fff;padding:10px 12px}
.grid .k{font-size:12px;color:var(--sub)}
.grid .v{font-size:16px;font-weight:600;margin-top:2px;word-break:break-all}
.formula{
  font-size:12px;color:var(--sub);line-height:1.6;
  background:#f7f8fa;border-radius:10px;padding:10px 12px;margin-bottom:12px;
  word-break:break-all;
}
.formula .t{color:var(--text);font-weight:600}
.formula code{font-family:ui-monospace,Menlo,Consolas,monospace;color:#4b5563}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);word-break:break-all}
th{color:var(--sub);font-weight:500}
td.num{font-family:ui-monospace,Menlo,Consolas,monospace}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pick button{
  padding:0 12px;height:34px;font-size:13px;border-radius:9px;
  background:#fff;color:var(--text);border:1px solid var(--line);
}
.pick button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.list{margin:0 0 12px;padding:0;list-style:none}
.list li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:none}
.list a{color:var(--primary);text-decoration:none;font-weight:500}
.list .d{display:block;font-size:12px;color:var(--sub);margin-top:2px;line-height:1.45}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.tabs button{
  flex:0 0 auto;padding:0 14px;height:34px;font-size:13px;border-radius:9px;
  background:#fff;color:var(--sub);border:1px solid var(--line);
}
.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
footer{max-width:1280px;margin:0 auto;padding:0 16px;font-size:12px;color:var(--sub);text-align:center;line-height:1.7}
footer a{color:var(--primary);text-decoration:none;margin:0 6px}
@media(max-width:360px){.grid2{grid-template-columns:1fr}}
</style>
<style>
  .shape{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .shape svg{flex:0 0 96px;width:96px;height:96px}
  .shape svg .o{fill:none;stroke:var(--primary);stroke-width:2.4;stroke-linejoin:round}
  .shape svg .f{fill:#e8f1fd}
  .shape svg .l{stroke:var(--sub);stroke-width:1;stroke-dasharray:4 3}
  .shape svg text{font:11px ui-monospace,Menlo,Consolas,monospace;fill:var(--sub)}
  .shape .cap{font-size:12px;color:var(--sub);line-height:1.65}
  .shape .cap b{color:var(--text);font-weight:600}
  .fx{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--sub);margin:0 0 12px}
  .fx b{color:var(--primary);font-weight:600}
  .rlc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .rlc .cell-r{background:#f7f8fa;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .rlc .cell-r .k{font-size:12px;color:var(--sub)}
  .rlc .cell-r .v{font-size:17px;font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:3px;word-break:break-all}
  .res-mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
</style>
</head>
<body>
<header>
  <h1>几何与电子计算</h1>
  <p>面积体积 · 三角函数 · 电阻网络</p>
</header>

<main>
  <div class="tabs" id="tabs">
    <button data-tab="plane" class="on">平面图形</button>
    <button data-tab="solid">立体图形</button>
    <button data-tab="trig">三角函数</button>
    <button data-tab="res">电阻计算</button>
  </div>

  <section class="card">
    <h2 id="panel-title">平面图形面积与周长</h2>
    <div class="shape" id="shape"></div>
    <div id="fields"></div>
    <p class="hint" id="hint"></p>
  </section>

  <div class="btns"><button type="button" class="ghost" id="reset">重置</button><button type="button" class="primary" id="run">计算</button></div>

  <section class="card">
    <h2>结果</h2>
    <div class="fx" id="formula"></div>
    <div class="grid" id="grid"></div>
    <div class="out mono-lg" id="output"></div>
  </section>

  <footer>
    结果保留 6 位有效小数，公式与代入过程一并给出便于复核<br>
    <a href="./index.html">返回首页</a>
  </footer>
</main>

<script>
/* 工具页共用小工具：取元素、格式化、复制、页签切换 */
(function (global) {
  'use strict';

  // 复制到剪贴板：HTTPS/本地才用异步 API，其余回退到 execCommand
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacy(text); });
    }
    return Promise.resolve(legacy(text));
  }

  function legacy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  // 保留 digits 位小数并去掉长浮点尾巴
  function fmt(n, digits) {
    if (!isFinite(n)) return '—';
    var d = digits == null ? 4 : digits;
    return Number(n.toFixed(d)).toLocaleString('zh-CN', { maximumFractionDigits: d });
  }

  // 写回输入框的数值，避免 0.30000000000000004 这类尾巴
  function fmtInput(n, digits) {
    if (!isFinite(n)) return '';
    return String(Number(n.toFixed(digits == null ? 6 : digits)));
  }

  // 页面 id 查找：散装单页就是全局 getElementById；多页合一（整站单文件）时先在本页
  // section 里找。各页原本共用同一套 id（tabs、input、output…），合到一份文档里会互相
  // 抢，所以查找必须限定在当前显示的那页——这样各页脚本一字不改也能各找各的。
  function $(id) {
    var scope = global.__PAGE__;
    if (scope) {
      var hit = scope.querySelector('[id="' + id + '"]');
      if (hit) return hit;
    }
    return document.getElementById(id);
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  // 在容器内渲染 label/value 网格
  function cells(container, pairs) {
    container.innerHTML = '';
    pairs.forEach(function (p) {
      var cell = el('div');
      cell.appendChild(el('div', 'k', p[0]));
      cell.appendChild(el('div', 'v', p[1]));
      container.appendChild(cell);
    });
  }

  // 复制按钮通用绑定：btn 复制 target 的文本，成功后短暂改文案
  function bindCopy(btn, getText, doneText) {
    if (!btn) return;
    var original = btn.textContent;
    btn.addEventListener('click', function () {
      var text = getText();
      if (!text) return;
      copy(text).then(function () {
        btn.textContent = doneText || '已复制';
        setTimeout(function () { btn.textContent = original; }, 1200);
      });
    });
  }

  // 页签：buttons 为一组按钮，onPick 收到 data-tab
  function tabs(container, onPick) {
    var btns = [].slice.call(container.querySelectorAll('button'));
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        btns.forEach(function (o) { o.classList.toggle('on', o === b); });
        syncHash(b.dataset.tab);
        onPick(b.dataset.tab, b);
      });
    });
    return btns;
  }

  // 把按钮高亮对齐到 name。点击时 tabs() 已经切过，但初始化是从 hash 进来的，
  // 未必等于 HTML 里写死 class="on" 的那个，所以各页的 setTab 里要再调一次。
  function markTab(name) {
    // 多页合一文档里 #tabs 会出现很多个，只能标当前页那个
    var scope = global.__PAGE__ || document;
    [].forEach.call(scope.querySelectorAll('#tabs button'), function (b) {
      b.classList.toggle('on', b.dataset.tab === name);
    });
  }

  // 切页签时把页签名写回地址，刷新与分享都能停在同一个工具上。
  // 整站单文件里 No-op：地址栏归页面导航用（见 applyPageHash），页签只活在内存里，
  // 免得「这一页的 #ssl」被带到下一页去抢页签。
  function syncHash(name) {
    if (isHost()) return;
    if (!global.history || !global.history.replaceState) return;
    global.history.replaceState(null, '', '#' + name);
  }

  // 地址 hash 指定页签：#<页签名>，如 number.html#divisor。
  // 首页每条工具都带着 href="./page.html#tab" 过来，没有它就永远落回默认页签。
  function hashTab() {
    var h = String(global.location && global.location.hash || '').replace(/^#/, '');
    return /^[a-z0-9]+$/i.test(h) ? h : null;
  }

  // 页面「认不认」这个页签：不带页签按钮的页面（首页、放假日历、专项页）一律不认，
  // 别让上一条留在地址里的 #source 之类被它们接了去。
  function hasTab(name) {
    var scope = global.__PAGE__ || document;
    return [].slice.call(scope.querySelectorAll('#tabs button'))
      .some(function (b) { return b.dataset.tab === name; });
  }

  // 打开页面时该选哪个页签：优先地址 hash（且必须是本页真实存在的页签），否则 defaultTab。
  // 只有「本页真的有这个页签」时才算数：#<页签名> 在整站单文件里是全局的，切页/返回首页
  // 都会把它带过去，本页没有同名页签就当成没写过——否则上一页的 #ssl 能把这一页顶到默认页签。
  function firstTab(defaultTab) {
    var want = hashTab();
    if (!want) return defaultTab;
    return hasTab(want) ? want : defaultTab;
  }

  // ---- 整站单文件（多页合一）支持 ----
  // 手机从「下载 / 文件管理器」打开时走 content:// URI：页面里 ./xxx.html 这类「跳到另一个
  // 文件」的链接会被拦下，报「文件找不到」。内联只解决了 css/js 子资源，解决不了跨页跳转。
  // 于是把全部页面装进同一个文档、每个页面一个 <section class="page" id="page-xxx.html">，
  // 点链接改成文档内切 section。散装单页里没有这些 section，一切维持原样。
  // 地址栏只记「在哪一页」（#page=web.html），页签状态不写地址：#<页签名> 这个通道被
  // 各页自己的页签逻辑占着（如 checksum.html 会把它改写成 #crc），争它只会互相踩。
  var PAGE_SEL = 'main > section.page';

  function isHost() { return !!document.querySelector(PAGE_SEL); }

  function pageEl(name) { return document.querySelector(PAGE_SEL + '[data-name="' + name + '"]'); }

  // 单文件里页签只放内存，地址栏改记「当前在哪一页」：#page=web.html。
  // 记它有两个用处：一是把上一页残留的 #ssl 这类页签顶掉，二是在手机上切后台被浏览器
  // 回收后重新加载，还能落回原来那一页，而不是一起回到首页。不写也不会坏，只是回到首页。
  function hashPage() {
    var h = String(global.location && global.location.hash || '').replace(/^#/, '');
    var m = /^(?:page=|\/)?([a-z0-9_-]+\.html)$/i.exec(h);
    return m ? m[1].toLowerCase() : null;
  }

  function applyPageHash(name) {
    if (!isHost() || !global.history || !global.history.replaceState) return;
    global.history.replaceState(null, '', '#page=' + name);
  }

  // 切到某页：只显示这一页、把它的脚本拉起来一次（首访），并同步 hash 与标题。
  function go(name) {
    if (!isHost()) return true;
    name = String(name || '').toLowerCase();
    var want = pageEl(name);
    if (!want) return true;                 // 不认识的页，交回浏览器
    [].slice.call(document.querySelectorAll(PAGE_SEL)).forEach(function (sec) {
      var on = sec === want;
      sec.hidden = !on;
      if ('inert' in sec) sec.inert = !on;
    });
    global.__PAGE__ = want;
    document.title = (want.dataset.title || name) + ' · 工具合集';
    applyPageHash(name);
    global.scrollTo(0, 0);
    // 本页脚本在合成时收进了 <script type="text/x-page-init">，首访才按顺序逐条执行：
    // 不执行的话，页里那些 document.getElementById 会先撞上别页的同名元素。
    // 注意是「逐条」：随页面内联进来的第三方库（DOMPurify、marked、bwip-js）在本页脚本
    // 之前各占一条，只跑第一条的话，本页脚本永远轮不到，按钮点了没反应、页签也切不动。
    var lazy = [].slice.call(want.querySelectorAll('script[type="text/x-page-init"]'));
    if (lazy.length && !want.dataset.ready) {
      want.dataset.ready = '1';
      lazy.forEach(function (src) {
        var run = document.createElement('script');
        run.textContent = src.textContent;
        document.body.appendChild(run);
        run.remove();
      });
    }
    return false;
  }

  // 文档内所有「去某页」的点击：带 data-page 的链接、./xxx.html 链接都接管
  function bindNav() {
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest && e.target.closest('a');
      if (!a) return;
      var name = a.dataset.page ||
        ((a.getAttribute('href') || '').match(/([a-z0-9_-]+\.html)(?:$|#)/i) || [])[1];
      if (name && go(name) === false) e.preventDefault();
    });
  }

  // 首屏落首页：单文件里没有「外部直接进来」的入口，一律从首页开始
  function boot() {
    if (!isHost()) return;
    if (global.__PAGE__) return;            // 已有活动页，别覆盖
    var want = hashPage();
    if (!want || !pageEl(want)) want = pageEl('index.html') ? 'index.html'
      : document.querySelector(PAGE_SEL).dataset.name;
    go(want);
    bindNav();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  global.T = { $: $, el: el, fmt: fmt, fmtInput: fmtInput, cells: cells, copy: copy, bindCopy: bindCopy, tabs: tabs, hashTab: hashTab, firstTab: firstTab, syncHash: syncHash, markTab: markTab, hasTab: hasTab, go: go };
})(window);
</script>
<script>
/* 几何与电子计算：平面图形、立体图形、三角函数、电阻网络
   纯函数先集中定义，便于 tools/check_algos.mjs 直接取向量验证。 */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var PI = Math.PI;

  function num(v) {
    if (v === '' || v == null) return NaN;
    var n = Number(v);
    return isFinite(n) ? n : NaN;
  }
  // 保留 6 位有效小数并去尾零，避免 1.2000000000000002
  function r6(n) {
    if (!isFinite(n)) return '—';
    var v = Number(n.toPrecision(12));
    return String(Number(v.toFixed(6)));
  }
  function r6n(n) { return Number(Number(n.toPrecision(12)).toFixed(6)); }

  /* ---------- 平面图形 ----------
     每个图形给出输入字段与 compute，compute 返回 [标签, 值, 代入说明][] */
  var PLANE = {
    square: {
      name: '正方形 / 矩形',
      fields: [{ id: 'a', label: '边长 a' }, { id: 'b', label: '边长 b（正方形时与 a 相同）', def: 1 }],
      svg: '<svg viewBox="0 0 96 96"><rect class="f" x="14" y="20" width="68" height="56"/><rect class="o" x="14" y="20" width="68" height="56"/>' +
        '<text x="44" y="88">a</text><text x="88" y="52">b</text></svg>',
      formula: '面积 = a × b，周长 = 2 × (a + b)，对角线 = √(a² + b²)',
      compute: function (v) {
        var a = num(v.a), b = num(v.b);
        if (!(a > 0) || !(b > 0)) return null;
        var area = a * b, peri = 2 * (a + b), diag = Math.sqrt(a * a + b * b);
        return {
          rows: [['面积', r6(area), ''], ['周长', r6(peri), ''], ['对角线', r6(diag), '']],
          steps: ['S = ' + r6(a) + ' × ' + r6(b) + ' = ' + r6(area),
            'C = 2 × (' + r6(a) + ' + ' + r6(b) + ') = ' + r6(peri),
            'd = √(' + r6(a) + '² + ' + r6(b) + '²) = ' + r6(diag)]
        };
      }
    },
    parallelogram: {
      name: '平行四边形',
      fields: [{ id: 'a', label: '底边 a' }, { id: 'h', label: '高 h', def: 1 }, { id: 'b', label: '邻边 b（算周长用）', def: 1 }],
      svg: '<svg viewBox="0 0 96 96"><path class="f" d="M20 26 L72 26 L76 78 L24 78 Z"/>' +
        '<path class="o" d="M20 26 L72 26 L76 78 L24 78 Z"/><path class="l" d="M20 26 L20 78"/>' +
        '<text x="46" y="20">a</text><text x="12" y="56">h</text></svg>',
      formula: '面积 = 底 × 高，周长 = 2 × (底 + 邻边)',
      compute: function (v) {
        var a = num(v.a), h = num(v.h), b = num(v.b);
        if (!(a > 0) || !(h > 0)) return null;
        var area = a * h;
        var out = {
          rows: [['面积', r6(area), '']],
          steps: ['S = ' + r6(a) + ' × ' + r6(h) + ' = ' + r6(area)]
        };
        if (b > 0) {
          var peri = 2 * (a + b);
          out.rows.push(['周长', r6(peri), '']);
          out.steps.push('C = 2 × (' + r6(a) + ' + ' + r6(b) + ') = ' + r6(peri));
        }
        return out;
      }
    },
    trapezoid: {
      name: '梯形',
      fields: [{ id: 'a', label: '上底 a', def: 1 }, { id: 'b', label: '下底 b', def: 2 }, { id: 'h', label: '高 h', def: 1 }, { id: 'c', label: '腰 c（算周长用）', def: 0 }, { id: 'd', label: '腰 d（算周长用）', def: 0 }],
      svg: '<svg viewBox="0 0 96 96"><path class="f" d="M32 24 L64 24 L78 76 L18 76 Z"/>' +
        '<path class="o" d="M32 24 L64 24 L78 76 L18 76 Z"/><path class="l" d="M32 24 L32 76"/>' +
        '<text x="44" y="18">a</text><text x="44" y="90">b</text><text x="26" y="52">h</text></svg>',
      formula: '面积 = (上底 + 下底) × 高 ÷ 2，周长 = 上底 + 下底 + 两腰',
      compute: function (v) {
        var a = num(v.a), b = num(v.b), h = num(v.h);
        if (!(a > 0) || !(b > 0) || !(h > 0)) return null;
        var area = (a + b) * h / 2;
        var out = {
          rows: [['面积', r6(area), ''], ['中位线', r6((a + b) / 2), '']],
          steps: ['S = (' + r6(a) + ' + ' + r6(b) + ') × ' + r6(h) + ' ÷ 2 = ' + r6(area)]
        };
        var c = num(v.c), d = num(v.d);
        if (c > 0 && d > 0) {
          var peri = a + b + c + d;
          out.rows.push(['周长', r6(peri), '']);
          out.steps.push('C = ' + r6(a) + ' + ' + r6(b) + ' + ' + r6(c) + ' + ' + r6(d) + ' = ' + r6(peri));
        }
        return out;
      }
    }
  };

  /* ---------- 立体图形 ---------- */
  var SOLID = {
    cube: {
      name: '正方体',
      fields: [{ id: 'a', label: '棱长 a' }],
      svg: '<svg viewBox="0 0 96 96"><path class="f" d="M20 34 L56 34 L56 76 L20 76 Z"/>' +
        '<path class="o" d="M20 34 L56 34 L56 76 L20 76 Z M20 34 L34 20 L70 20 L56 34 M56 76 L70 62 L70 20 M70 62 L34 62 L34 20"/>' +
        '<text x="34" y="88">a</text></svg>',
      formula: '表面积 = 6a²，体积 = a³，体对角线 = √3·a',
      compute: function (v) {
        var a = num(v.a);
        if (!(a > 0)) return null;
        return {
          rows: [['表面积', r6(6 * a * a), 'm²'], ['体积', r6(a * a * a), 'm³'],
            ['单面面积', r6(a * a), 'm²'], ['体对角线', r6(Math.sqrt(3) * a), 'm']],
          steps: ['S = 6 × ' + r6(a) + '² = ' + r6(6 * a * a),
            'V = ' + r6(a) + '³ = ' + r6(a * a * a)]
        };
      }
    },
    cuboid: {
      name: '长方体',
      fields: [{ id: 'a', label: '长 a' }, { id: 'b', label: '宽 b', def: 1 }, { id: 'c', label: '高 c', def: 1 }],
      svg: '<svg viewBox="0 0 96 96"><path class="f" d="M16 40 L52 40 L52 78 L16 78 Z"/>' +
        '<path class="o" d="M16 40 L52 40 L52 78 L16 78 Z M16 40 L32 24 L68 24 L52 40 M52 78 L68 62 L68 24 M68 62 L32 62 L32 24"/>' +
        '<text x="30" y="90">a</text></svg>',
      formula: '表面积 = 2(ab + bc + ac)，体积 = abc，体对角线 = √(a² + b² + c²)',
      compute: function (v) {
        var a = num(v.a), b = num(v.b), c = num(v.c);
        if (!(a > 0) || !(b > 0) || !(c > 0)) return null;
        return {
          rows: [['表面积', r6(2 * (a * b + b * c + a * c)), 'm²'], ['体积', r6(a * b * c), 'm³'],
            ['体对角线', r6(Math.sqrt(a * a + b * b + c * c)), 'm']],
          steps: ['S = 2 × (' + r6(a * b) + ' + ' + r6(b * c) + ' + ' + r6(a * c) + ') = ' + r6(2 * (a * b + b * c + a * c)),
            'V = ' + r6(a) + ' × ' + r6(b) + ' × ' + r6(c) + ' = ' + r6(a * b * c)]
        };
      }
    },
    cylinder: {
      name: '圆柱体',
      fields: [{ id: 'r', label: '底面半径 r' }, { id: 'h', label: '高 h', def: 1 }],
      svg: '<svg viewBox="0 0 96 96"><path class="f" d="M22 34 L22 70 A26 12 0 0 0 74 70 L74 34 Z"/>' +
        '<ellipse class="f" cx="48" cy="34" rx="26" ry="12"/>' +
        '<path class="o" d="M22 34 L22 70 A26 12 0 0 0 74 70 L74 34"/><ellipse class="o" cx="48" cy="34" rx="26" ry="12"/>' +
        '<path class="l" d="M48 34 L74 34"/><text x="56" y="30">r</text><text x="78" y="54">h</text></svg>',
      formula: '侧面积 = 2πrh，表面积 = 2πr² + 2πrh，体积 = πr²h',
      compute: function (v) {
        var r = num(v.r), h = num(v.h);
        if (!(r > 0) || !(h > 0)) return null;
        var lat = 2 * PI * r * h, base = PI * r * r, area = 2 * base + lat, vol = base * h;
        return {
          rows: [['表面积', r6(area), 'm²'], ['侧面积', r6(lat), 'm²'], ['底面积', r6(base), 'm²'],
            ['体积', r6(vol), 'm³'], ['底面周长', r6(2 * PI * r), 'm']],
          steps: ['S侧 = 2π × ' + r6(r) + ' × ' + r6(h) + ' = ' + r6(lat),
            'S = 2π × ' + r6(r) + '² + ' + r6(lat) + ' = ' + r6(area),
            'V = π × ' + r6(r) + '² × ' + r6(h) + ' = ' + r6(vol)]
        };
      }
    },
    cone: {
      name: '圆锥',
      fields: [{ id: 'r', label: '底面半径 r' }, { id: 'h', label: '高 h', def: 1 }],
      svg: '<svg viewBox="0 0 96 96"><path class="f" d="M48 16 L74 70 A26 12 0 0 1 22 70 Z"/>' +
        '<path class="o" d="M48 16 L74 70 A26 12 0 0 1 22 70 Z"/><ellipse class="o" cx="48" cy="70" rx="26" ry="12"/>' +
        '<path class="l" d="M48 70 L48 16"/><path class="l" d="M48 70 L74 70"/>' +
        '<text x="56" y="50">h</text><text x="62" y="80">r</text></svg>',
      formula: '母线 l = √(r² + h²)，侧面积 = πrl，表面积 = πr² + πrl，体积 = πr²h ÷ 3',
      compute: function (v) {
        var r = num(v.r), h = num(v.h);
        if (!(r > 0) || !(h > 0)) return null;
        var l = Math.sqrt(r * r + h * h), base = PI * r * r, lat = PI * r * l;
        return {
          rows: [['表面积', r6(base + lat), 'm²'], ['侧面积', r6(lat), 'm²'], ['底面积', r6(base), 'm²'],
            ['母线长', r6(l), 'm'], ['体积', r6(base * h / 3), 'm³']],
          steps: ['l = √(' + r6(r) + '² + ' + r6(h) + '²) = ' + r6(l),
            'S侧 = π × ' + r6(r) + ' × ' + r6(l) + ' = ' + r6(lat),
            'S = ' + r6(base) + ' + ' + r6(lat) + ' = ' + r6(base + lat),
            'V = π × ' + r6(r) + '² × ' + r6(h) + ' ÷ 3 = ' + r6(base * h / 3)]
        };
      }
    }
  };

  /* ---------- 三角函数 ---------- */
  function deg2rad(d) { return d * PI / 180; }
  function rad2deg(r) { return r * 180 / PI; }

  var TRIG = {
    sin: { label: '正弦 sin', formula: 'sin θ = 对边 ÷ 斜边', need: ['角度 θ（度）'] },
    cos: { label: '余弦 cos', formula: 'cos θ = 邻边 ÷ 斜边', need: ['角度 θ（度）'] },
    tan: { label: '正切 tan', formula: 'tan θ = 对边 ÷ 邻边', need: ['角度 θ（度）'] },
    atan: { label: '反正切 arctan', formula: 'arctan(x) 返回 −90° ~ 90° 之间的角度；x 可写成「对边/邻边」的分式', need: ['x 值（可填分式如 3/4）'] },
    asin: { label: '反正弦 arcsin', formula: 'arcsin(x) 返回 −90° ~ 90°，x 需在 −1 ~ 1', need: ['x 值'] },
    acos: { label: '反余弦 arccos', formula: 'arccos(x) 返回 0° ~ 180°，x 需在 −1 ~ 1', need: ['x 值'] }
  };

  // 支持 "3/4" 这类分式，省得先自己除一遍
  function parseFraction(s) {
    s = String(s == null ? '' : s).trim();
    if (!s) return NaN;
    if (s.indexOf('/') >= 0) {
      var p = s.split('/');
      if (p.length !== 2) return NaN;
      var a = Number(p[0]), b = Number(p[1]);
      if (!isFinite(a) || !isFinite(b) || b === 0) return NaN;
      return a / b;
    }
    var n = Number(s);
    return isFinite(n) ? n : NaN;
  }

  function trigCompute(kind, v) {
    var x;
    if (kind === 'atan' || kind === 'asin' || kind === 'acos') {
      x = parseFraction(v.x);
      if (!isFinite(x)) return null;
      var rad, note;
      if (kind === 'atan') { rad = Math.atan(x); note = x + ' 对应 ' + r6(rad) + ' 弧度'; }
      else if (kind === 'asin') {
        if (x < -1 || x > 1) return null;
        rad = Math.asin(x); note = 'x 在 −1~1 内';
      } else {
        if (x < -1 || x > 1) return null;
        rad = Math.acos(x); note = 'x 在 −1~1 内';
      }
      var deg = rad2deg(rad);
      var out = {
        rows: [['角度', r6(deg) + '°', ''], ['弧度', r6(rad), 'rad'], ['说明', note, '']],
        steps: [(kind === 'atan' ? 'arctan(' : kind === 'asin' ? 'arcsin(' : 'arccos(') + r6(x) + ') = ' + r6(deg) + '° = ' + r6(rad) + ' rad']
      };
      if (kind === 'atan') {
        // 补个常用表达，工程上三角形求角常用
        out.rows.push(['比值', r6(x), '']);
      }
      return out;
    }
    x = num(v.x);
    if (!isFinite(x)) return null;
    var rad2 = deg2rad(x);
    var val;
    if (kind === 'sin') val = Math.sin(rad2);
    else if (kind === 'cos') val = Math.cos(rad2);
    else {
      var c = Math.cos(rad2);
      if (Math.abs(c) < 1e-12) {
        return { rows: [['值', '未定义', ''], ['说明', 'cos θ = 0，tan θ 不存在', '']], steps: ['θ = ' + r6(x) + '° 时 cos θ = 0，tan θ 无定义'] };
      }
      val = Math.tan(rad2);
    }
    return {
      rows: [['函数值', r6(val), ''], ['角度', r6(x) + '°', ''], ['弧度', r6(rad2), 'rad']],
      steps: [kind + '(' + r6(x) + '°) = ' + r6(val)]
    };
  }

  /* ---------- 电阻网络 ---------- */
  function resistors(v) {
    var list = [];
    for (var i = 0; i < 4; i++) {
      var r = num(v['r' + (i + 1)]);
      if (r > 0) list.push({ n: i + 1, r: r });
    }
    if (!list.length) return null;
    return list;
  }

  function resCompute(kind, v) {
    var list = resistors(v);
    if (!list) return null;
    var u = num(v.u);
    var rows = [], steps = [];

    if (kind === 'series') {
      var sum = list.reduce(function (a, x) { return a + x.r; }, 0);
      rows.push(['串联总阻值', r6(sum) + ' Ω', '']);
      steps.push('R串 = ' + list.map(function (x) { return r6(x.r); }).join(' + ') + ' = ' + r6(sum) + ' Ω');
      if (u > 0) {
        var cur = u / sum;
        rows.push(['总电流', r6(cur) + ' A', '']);
        steps.push('I = U ÷ R = ' + r6(u) + ' ÷ ' + r6(sum) + ' = ' + r6(cur) + ' A');
        list.forEach(function (x) {
          rows.push(['R' + x.n + ' 分压', r6(cur * x.r) + ' V', '']);
        });
        rows.push(['功率', r6(u * cur) + ' W', '']);
      }
    } else if (kind === 'parallel') {
      var inv = list.reduce(function (a, x) { return a + 1 / x.r; }, 0);
      var rp = 1 / inv;
      rows.push(['并联总阻值', r6(rp) + ' Ω', '']);
      steps.push('1/R并 = ' + list.map(function (x) { return '1/' + r6(x.r); }).join(' + ') + ' ⇒ R并 = ' + r6(rp) + ' Ω');
      if (u > 0) {
        var total = u / rp;
        rows.push(['总电流', r6(total) + ' A', '']);
        steps.push('I总 = ' + r6(u) + ' ÷ ' + r6(rp) + ' = ' + r6(total) + ' A');
        list.forEach(function (x) {
          rows.push(['R' + x.n + ' 分流', r6(u / x.r) + ' A', '']);
        });
        rows.push(['总功率', r6(u * total) + ' W', '']);
      }
    } else if (kind === 'divider') {
      // 分压：按顺序串联，逐个算出对地电压
      if (list.length < 2) return null;
      if (!(u >= 0)) return null;
      var tot = list.reduce(function (a, x) { return a + x.r; }, 0);
      var cur2 = u / tot;
      rows.push(['回路电流', r6(cur2) + ' A', '']);
      // 从电源正极往下累计，逐个给出该节点对地电压
      var acc = 0;
      list.forEach(function (x) {
        acc += x.r;
        rows.push(['R' + x.n + ' 分压', r6(cur2 * x.r) + ' V', '']);
        rows.push(['R' + x.n + ' 后对地电压', r6(u - cur2 * acc) + ' V', '']);
      });
      steps.push('I = ' + r6(u) + ' ÷ ' + r6(tot) + ' = ' + r6(cur2) + ' A');
      list.forEach(function (x) { steps.push('U_R' + x.n + ' = I × ' + r6(x.r) + ' = ' + r6(cur2 * x.r) + ' V'); });
    }
    return { rows: rows, steps: steps, list: list };
  }

  /* ---------- 界面装配 ---------- */
  var TAB = 'plane';
  var SHAPE = { plane: 'square', solid: 'cube', trig: 'sin', res: 'series' };
  var TRIG_FIELD = { x: '角度 θ（度）' };

  function fieldsOf() {
    if (TAB === 'plane') return PLANE[SHAPE.plane].fields;
    if (TAB === 'solid') return SOLID[SHAPE.solid].fields;
    if (TAB === 'trig') return TRIG[SHAPE.trig].need.map(function (t, i) { return { id: 'x', label: t }; });
    return [
      { id: 'u', label: '电压 U（伏，可留空只算阻值）', def: 12 },
      { id: 'r1', label: 'R1（欧姆）', def: 100 },
      { id: 'r2', label: 'R2（欧姆）', def: 200 },
      { id: 'r3', label: 'R3（欧姆，可留空）' },
      { id: 'r4', label: 'R4（欧姆，可留空）' }
    ];
  }

  function buildFields() {
    var box = $('fields');
    box.innerHTML = '';
    fieldsOf().forEach(function (f) {
      var row = document.createElement('div');
      row.className = 'row';
      var lab = document.createElement('label');
      lab.textContent = f.label;
      var wrap = document.createElement('div');
      wrap.className = 'input-wrap';
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.id = f.id;
      inp.inputMode = 'decimal';
      inp.placeholder = f.hint || '';
      if (f.def != null) inp.value = String(f.def);
      wrap.appendChild(inp);
      row.appendChild(lab); row.appendChild(wrap);
      box.appendChild(row);
    });
  }

  function readValues() {
    var v = {};
    fieldsOf().forEach(function (f) { v[f.id] = $(f.id).value; });
    return v;
  }

  function setPreset(sel, map, box) {
    box.innerHTML = '';
    Object.keys(map).forEach(function (k) {
      var b = document.createElement('button');
      b.type = 'button';
      b.dataset.key = k;
      b.textContent = map[k].name || map[k].label;
      if (k === SHAPE[sel]) b.classList.add('on');
      box.appendChild(b);
    });
  }

  function renderShape() {
    var box = $('shape');
    var svg = '', cap = '';
    if (TAB === 'plane') { svg = PLANE[SHAPE.plane].svg; cap = PLANE[SHAPE.plane].formula; }
    else if (TAB === 'solid') { svg = SOLID[SHAPE.solid].svg; cap = SOLID[SHAPE.solid].formula; }
    else if (TAB === 'trig') {
      svg = '<svg viewBox="0 0 96 96"><path class="f" d="M14 76 L82 76 L82 30 Z"/>' +
        '<path class="o" d="M14 76 L82 76 L82 30 Z"/><path class="l" d="M26 76 L26 68 L34 68 L34 76"/>' +
        '<text x="40" y="90">邻边</text><text x="84" y="56">对边</text><text x="30" y="42">斜边</text></svg>';
      cap = TRIG[SHAPE.trig].formula;
    } else {
      svg = '<svg viewBox="0 0 96 96"><rect class="f" x="8" y="30" width="26" height="36"/><path class="o" d="M8 30 h26 v36 h-26 Z"/>' +
        '<path class="o" d="M60 30 h26 M60 48 h26 M60 66 h26 M60 30 v36 M86 30 v36"/></svg>';
      cap = '串联 R = R1 + R2 + …；并联 1/R = 1/R1 + 1/R2 + …；分压 U_i = U × R_i ÷ ΣR';
    }
    box.innerHTML = svg + '<div class="cap">' + cap + '</div>';
  }

  function buildPickers() {
    var host = $('fields').parentNode;
    var old = host.querySelector('#pickers');
    if (old) old.remove();
    var map = TAB === 'plane' ? PLANE : TAB === 'solid' ? SOLID : TAB === 'trig' ? TRIG :
      { series: { name: '串联' }, parallel: { name: '并联' }, divider: { name: '分压' } };
    var box = document.createElement('div');
    box.className = 'chips';
    box.id = 'pickers';
    setPreset(TAB, map, box);
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      SHAPE[TAB] = b.dataset.key;
      [].forEach.call(box.querySelectorAll('button'), function (o) { o.classList.toggle('on', o === b); });
      buildFields();
      renderShape();
      titleOf();
      run();
    });
    host.insertBefore(box, $('fields'));
  }

  function titleOf() {
    var t = '';
    if (TAB === 'plane') t = '平面图形面积与周长 · ' + PLANE[SHAPE.plane].name;
    else if (TAB === 'solid') t = '立体图形表面积与体积 · ' + SOLID[SHAPE.solid].name;
    else if (TAB === 'trig') t = '三角函数计算 · ' + TRIG[SHAPE.trig].label;
    else t = '电阻网络计算 · ' + ({ series: '串联', parallel: '并联', divider: '分压' }[SHAPE.res]);
    $('panel-title').textContent = t;
  }

  function run() {
    var v = readValues();
    var res, formula = '';
    if (TAB === 'plane') { res = PLANE[SHAPE.plane].compute(v); formula = PLANE[SHAPE.plane].formula; }
    else if (TAB === 'solid') { res = SOLID[SHAPE.solid].compute(v); formula = SOLID[SHAPE.solid].formula; }
    else if (TAB === 'trig') { res = trigCompute(SHAPE.trig, v); formula = TRIG[SHAPE.trig].formula; }
    else { res = resCompute(SHAPE.res, v); formula = '串联 R = ΣR；并联 1/R = Σ(1/Ri)；分压 U_i = I × R_i'; }

    $('formula').innerHTML = '<b>公式</b>　' + formula;
    var grid = $('grid'), out = $('output');

    if (!res) {
      grid.innerHTML = '';
      out.className = 'out err';
      out.textContent = TAB === 'trig' ? '请输入有效数值（arcsin/arccos 的 x 需在 −1 ~ 1）。' : '请输入大于 0 的数值。';
      return;
    }
    T.cells(grid, res.rows.map(function (r) { return [r[0], r[1] + (r[2] ? ' ' + r[2] : '')]; }));
    out.className = 'out';
    out.textContent = '';
    res.steps.forEach(function (s, i) {
      var b = document.createElement('div');
      b.textContent = (i === 0 ? '① ' : i === 1 ? '② ' : i === 2 ? '③ ' : '· ') + s;
      out.appendChild(b);
    });
    $('hint').textContent = '';
  }

  /* 页签 */
  function setTab(name) {
    TAB = name;
    T.markTab(name);
    buildPickers();
    buildFields();
    renderShape();
    titleOf();
    run();
  }
  T.tabs($('tabs'), setTab);

  $('run').addEventListener('click', run);
  $('reset').addEventListener('click', function () {
    buildFields();
    run();
  });
  $('fields').addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });

  setTab(T.firstTab('plane'));

  // 供测试脚本取纯函数
  window.__geometry = {
    PLANE: PLANE, SOLID: SOLID, TRIG: TRIG, parseFraction: parseFraction,
    trigCompute: trigCompute, resCompute: resCompute, deg2rad: deg2rad, rad2deg: rad2deg, r6: r6
  };
})();
</script>
