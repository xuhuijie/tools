<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1668dc">
<title>文字与文本</title>
<link rel="stylesheet" href="./app.css">
<style>
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .acts button{padding:0 12px;height:34px;font-size:13px;border-radius:9px;background:#fff;color:var(--text);border:1px solid var(--line)}
  .acts button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .stat-grid div{background:#fff;padding:10px 12px}
  .stat-grid .k{font-size:12px;color:var(--sub)}
  .stat-grid .v{font-size:17px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
  .syn-hint{font-size:12px;color:var(--sub);line-height:1.6;background:#f7f8fa;border-radius:10px;padding:10px 12px;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <h1>文字与文本</h1>
  <p>排版 · 全半角 · 去重 · 字数统计 · 大小写 · 同义词</p>
</header>

<main>
  <div class="tabs" id="tabs">
    <button data-tab="typeset" class="on">文字排版</button>
    <button data-tab="count">字数统计</button>
    <button data-tab="dedup">文本去重</button>
    <button data-tab="case">大小写转换</button>
    <button data-tab="syn">同义词替换</button>
  </div>

  <section class="card">
    <h2>输入</h2>
    <textarea id="in" style="min-height:150px" placeholder="在此粘贴文本"></textarea>
    <p class="hint" id="hint"></p>
  </section>

  <section class="card" id="opt-card">
    <h2 id="opt-title">选项</h2>
    <div class="acts" id="acts"></div>
    <p class="syn-hint" id="opt-note" hidden></p>
  </section>

  <div class="btns">
    <button type="button" class="ghost" id="swap">取回结果</button>
    <button type="button" class="primary" id="run">处理</button>
  </div>

  <section class="card">
    <h2>结果</h2>
    <div class="stat-grid" id="stats" hidden></div>
    <div class="out" id="out" style="white-space:pre-wrap"></div>
    <p class="hint err" id="err" hidden></p>
    <button type="button" class="ghost" id="copy" style="width:100%;height:44px;font-size:15px;font-weight:600;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:12px">复制结果</button>
  </section>

  <footer>
    纯本地计算，不上传任何内容<br>
    <a href="./tools.html">← 工具目录</a>·<a href="./index.html">工具入口</a>
  </footer>
</main>

<script src="./app.js"></script>
<script src="./text.js"></script>
</body>
</html>
