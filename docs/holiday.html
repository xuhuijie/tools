<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1668dc">
<title>放假安排</title>
<style>
/* 工具页共用样式：与仓库既有单文件页保持同一套视觉，抽出来避免十个页面各写一遍 */
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1f2329;--sub:#8a9099;--line:#e8eaed;
  --primary:#1668dc;--primary-press:#0f52b3;--soft:#e8f1fd;--soft-line:#c3dbfb;
  --warn:#d4380d;--ok:#0f8f74;--radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
header{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(135deg,#1668dc,#3b8bf0);color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
header h1{margin:0;font-size:17px;font-weight:600}
header p{margin:4px 0 0;font-size:12px;opacity:.9}
main{max-width:1280px;margin:0 auto;padding:12px 16px 0}
.card{
  background:var(--card);border-radius:var(--radius);
  padding:14px 14px 2px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.card h2{margin:0 0 10px;font-size:14px;font-weight:600}
.row{margin-bottom:12px}
.row label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.row label b{color:var(--text);font-weight:500}
.input-wrap{position:relative;display:flex;align-items:center}
input[type="number"],input[type="text"],input[type="datetime-local"],select{
  width:100%;height:46px;padding:0 12px;
  font-size:16px;color:var(--text);
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  outline:none;font-family:inherit;
}
input[type="number"]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus,select:focus{border-color:var(--primary);background:#fff}
input.invalid{border-color:var(--warn);background:#fff2ef}
.input-wrap .unit{position:absolute;right:12px;font-size:12px;color:var(--sub);pointer-events:none}
.input-wrap input[type="number"]{padding-right:64px}
textarea{
  width:100%;min-height:130px;padding:10px 12px;
  font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--text);
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  outline:none;resize:vertical;
}
textarea:focus{border-color:var(--primary);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin:2px 0 14px}
.btns button{flex:1;height:48px;font-size:16px;font-weight:600;border-radius:12px;border:none}
.btns button.primary{background:var(--primary);color:#fff}
.btns button.primary:active{background:var(--primary-press)}
.btns button.ghost{flex:0 0 96px;background:#fff;color:var(--text);border:1px solid var(--line)}
.btns.three button.ghost{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{
  padding:0 12px;height:32px;font-size:13px;color:var(--primary);
  background:var(--soft);border:1px solid var(--soft-line);border-radius:9px;
}
.chips button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.hint{font-size:12px;color:var(--sub);margin:6px 0 0;line-height:1.5}
.hint.err{color:var(--warn)}
.out{
  font:13px/1.7 ui-monospace,Menlo,Consolas,monospace;
  background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:12px;word-break:break-all;white-space:pre-wrap;
}
.out:empty{display:none}
.out.mono-lg{font-size:15px}
.out.err{color:var(--warn);background:#fff2ef;border-color:#ffd6cf}
.out.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.grid div{background:#fff;padding:10px 12px}
.grid .k{font-size:12px;color:var(--sub)}
.grid .v{font-size:16px;font-weight:600;margin-top:2px;word-break:break-all}
.formula{
  font-size:12px;color:var(--sub);line-height:1.6;
  background:#f7f8fa;border-radius:10px;padding:10px 12px;margin-bottom:12px;
  word-break:break-all;
}
.formula .t{color:var(--text);font-weight:600}
.formula code{font-family:ui-monospace,Menlo,Consolas,monospace;color:#4b5563}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);word-break:break-all}
th{color:var(--sub);font-weight:500}
td.num{font-family:ui-monospace,Menlo,Consolas,monospace}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pick button{
  padding:0 12px;height:34px;font-size:13px;border-radius:9px;
  background:#fff;color:var(--text);border:1px solid var(--line);
}
.pick button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.list{margin:0 0 12px;padding:0;list-style:none}
.list li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:none}
.list a{color:var(--primary);text-decoration:none;font-weight:500}
.list .d{display:block;font-size:12px;color:var(--sub);margin-top:2px;line-height:1.45}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.tabs button{
  flex:0 0 auto;padding:0 14px;height:34px;font-size:13px;border-radius:9px;
  background:#fff;color:var(--sub);border:1px solid var(--line);
}
.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
footer{max-width:1280px;margin:0 auto;padding:0 16px;font-size:12px;color:var(--sub);text-align:center;line-height:1.7}
footer a{color:var(--primary);text-decoration:none;margin:0 6px}
@media(max-width:360px){.grid2{grid-template-columns:1fr}}
</style>
<style>
  .note{font-size:12px;color:var(--sub);line-height:1.65;background:#f7f8fa;border-radius:10px;padding:10px 12px;margin-bottom:12px}
  .note b{color:var(--text)}
  .seg{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .seg button{padding:0 12px;height:34px;font-size:13px;border-radius:9px;background:#fff;color:var(--sub);border:1px solid var(--line)}
  .seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .fest{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .fest .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .fest .name{font-size:15px;font-weight:600}
  .fest .days{font-size:12px;color:var(--primary);background:var(--soft);border-radius:7px;padding:2px 7px}
  .fest .range{font-size:13px;color:var(--text);margin-top:6px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .fest .work{font-size:12px;color:var(--warn);margin-top:5px}
  .fest .desc{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.6}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px}
  .cal .h{text-align:center;font-size:11px;color:var(--sub);padding:4px 0}
  .cal .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;
    font-size:13px;background:#fff;border:1px solid var(--line);position:relative}
  .cal .d.empty{background:transparent;border:none}
  .cal .d.rest{background:#e7f8f1;border-color:#b7e6d8;color:#0a7a5f;font-weight:600}
  .cal .d.fest{background:#fdeeea;border-color:#f6c9c0;color:#a8291a;font-weight:600}
  .cal .d.work{background:#fff5e0;border-color:#f3ddb0;color:#8a5b00;font-weight:600}
  .cal .d .t{position:absolute;bottom:2px;font-size:8px;font-weight:400;color:inherit;opacity:.8}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-bottom:12px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
  .count{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .count div{background:#fff;padding:10px 6px;text-align:center}
  .count b{display:block;font-size:19px;font-weight:700;color:var(--primary)}
  .count span{display:block;font-size:11px;color:var(--sub);margin-top:2px}
</style>
</head>
<body>
<header>
  <h1>放假安排</h1>
  <p>2025 / 2026 法定节假日 · 调休与补班日历</p>
</header>

<main>

  <div class="seg" id="year-seg">
    <button data-year="2025" class="on">2025 年</button>
    <button data-year="2026">2026 年</button>
  </div>

  <div class="count" id="count"></div>

  <section class="card">
    <h2>日历</h2>
    <div class="seg" id="month-seg"></div>
    <div class="cal" id="cal-head"></div>
    <div class="cal" id="cal"></div>
    <div class="legend">
      <span><i style="background:#fdeeea"></i>法定节假日</span>
      <span><i style="background:#e7f8f1"></i>周末休息</span>
      <span><i style="background:#fff5e0"></i>调休上班</span>
      <span><i style="background:#fff;border:1px solid var(--line)"></i>正常工作日</span>
    </div>
    <p class="hint">
      日历按国务院办公厅每年公布的放假安排生成（数据内置在页面里，不联网）。
      格子右下角小字是节日简称。
    </p>
  </section>

  <section class="card">
    <h2>放假明细</h2>
    <div id="list"></div>
  </section>

  <div class="note">
    <b>口径说明。</b>本页收录 2025 与 2026 年国务院办公厅公布的放假安排。
    法定节假日当天加班按 300% 计薪，调休日与周末加班按 200%（或安排补休）；
    具体到你的工资怎么算，还受工时制（标准/综合/不定时）影响。
    港澳台与部分少数民族地区有各自的假期安排，不在本页范围内。
  </div>

  <footer>
    数据为内置静态表，离线可用；以国务院办公厅当年通知为准<br>
    <a href="./index.html">返回首页</a>
  </footer>
</main>

<script>
/* 工具页共用小工具：取元素、格式化、复制、页签切换 */
(function (global) {
  'use strict';

  // 复制到剪贴板：HTTPS/本地才用异步 API，其余回退到 execCommand
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacy(text); });
    }
    return Promise.resolve(legacy(text));
  }

  function legacy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  // 保留 digits 位小数并去掉长浮点尾巴
  function fmt(n, digits) {
    if (!isFinite(n)) return '—';
    var d = digits == null ? 4 : digits;
    return Number(n.toFixed(d)).toLocaleString('zh-CN', { maximumFractionDigits: d });
  }

  // 写回输入框的数值，避免 0.30000000000000004 这类尾巴
  function fmtInput(n, digits) {
    if (!isFinite(n)) return '';
    return String(Number(n.toFixed(digits == null ? 6 : digits)));
  }

  // 页面 id 查找：散装单页就是全局 getElementById；多页合一（整站单文件）时先在本页
  // section 里找。各页原本共用同一套 id（tabs、input、output…），合到一份文档里会互相
  // 抢，所以查找必须限定在当前显示的那页——这样各页脚本一字不改也能各找各的。
  function $(id) {
    var scope = global.__PAGE__;
    if (scope) {
      var hit = scope.querySelector('[id="' + id + '"]');
      if (hit) return hit;
    }
    return document.getElementById(id);
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  // 在容器内渲染 label/value 网格
  function cells(container, pairs) {
    container.innerHTML = '';
    pairs.forEach(function (p) {
      var cell = el('div');
      cell.appendChild(el('div', 'k', p[0]));
      cell.appendChild(el('div', 'v', p[1]));
      container.appendChild(cell);
    });
  }

  // 复制按钮通用绑定：btn 复制 target 的文本，成功后短暂改文案
  function bindCopy(btn, getText, doneText) {
    if (!btn) return;
    var original = btn.textContent;
    btn.addEventListener('click', function () {
      var text = getText();
      if (!text) return;
      copy(text).then(function () {
        btn.textContent = doneText || '已复制';
        setTimeout(function () { btn.textContent = original; }, 1200);
      });
    });
  }

  // 页签：buttons 为一组按钮，onPick 收到 data-tab
  function tabs(container, onPick) {
    var btns = [].slice.call(container.querySelectorAll('button'));
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        btns.forEach(function (o) { o.classList.toggle('on', o === b); });
        syncHash(b.dataset.tab);
        onPick(b.dataset.tab, b);
      });
    });
    return btns;
  }

  // 把按钮高亮对齐到 name。点击时 tabs() 已经切过，但初始化是从 hash 进来的，
  // 未必等于 HTML 里写死 class="on" 的那个，所以各页的 setTab 里要再调一次。
  function markTab(name) {
    // 多页合一文档里 #tabs 会出现很多个，只能标当前页那个
    var scope = global.__PAGE__ || document;
    [].forEach.call(scope.querySelectorAll('#tabs button'), function (b) {
      b.classList.toggle('on', b.dataset.tab === name);
    });
  }

  // 切页签时把页签名写回地址，刷新与分享都能停在同一个工具上。
  // 整站单文件里 No-op：地址栏归页面导航用（见 applyPageHash），页签只活在内存里，
  // 免得「这一页的 #ssl」被带到下一页去抢页签。
  function syncHash(name) {
    if (isHost()) return;
    if (!global.history || !global.history.replaceState) return;
    global.history.replaceState(null, '', '#' + name);
  }

  // 地址 hash 指定页签：#<页签名>，如 number.html#divisor。
  // 首页每条工具都带着 href="./page.html#tab" 过来，没有它就永远落回默认页签。
  function hashTab() {
    var h = String(global.location && global.location.hash || '').replace(/^#/, '');
    return /^[a-z0-9]+$/i.test(h) ? h : null;
  }

  // 页面「认不认」这个页签：不带页签按钮的页面（首页、放假日历、专项页）一律不认，
  // 别让上一条留在地址里的 #source 之类被它们接了去。
  function hasTab(name) {
    var scope = global.__PAGE__ || document;
    return [].slice.call(scope.querySelectorAll('#tabs button'))
      .some(function (b) { return b.dataset.tab === name; });
  }

  // 打开页面时该选哪个页签：优先地址 hash（且必须是本页真实存在的页签），否则 defaultTab。
  // 只有「本页真的有这个页签」时才算数：#<页签名> 在整站单文件里是全局的，切页/返回首页
  // 都会把它带过去，本页没有同名页签就当成没写过——否则上一页的 #ssl 能把这一页顶到默认页签。
  function firstTab(defaultTab) {
    var want = hashTab();
    if (!want) return defaultTab;
    return hasTab(want) ? want : defaultTab;
  }

  // ---- 整站单文件（多页合一）支持 ----
  // 手机从「下载 / 文件管理器」打开时走 content:// URI：页面里 ./xxx.html 这类「跳到另一个
  // 文件」的链接会被拦下，报「文件找不到」。内联只解决了 css/js 子资源，解决不了跨页跳转。
  // 于是把全部页面装进同一个文档、每个页面一个 <section class="page" id="page-xxx.html">，
  // 点链接改成文档内切 section。散装单页里没有这些 section，一切维持原样。
  // 地址栏只记「在哪一页」（#page=web.html），页签状态不写地址：#<页签名> 这个通道被
  // 各页自己的页签逻辑占着（如 checksum.html 会把它改写成 #crc），争它只会互相踩。
  var PAGE_SEL = 'main > section.page';

  function isHost() { return !!document.querySelector(PAGE_SEL); }

  function pageEl(name) { return document.querySelector(PAGE_SEL + '[data-name="' + name + '"]'); }

  // 单文件里页签只放内存，地址栏改记「当前在哪一页」：#page=web.html。
  // 记它有两个用处：一是把上一页残留的 #ssl 这类页签顶掉，二是在手机上切后台被浏览器
  // 回收后重新加载，还能落回原来那一页，而不是一起回到首页。不写也不会坏，只是回到首页。
  function hashPage() {
    var h = String(global.location && global.location.hash || '').replace(/^#/, '');
    var m = /^(?:page=|\/)?([a-z0-9_-]+\.html)$/i.exec(h);
    return m ? m[1].toLowerCase() : null;
  }

  function applyPageHash(name) {
    if (!isHost() || !global.history || !global.history.replaceState) return;
    global.history.replaceState(null, '', '#page=' + name);
  }

  // 切到某页：只显示这一页、把它的脚本拉起来一次（首访），并同步 hash 与标题。
  function go(name) {
    if (!isHost()) return true;
    name = String(name || '').toLowerCase();
    var want = pageEl(name);
    if (!want) return true;                 // 不认识的页，交回浏览器
    [].slice.call(document.querySelectorAll(PAGE_SEL)).forEach(function (sec) {
      var on = sec === want;
      sec.hidden = !on;
      if ('inert' in sec) sec.inert = !on;
    });
    global.__PAGE__ = want;
    document.title = (want.dataset.title || name) + ' · 工具合集';
    applyPageHash(name);
    global.scrollTo(0, 0);
    // 本页脚本在合成时收进了 <script type="text/x-page-init">，首访才按顺序逐条执行：
    // 不执行的话，页里那些 document.getElementById 会先撞上别页的同名元素。
    // 注意是「逐条」：随页面内联进来的第三方库（DOMPurify、marked、bwip-js）在本页脚本
    // 之前各占一条，只跑第一条的话，本页脚本永远轮不到，按钮点了没反应、页签也切不动。
    var lazy = [].slice.call(want.querySelectorAll('script[type="text/x-page-init"]'));
    if (lazy.length && !want.dataset.ready) {
      want.dataset.ready = '1';
      lazy.forEach(function (src) {
        var run = document.createElement('script');
        run.textContent = src.textContent;
        document.body.appendChild(run);
        run.remove();
      });
    }
    return false;
  }

  // 文档内所有「去某页」的点击：带 data-page 的链接、./xxx.html 链接都接管
  function bindNav() {
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest && e.target.closest('a');
      if (!a) return;
      var name = a.dataset.page ||
        ((a.getAttribute('href') || '').match(/([a-z0-9_-]+\.html)(?:$|#)/i) || [])[1];
      if (name && go(name) === false) e.preventDefault();
    });
  }

  // 首屏落首页：单文件里没有「外部直接进来」的入口，一律从首页开始
  function boot() {
    if (!isHost()) return;
    if (global.__PAGE__) return;            // 已有活动页，别覆盖
    var want = hashPage();
    if (!want || !pageEl(want)) want = pageEl('index.html') ? 'index.html'
      : document.querySelector(PAGE_SEL).dataset.name;
    go(want);
    bindNav();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  global.T = { $: $, el: el, fmt: fmt, fmtInput: fmtInput, cells: cells, copy: copy, bindCopy: bindCopy, tabs: tabs, hashTab: hashTab, firstTab: firstTab, syncHash: syncHash, markTab: markTab, hasTab: hasTab, go: go };
})(window);
</script>
<script>
/* 放假安排：2025 / 2026 年法定节假日、调休与补班
   数据为内置静态表（照国务院办公厅通知逐条录入），不联网。
   dates 里写 0 表示那天调休上班。 */
(function () {
  'use strict';
  var $ = T.$;

  // 每年一份：fest 是法定节假日放假区间，makeup 是要上班的周末
  var DATA = {
    2025: [
      {
        name: '元旦', tag: '元旦', days: 1,
        rest: ['2025-01-01'],
        makeup: [],
        desc: '1 月 1 日放假 1 天，不调休。'
      },
      {
        name: '春节', tag: '春节', days: 8,
        rest: ['2025-01-28', '2025-01-29', '2025-01-30', '2025-01-31', '2025-02-01', '2025-02-02', '2025-02-03', '2025-02-04'],
        makeup: ['2025-01-26', '2025-02-08'],
        desc: '1 月 28 日（除夕）至 2 月 4 日放假调休，共 8 天。1 月 26 日（周日）、2 月 8 日（周六）上班。'
      },
      {
        name: '清明节', tag: '清明', days: 3,
        rest: ['2025-04-04', '2025-04-05', '2025-04-06'],
        makeup: [],
        desc: '4 月 4 日至 6 日放假，共 3 天，与周末连休。'
      },
      {
        name: '劳动节', tag: '劳动节', days: 5,
        rest: ['2025-05-01', '2025-05-02', '2025-05-03', '2025-05-04', '2025-05-05'],
        makeup: ['2025-04-27'],
        desc: '5 月 1 日至 5 日放假调休，共 5 天。4 月 27 日（周日）上班。'
      },
      {
        name: '端午节', tag: '端午', days: 3,
        rest: ['2025-05-31', '2025-06-01', '2025-06-02'],
        makeup: [],
        desc: '5 月 31 日至 6 月 2 日放假，共 3 天，与周末连休。'
      },
      {
        name: '国庆节、中秋节', tag: '国庆中秋', days: 8,
        rest: ['2025-10-01', '2025-10-02', '2025-10-03', '2025-10-04', '2025-10-05', '2025-10-06', '2025-10-07', '2025-10-08'],
        makeup: ['2025-09-28', '2025-10-11'],
        desc: '10 月 1 日至 8 日放假调休，共 8 天。9 月 28 日（周日）、10 月 11 日（周六）上班。'
      }
    ],
    2026: [
      {
        name: '元旦', tag: '元旦', days: 3,
        rest: ['2026-01-01', '2026-01-02', '2026-01-03'],
        makeup: [],
        desc: '1 月 1 日至 3 日放假，共 3 天，与周末连休。'
      },
      {
        name: '春节', tag: '春节', days: 9,
        rest: ['2026-02-15', '2026-02-16', '2026-02-17', '2026-02-18', '2026-02-19',
          '2026-02-20', '2026-02-21', '2026-02-22', '2026-02-23'],
        makeup: ['2026-02-14', '2026-02-28'],
        desc: '2 月 15 日（除夕前一日）至 23 日放假调休，共 9 天。2 月 14 日（周六）、2 月 28 日（周六）上班。'
      },
      {
        name: '清明节', tag: '清明', days: 3,
        rest: ['2026-04-04', '2026-04-05', '2026-04-06'],
        makeup: [],
        desc: '4 月 4 日至 6 日放假，共 3 天，与周末连休。'
      },
      {
        name: '劳动节', tag: '劳动节', days: 5,
        rest: ['2026-05-01', '2026-05-02', '2026-05-03', '2026-05-04', '2026-05-05'],
        makeup: ['2026-04-26'],
        desc: '5 月 1 日至 5 日放假调休，共 5 天。4 月 26 日（周日）上班。'
      },
      {
        name: '端午节', tag: '端午', days: 3,
        rest: ['2026-06-19', '2026-06-20', '2026-06-21'],
        makeup: [],
        desc: '6 月 19 日至 21 日放假，共 3 天，与周末连休。'
      },
      {
        name: '中秋节', tag: '中秋', days: 3,
        rest: ['2026-09-25', '2026-09-26', '2026-09-27'],
        makeup: [],
        desc: '9 月 25 日至 27 日放假，共 3 天，与周末连休。'
      },
      {
        name: '国庆节', tag: '国庆', days: 7,
        rest: ['2026-10-01', '2026-10-02', '2026-10-03', '2026-10-04', '2026-10-05', '2026-10-06', '2026-10-07'],
        makeup: ['2026-09-27', '2026-10-10'],
        desc: '10 月 1 日至 7 日放假调休，共 7 天。9 月 27 日（周日）、10 月 10 日（周六）上班。'
      }
    ]
  };

  var FESTIVAL_DATES = {
    '元旦': '01-01',
    '春节': '农历正月初一',
    '清明节': '04-04 前后',
    '劳动节': '05-01',
    '端午节': '农历五月初五',
    '中秋节': '农历八月十五',
    '国庆节': '10-01'
  };

  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  // 把一年的安排展开成「日期 → 状态」的映射，日历渲染与统计都用它
  function buildIndex(year) {
    var idx = {};   // 'YYYY-MM-DD' → { state: 'fest'|'makeup', tag, name }
    var list = DATA[year] || [];
    list.forEach(function (f) {
      f.rest.forEach(function (d) {
        idx[d] = { state: 'fest', tag: f.tag, name: f.name };
      });
      f.makeup.forEach(function (d) {
        idx[d] = { state: 'makeup', tag: '班', name: f.name };
      });
    });
    return idx;
  }

  // 全年逐日分类统计，顺便核对「放假天数」与安排表是否自洽
  function yearStats(year) {
    var idx = buildIndex(year);
    var days = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0) ? 366 : 365;
    var stat = { fest: 0, weekend: 0, makeup: 0, work: 0, total: days, festOnly: 0, makeupOnly: 0 };
    for (var i = 0; i < days; i++) {
      var d = new Date(year, 0, 1 + i);
      var key = ymd(d);
      var isWeekend = d.getDay() === 0 || d.getDay() === 6;
      var rec = idx[key];
      if (rec && rec.state === 'fest') {
        stat.fest++;
        if (!isWeekend) stat.festOnly++;   // 调休之外的「净」放假天数
      } else if (rec && rec.state === 'makeup') {
        stat.makeup++;
        stat.makeupOnly++;
      } else if (isWeekend) {
        stat.weekend++;
      } else {
        stat.work++;
      }
    }
    return stat;
  }

  // 一年里的「实际休息日总数」= 法定节假日 + 未调休的周末 - 被调休占用的周末
  function restDays(year) {
    var stat = yearStats(year);
    return stat.fest + stat.weekend;
  }

  var curYear = 2025, curMonth = 0;

  function renderSeg() {
    var seg = $('month-seg');
    seg.innerHTML = '';
    for (var m = 0; m < 12; m++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = (m + 1) + ' 月';
      b.dataset.m = String(m);
      if (m === curMonth) b.className = 'on';
      b.addEventListener('click', function () {
        curMonth = Number(this.dataset.m);
        renderCal();
      });
      seg.appendChild(b);
    }
  }

  function renderCal() {
    [].forEach.call($('month-seg').querySelectorAll('button'), function (b) {
      b.classList.toggle('on', Number(b.dataset.m) === curMonth);
    });
    var head = $('cal-head');
    head.innerHTML = '';
    WEEK.forEach(function (w) {
      var d = document.createElement('div');
      d.className = 'h';
      d.textContent = w;
      head.appendChild(d);
    });

    var idx = buildIndex(curYear);
    var first = new Date(curYear, curMonth, 1);
    var daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
    var cal = $('cal');
    cal.innerHTML = '';
    for (var i = 0; i < first.getDay(); i++) {
      var e = document.createElement('div');
      e.className = 'd empty';
      cal.appendChild(e);
    }
    for (var day = 1; day <= daysInMonth; day++) {
      var d2 = new Date(curYear, curMonth, day);
      var key = ymd(d2);
      var rec = idx[key];
      var isWeekend = d2.getDay() === 0 || d2.getDay() === 6;
      var el = document.createElement('div');
      el.className = 'd';
      if (rec && rec.state === 'fest') el.classList.add('fest');
      else if (rec && rec.state === 'makeup') el.classList.add('work');
      else if (isWeekend) el.classList.add('rest');
      el.textContent = String(day);
      if (rec) {
        var t = document.createElement('span');
        t.className = 't';
        t.textContent = rec.state === 'makeup' ? '班' : rec.tag.slice(0, 2);
        el.appendChild(t);
      }
      cal.appendChild(el);
    }
    return { year: curYear, month: curMonth + 1, days: daysInMonth };
  }

  function renderList() {
    var box = $('list');
    box.innerHTML = '';
    (DATA[curYear] || []).forEach(function (f) {
      var d = document.createElement('div');
      d.className = 'fest';
      var hd = document.createElement('div');
      hd.className = 'hd';
      var nm = document.createElement('span');
      nm.className = 'name';
      nm.textContent = f.name;
      var dy = document.createElement('span');
      dy.className = 'days';
      dy.textContent = '放假 ' + f.days + ' 天';
      hd.appendChild(nm); hd.appendChild(dy);
      d.appendChild(hd);

      var rg = document.createElement('div');
      rg.className = 'range';
      rg.textContent = shortRange(f.rest);
      d.appendChild(rg);

      if (f.makeup.length) {
        var mk = document.createElement('div');
        mk.className = 'work';
        mk.textContent = '调休上班：' + f.makeup.map(shortDate).join('、');
        d.appendChild(mk);
      }

      var ds = document.createElement('div');
      ds.className = 'desc';
      ds.textContent = f.desc;
      d.appendChild(ds);
      box.appendChild(d);
    });
  }

  function shortDate(s) {
    var p = s.split('-');
    return Number(p[1]) + ' 月 ' + Number(p[2]) + ' 日';
  }

  function shortRange(arr) {
    if (!arr.length) return '';
    return shortDate(arr[0]) + ' 至 ' + shortDate(arr[arr.length - 1]) + '（共 ' + arr.length + ' 天）';
  }

  function renderCount() {
    var stat = yearStats(curYear);
    var box = $('count');
    box.innerHTML = '';
    [['法定节假日', stat.fest], ['调休上班', stat.makeup], ['全年休息日', restDays(curYear)]].forEach(function (p) {
      var d = document.createElement('div');
      var b = document.createElement('b'); b.textContent = String(p[1]);
      var s = document.createElement('span'); s.textContent = p[0];
      d.appendChild(b); d.appendChild(s);
      box.appendChild(d);
    });
    return stat;
  }

  function renderAll() {
    renderSeg();
    renderCal();
    renderList();
    renderCount();
  }

  var yearBtns = $('year-seg').querySelectorAll('button');
  [].forEach.call(yearBtns, function (b) {
    b.addEventListener('click', function () {
      [].forEach.call(yearBtns, function (o) { o.classList.toggle('on', o === b); });
      curYear = Number(b.dataset.year);
      curMonth = 0;
      renderAll();
    });
  });

  renderAll();

  window.__holiday = {
    DATA: DATA, FESTIVAL_DATES: FESTIVAL_DATES,
    buildIndex: buildIndex, yearStats: yearStats, restDays: restDays,
    ymd: ymd, shortRange: shortRange
  };
})();
</script>
